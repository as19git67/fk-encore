name: Docker Image CI - LLM Service

on:
  push:
    branches: [ "main" ]
    tags:
      - '*'
    paths:
      - 'llm-service/**'
      - '.github/workflows/docker-image-llm.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'llm-service/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-llm

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install fastapi httpx pytest pydantic
        working-directory: llm-service

      - name: Run tests
        run: pytest tests/ -v
        working-directory: llm-service

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=test,enable=${{ github.event_name == 'pull_request' }}
            type=semver,pattern={{version}}

      - name: Extract metadata for CUDA image
        id: meta-gpu
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-gpu
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=test,enable=${{ github.event_name == 'pull_request' }}
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./llm-service
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push CUDA Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./llm-service
          file: ./llm-service/Dockerfile.gpu
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-gpu.outputs.tags }}
          labels: ${{ steps.meta-gpu.outputs.labels }}

      - name: Deploy to TrueNAS (test)
        if: github.event_name == 'pull_request'
        run: |
          curl -f -X POST \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            ${{ secrets.WATCHTOWER_URL_TEST }}/v1/update

      - name: Deploy to TrueNAS (latest)
        if: github.ref == 'refs/heads/main'
        run: |
          curl -f -X POST \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            ${{ secrets.WATCHTOWER_URL_PROD }}/v1/update
