name: Docker Image CI - LLM Service

# Both images compile llama-cpp-python from source — PyPI ships only an sdist,
# and the CPU build additionally needs custom CMAKE_ARGS to disable AVX-512 (see
# llm-service/Dockerfile). That compile is the entire cost of this workflow, so
# the shape below is built around not paying it twice:
#
#   * amd64 only. The deploy target is TrueNAS SCALE (x86-64); an arm64 leg
#     would run under QEMU emulation on the x86 runner, where a C++ compile is
#     roughly an order of magnitude slower than native.
#   * CPU and CUDA images build in parallel as a matrix instead of sequentially
#     in one job.
#   * A registry-backed buildx cache per variant, so a change that only touches
#     main.py (copied *after* the pip install) reuses the compiled layer instead
#     of rebuilding it. Registry rather than type=gha deliberately: the GitHub
#     Actions cache is capped at 10 GB per repository and the CUDA layers alone
#     would evict every other workflow's entries.
#
# The `buildcache` tag is protected from deletion in ghcr-cleanup.yml.

on:
  push:
    branches: [ "main" ]
    tags:
      - '*'
    paths:
      - 'llm-service/**'
      - '.github/workflows/docker-image-llm.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'llm-service/**'
      - '.github/workflows/docker-image-llm.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/llm

jobs:

  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install fastapi httpx pytest pydantic
        working-directory: llm-service

      - name: Run tests
        run: pytest tests/ -v
        working-directory: llm-service

  build:

    needs: test

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      # One variant failing must not cancel the other — a broken CUDA build
      # should still leave a publishable CPU image.
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            dockerfile: ./llm-service/Dockerfile
            suffix: ""
          - variant: cuda
            dockerfile: ./llm-service/Dockerfile.gpu
            suffix: "-gpu"

    name: build (${{ matrix.variant }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The CUDA image installs torch (cu128) plus a CUDA-compiled
      # llama-cpp-python on top of the nvidia/cuda devel+runtime base images —
      # together with buildx's layer cache that regularly exceeds the ~14 GB
      # free on a stock ubuntu-latest runner ("ResourceExhausted: no space
      # left on device" while writing the nvidia site-packages). Strip the
      # preinstalled toolchains the runner ships that this workflow never
      # uses to reclaim space before the build starts.
      - name: Free disk space
        if: matrix.variant == 'cuda'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          docker-images: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=test,enable=${{ github.event_name == 'pull_request' }}
            type=semver,pattern={{version}}

      # Build the image once into the local daemon and prove it starts before
      # anything is published, so a broken image never reaches the registry.
      #
      # CPU only. The CUDA image runs on a base that expects a GPU driver, and
      # a check that is flaky for reasons unrelated to the image is worse than
      # no check. Its own COPY line is covered by the Dockerfile test in
      # tests/test_service_auth.py — which is the one that would have caught
      # the CUDA image still missing service_auth.py after the CPU one was
      # fixed.
      - name: Build for the smoke test
        if: matrix.variant == 'cpu'
        uses: docker/build-push-action@v6
        with:
          context: ./llm-service
          file: ${{ matrix.dockerfile }}
          load: true
          platforms: linux/amd64
          tags: fk-smoke-test:local
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}:buildcache

      - name: Smoke-test the built image
        if: matrix.variant == 'cpu'
        run: .github/scripts/smoke-test-image.sh fk-smoke-test:local

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./llm-service
          file: ${{ matrix.dockerfile }}
          push: true
          # x86-64 only — see the note at the top of this file.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}:buildcache,mode=max

  deploy:

    # Separate job so the Watchtower webhook fires once per workflow run rather
    # than once per matrix leg, and only after both images are published.
    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to TrueNAS (test)
        if: github.event_name == 'pull_request'
        run: |
          curl -f -X POST \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            ${{ secrets.WATCHTOWER_URL_TEST }}/v1/update

      - name: Deploy to TrueNAS (latest)
        if: github.ref == 'refs/heads/main'
        run: |
          curl -f -X POST \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            ${{ secrets.WATCHTOWER_URL_PROD }}/v1/update
