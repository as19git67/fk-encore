name: iOS TestFlight

# Archives the iOS app (with its share and widgets extensions) and uploads
# the build to App Store Connect, where it shows up in TestFlight.
#
# Started by hand only — from the Actions tab, the GitHub mobile app
# ("Run workflow") or the API. Feature work lands on main many times a
# day and should not ship a build each time; a TestFlight release is a
# decision, so it is a button.
#
# Signing is Xcode's automatic signing with an App Store Connect API key
# (`-allowProvisioningUpdates`): Xcode uses a cloud-managed distribution
# certificate and creates the App Store profiles for all three bundle IDs
# itself. No certificate or profile lives in the repository or in secrets.
# Archiving still signs for development, and on a fresh runner Xcode makes
# a new Apple Development certificate for that. Apple allows only a few per
# account, so the run notes the existing ones first and revokes the one it
# made at the end (ios/scripts/dev-certs.rb). Ad-hoc signing instead is
# refused by the iOS SDK.
#
# Secrets (repository › Settings › Secrets and variables › Actions):
#   ASC_KEY_ID     App Store Connect API key ID
#   ASC_ISSUER_ID  issuer ID shown above the key list
#   ASC_KEY_P8     full text of the downloaded AuthKey_<id>.p8
# The key needs the Admin role; App Manager may not create the
# distribution certificate that cloud signing needs.
#
# Build number: 2500 plus the workflow's run number, which rises with
# every run on any branch. It is passed to xcodebuild and applies to all
# three targets alike; nothing is committed.

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    # GitHub's Xcode 27 image (macOS 27, Apple Silicon). From April 2027
    # App Store Connect takes only builds made with the iOS 27 SDK or later
    # (ITMS-90725); each image carries one major Xcode version, so the
    # next one means the next label.
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Check secrets
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi

      - name: Write the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key_dir="$RUNNER_TEMP/asc"
          mkdir -p "$key_dir"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Note the development certificates
        # Archiving on a fresh runner makes a new Apple Development
        # certificate; the last step revokes it again (dev-certs.rb).
        run: ruby scripts/dev-certs.rb list "$RUNNER_TEMP/dev-certs-before"

      - name: Work out version and build number
        run: |
          # The run number rises with every run of this workflow, on any
          # branch, so every upload gets a higher number. Anything built
          # from the commit count did not: a branch has more commits than
          # main after its squash merge, so a run on main after a run on
          # the branch went lower (2479 after 2480). 2500 lies above every
          # build uploaded so far.
          build=$(( 2500 + GITHUB_RUN_NUMBER ))
          version=$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);.*/\1/p' FKPhotos.xcodeproj/project.pbxproj | head -1)
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Version $version, build $build ($(git rev-parse --short HEAD))"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project FKPhotos.xcodeproj \
            -scheme FKPhotos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FKPhotos.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Export and upload to App Store Connect
        run: |
          set -o pipefail
          team=$(sed -n 's/.*DEVELOPMENT_TEAM = \([A-Z0-9]*\);.*/\1/p' FKPhotos.xcodeproj/project.pbxproj | head -1)
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${team}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          if ! xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FKPhotos.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log"; then
            if grep -qiE 'bundle version must be higher|has already been (used|uploaded)|CFBundleVersion.*(already|previously)' "$RUNNER_TEMP/export.log"; then
              echo "::error::Build $BUILD_NUMBER is already in App Store Connect. Run the workflow again; each run gets a higher number."
            fi
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "### Uploaded to App Store Connect"
            echo ""
            echo "Version **$APP_VERSION**, build **$BUILD_NUMBER**, commit \`$(git rev-parse --short HEAD)\`."
            echo ""
            echo "The build appears in TestFlight once Apple has processed it (usually 5–30 minutes)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore

      - name: Revoke the development certificate of this run
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/dev-certs-before" ]; then
            ruby scripts/dev-certs.rb revoke "$RUNNER_TEMP/dev-certs-before"
          fi

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
