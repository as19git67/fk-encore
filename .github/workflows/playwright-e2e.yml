name: Playwright E2E (Track M)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'user/**'
      - 'photo/**'
      - 'documents/**'
      - 'finance/**'
      - 'db/**'
      - 'web/**'
      - 'package*.json'
      - '.github/workflows/playwright-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'user/**'
      - 'photo/**'
      - 'documents/**'
      - 'finance/**'
      - 'db/**'
      - 'web/**'
      - 'package*.json'
      - '.github/workflows/playwright-e2e.yml'
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # Mirror the docker-image.yml choice: pgvector/pgvector:pg18 is required
        # for migration 0027 (CREATE EXTENSION vector). encore_test isn't used
        # here — the E2E run hits the Encore app's regular database (fk_encore).
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # Backend / DB
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: fk_encore
      # Seed an admin so globalSetup can log in. The same credentials are
      # plumbed into Playwright via E2E_ADMIN_*.
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin
      ADMIN_NAME: Admin
      # Playwright config
      E2E_BASE_URL: http://localhost:5173/app/
      E2E_API_URL: http://localhost:4000
      E2E_ADMIN_EMAIL: admin@example.com
      E2E_ADMIN_PASSWORD: admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # docker-image.yml uses `npm install` (not `ci`) because lockfiles drift
      # across dev platforms. Same trade-off here.
      - name: Install backend dependencies
        run: npm install

      - name: Install frontend dependencies
        run: npm --prefix frontend install --legacy-peer-deps

      # Cache the Playwright browser binaries between runs. The cache key is
      # the @playwright/test version pulled from the frontend lockfile, so it
      # invalidates exactly when the binary set changes.
      - name: Resolve Playwright version
        id: pw
        run: |
          version=$(node -p "require('./frontend/package-lock.json').packages['frontend/node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npm --prefix frontend run e2e:install

      # System deps are tiny but required even when binaries are cached.
      - name: Install Playwright system deps
        run: npx --prefix frontend playwright install-deps chromium

      - name: Install Encore CLI
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -o install.sh https://encore.dev/install.sh
          bash install.sh
          rm -f install.sh
          echo "${HOME}/.encore/bin" >> "${GITHUB_PATH}"

      - name: Verify Encore CLI
        run: encore version

      # Boot the backend in the background. Output is tee'd to a log file so
      # we can upload it on failure for debugging. The seed runs during
      # initializeDb() and creates the admin user from ADMIN_PASSWORD.
      - name: Start Encore backend
        run: |
          mkdir -p e2e-logs
          nohup encore run --port=4000 > e2e-logs/encore.log 2>&1 &
          echo $! > e2e-logs/encore.pid

      - name: Wait for backend to respond
        run: |
          # Encore boots through migrations + seed; 60s is comfortable in
          # CI without being so long that genuine boot failures hang.
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null -X POST \
              -H 'Content-Type: application/json' \
              -d '{"email":"admin@example.com","password":"admin"}' \
              http://localhost:4000/auth/login; then
              echo "[wait] backend ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "[wait] backend did not become ready" >&2
          tail -n 200 e2e-logs/encore.log >&2 || true
          exit 1

      # Vite dev server is started automatically by Playwright's `webServer`
      # (see frontend/playwright.config.ts). E2E_NO_WEBSERVER stays unset.
      - name: Run Playwright tests
        run: npm --prefix frontend run e2e

      - name: Stop Encore backend
        if: always()
        run: |
          pid=$(cat e2e-logs/encore.pid 2>/dev/null || true)
          if [ -n "$pid" ]; then kill "$pid" 2>/dev/null || true; fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/e2e/.report
          retention-days: 14

      - name: Upload Playwright traces & videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/e2e/.results
          retention-days: 14

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: encore-log
          path: e2e-logs/encore.log
          retention-days: 14
