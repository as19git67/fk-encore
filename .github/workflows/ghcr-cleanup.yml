name: GHCR Cleanup

# Keeps the container packages on ghcr.io/as19git67/* tidy:
#   * fk-encore                 (Encore backend, built by docker-image.yml)
#   * fk-encore-embedding       (built by docker-image-embedding.yml)
#   * fk-encore-geo             (built by docker-image-geo.yml)
#   * fk-encore-insightface     (built by docker-image-insightface.yml)
#   * fk-encore-llm             (built by docker-image-llm.yml)
#   * fk-encore-playwright-e2e  (built by docker-image-playwright-e2e.yml,
#                                Track AB / Issue #421)
#
# Policy (applied per package):
#   1. Delete every UNTAGGED version immediately.
#      Those are the orphaned layers left behind when `latest`, `test`
#      or a semver tag is moved to a newer build. They are pure clutter
#      and make up the bulk of the registry storage over time.
#   2. Of the remaining TAGGED versions, keep the 10 most recent and
#      delete older ones — UNLESS the tag matches one of:
#        - a semver release tag (e.g. `1.2.3` or `v1.2.3`)
#        - `latest`
#        - `pw-<x.y.z>` — per-Playwright-version pinpoint on the
#          playwright-e2e runner image, kept as a permanent rollback
#          marker the way semver tags are on the application images.
#      Tags matching any protected pattern are never deleted.
#
# PR builds push the `test` tag (see the metadata step in each build
# workflow). Because the `test` tag is moved on every new PR build, the
# previous `test`-tagged version becomes untagged and is removed by
# step 1 on the next cleanup run.
#
# Runs daily at 06:00 UTC, and can be triggered manually via the
# Actions tab (workflow_dispatch).

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - fk-encore
          - fk-encore-embedding
          - fk-encore-geo
          - fk-encore-insightface
          - fk-encore-llm
          - fk-encore-playwright-e2e
    steps:
      # Step 1 — purge all untagged versions.
      # Uses the GitHub REST API directly (gh cli) to avoid dependency on
      # actions/delete-package-versions which currently runs on Node.js 20.
      - name: Delete untagged versions of ${{ matrix.package }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          PACKAGE="${{ matrix.package }}"

          # Detect user vs org so we hit the correct API namespace.
          TYPE=$(gh api "/users/${OWNER}" --jq '.type' 2>/dev/null || echo "Organization")
          if [ "$TYPE" = "User" ]; then
            API_BASE="/users/${OWNER}/packages/container/${PACKAGE}/versions"
          else
            API_BASE="/orgs/${OWNER}/packages/container/${PACKAGE}/versions"
          fi

          # Merge all paginated results into one JSON array.
          VERSIONS=$(gh api --paginate "${API_BASE}" --jq '.' 2>/dev/null \
            | jq -s 'add // []' || echo '[]')

          DELETED=0
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            if gh api --method DELETE "${API_BASE}/${id}"; then
              echo "Deleted untagged version ${id}"
              DELETED=$((DELETED + 1))
            else
              echo "Failed to delete version ${id}" >&2
            fi
          done < <(echo "${VERSIONS}" \
            | jq -r '.[] | select(.metadata.container.tags | length == 0) | .id')

          echo "Deleted ${DELETED} untagged version(s)."

      # Step 2 — trim old tagged versions.
      # Protected tags: `latest`, semver (`1.2.3` / `v1.2.3`), and the
      # `pw-<x.y.z>` per-Playwright-version pinpoints on the playwright-e2e
      # runner image. Any version whose tags include at least one protected
      # pattern is kept. Of the remaining tagged versions, the 10 most
      # recent are kept and older ones are deleted.
      - name: Prune old tagged versions of ${{ matrix.package }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          PACKAGE="${{ matrix.package }}"

          TYPE=$(gh api "/users/${OWNER}" --jq '.type' 2>/dev/null || echo "Organization")
          if [ "$TYPE" = "User" ]; then
            API_BASE="/users/${OWNER}/packages/container/${PACKAGE}/versions"
          else
            API_BASE="/orgs/${OWNER}/packages/container/${PACKAGE}/versions"
          fi

          VERSIONS=$(gh api --paginate "${API_BASE}" --jq '.' 2>/dev/null \
            | jq -s 'add // []' || echo '[]')

          DELETED=0
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            if gh api --method DELETE "${API_BASE}/${id}"; then
              echo "Deleted old tagged version ${id}"
              DELETED=$((DELETED + 1))
            else
              echo "Failed to delete version ${id}" >&2
            fi
          done < <(echo "${VERSIONS}" | jq -r '
            [
              .[] |
              select(.metadata.container.tags | length > 0) |
              select(
                .metadata.container.tags |
                map(test("^(latest|v?[0-9]+\\.[0-9]+\\.[0-9]+|pw-[0-9]+\\.[0-9]+\\.[0-9]+)$")) |
                any | not
              )
            ] |
            sort_by(.created_at) |
            reverse |
            .[10:] |
            .[].id
          ')

          echo "Deleted ${DELETED} old tagged version(s)."
