name: GHCR Cleanup

# Keeps the container packages on ghcr.io/as19git67/* tidy:
#   * fk-encore                 (Encore backend, built by docker-image.yml)
#   * fk-encore/embedding       (built by docker-image-embedding.yml)
#   * fk-encore/geo             (built by docker-image-geo.yml)
#   * fk-encore/insightface     (built by docker-image-insightface.yml)
#   * fk-encore/llm             (built by docker-image-llm.yml, CPU variant)
#   * fk-encore/llm-gpu         (built by docker-image-llm.yml, CUDA variant)
#   * fk-encore/playwright-e2e  (built by docker-image-playwright-e2e.yml,
#                                Track AB / Issue #421)
#   * fk-encore/receipt-ocr     (built by docker-image-receipt-ocr.yml)
#   * fk-encore/taxonomy-tools  (built by docker-image-taxonomy-tools.yml)
#
# Package names containing "/" (every sidecar since the slash-subpath
# rename) must be percent-encoded when addressed through GitHub's own
# Packages REST API (/users|orgs/.../packages/container/<name>/versions) —
# GitHub docs call this out explicitly for nested container package
# names. The registry's own v2 API (ghcr.io/v2/<owner>/<name>/manifests/…)
# takes the real slash unencoded, since there it is a genuine path
# separator, not a package-name character. Both forms are used below;
# PACKAGE_ENC is only for the former.
#
# Policy (applied per package):
#   1. Delete ORPHANED untagged versions — those left behind when `latest`,
#      `test` or a semver tag moves to a newer build. CRITICAL: untagged
#      versions that are still child manifests of a tagged image (per-arch
#      manifests of a multi-arch index, or buildx provenance attestations)
#      are NOT deleted. Deleting them used to leave the tagged index
#      dangling, so `docker pull …:latest` failed with `manifest unknown`
#      until the next rebuild — see the step below for the full rationale.
#   2. Of the remaining TAGGED versions, keep the 10 most recent and
#      delete older ones — UNLESS the tag matches one of:
#        - a semver release tag (e.g. `1.2.3` or `v1.2.3`)
#        - `latest`
#        - `pw-<x.y.z>` — per-Playwright-version pinpoint on the
#          playwright-e2e runner image, kept as a permanent rollback
#          marker the way semver tags are on the application images.
#        - `buildcache` — the registry-backed buildx cache written by
#          docker-image-llm.yml. Deleting it costs a ~1 h cold rebuild of
#          the from-source llama-cpp-python compile. When the tag moves to
#          a new cache manifest the superseded version becomes untagged and
#          is reclaimed by step 1, so this does not accumulate.
#      Tags matching any protected pattern are never deleted.
#
# PR builds push the `test` tag (see the metadata step in each build
# workflow). Because the `test` tag is moved on every new PR build, the
# previous `test`-tagged version becomes untagged and is removed by
# step 1 on the next cleanup run.
#
# Runs daily at 06:00 UTC, and can be triggered manually via the
# Actions tab (workflow_dispatch).

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - fk-encore
          - fk-encore/embedding
          - fk-encore/geo
          - fk-encore/insightface
          - fk-encore/llm
          - fk-encore/llm-gpu
          - fk-encore/playwright-e2e
          - fk-encore/receipt-ocr
          - fk-encore/taxonomy-tools
    steps:
      # Step 1 — purge untagged versions that are NOT child manifests of a
      # still-tagged image.
      #
      # Why the extra care: our images are pushed with
      # docker/build-push-action@v6, which (a) builds several of them
      # multi-arch (linux/amd64,linux/arm64) and (b) attaches provenance
      # attestations. Both produce an OCI *image index* under the tag
      # (e.g. `latest`) that references several UNTAGGED child manifests —
      # one per platform plus the attestation. Blindly deleting every
      # untagged version (the old behaviour) removed those children and
      # left the tagged index dangling, so `docker pull …:latest` failed
      # with `manifest unknown` until the next rebuild. That is exactly the
      # "image was there yesterday, gone today" symptom.
      #
      # Fix: inspect every TAGGED version's manifest, collect the digests
      # it references, and skip those when purging untagged versions. Truly
      # orphaned layers (left behind when a tag moves to a new build) have
      # no referencing index and are still deleted.
      - name: Delete orphaned untagged versions of ${{ matrix.package }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          PACKAGE="${{ matrix.package }}"
          # GitHub's Packages REST API requires "/" percent-encoded in the
          # package_name path segment; the ghcr.io registry v2 API below
          # takes the raw PACKAGE since there the slash is a real path.
          PACKAGE_ENC="${PACKAGE//\//%2F}"

          # Detect user vs org so we hit the correct API namespace.
          TYPE=$(gh api "/users/${OWNER}" --jq '.type' 2>/dev/null || echo "Organization")
          if [ "$TYPE" = "User" ]; then
            API_BASE="/users/${OWNER}/packages/container/${PACKAGE_ENC}/versions"
          else
            API_BASE="/orgs/${OWNER}/packages/container/${PACKAGE_ENC}/versions"
          fi

          # Merge all paginated results into one JSON array.
          VERSIONS=$(gh api --paginate "${API_BASE}" --jq '.' 2>/dev/null \
            | jq -s 'add // []' || echo '[]')

          # Registry pull token for manifest inspection. GITHUB_TOKEN has
          # pull access to this repo's own packages.
          REG_TOKEN=$(curl -fsSL -u "${{ github.actor }}:${GH_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${OWNER}/${PACKAGE}:pull" \
            | jq -r '.token // empty')

          # Collect the digests referenced by every TAGGED manifest index.
          # A version's `.name` is its manifest digest (sha256:…). Plain
          # single-arch manifests have no `.manifests` array and contribute
          # nothing. We accept both OCI-index and Docker manifest-list types.
          REFERENCED="$(mktemp)"
          if [ -n "${REG_TOKEN}" ]; then
            while IFS= read -r digest; do
              [ -z "$digest" ] && continue
              curl -fsSL \
                -H "Authorization: Bearer ${REG_TOKEN}" \
                -H "Accept: application/vnd.oci.image.index.v1+json" \
                -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
                "https://ghcr.io/v2/${OWNER}/${PACKAGE}/manifests/${digest}" 2>/dev/null \
                | jq -r '.manifests[]?.digest // empty' 2>/dev/null || true
            done < <(echo "${VERSIONS}" \
              | jq -r '.[] | select(.metadata.container.tags | length > 0) | .name') \
              | sort -u > "${REFERENCED}"
          else
            echo "::warning::Could not obtain a registry token; falling back to deleting all untagged versions."
          fi
          echo "Referenced child manifests to preserve: $(wc -l < "${REFERENCED}")"

          DELETED=0
          SKIPPED=0
          while IFS=$'\t' read -r id digest; do
            [ -z "$id" ] && continue
            if [ -s "${REFERENCED}" ] && grep -qxF "$digest" "${REFERENCED}"; then
              echo "Skipping untagged child manifest ${digest} (referenced by a tagged image)"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            if gh api --method DELETE "${API_BASE}/${id}"; then
              echo "Deleted orphaned untagged version ${id} (${digest})"
              DELETED=$((DELETED + 1))
            else
              echo "Failed to delete version ${id}" >&2
            fi
          done < <(echo "${VERSIONS}" \
            | jq -r '.[] | select(.metadata.container.tags | length == 0) | "\(.id)\t\(.name)"')

          echo "Deleted ${DELETED} orphaned untagged version(s); preserved ${SKIPPED} referenced child manifest(s)."

      # Step 2 — trim old tagged versions.
      # Protected tags: `latest`, semver (`1.2.3` / `v1.2.3`), and the
      # `pw-<x.y.z>` per-Playwright-version pinpoints on the playwright-e2e
      # runner image. Any version whose tags include at least one protected
      # pattern is kept. Of the remaining tagged versions, the 10 most
      # recent are kept and older ones are deleted.
      - name: Prune old tagged versions of ${{ matrix.package }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          PACKAGE="${{ matrix.package }}"
          # GitHub's Packages REST API requires "/" percent-encoded in the
          # package_name path segment; the ghcr.io registry v2 API below
          # takes the raw PACKAGE since there the slash is a real path.
          PACKAGE_ENC="${PACKAGE//\//%2F}"

          TYPE=$(gh api "/users/${OWNER}" --jq '.type' 2>/dev/null || echo "Organization")
          if [ "$TYPE" = "User" ]; then
            API_BASE="/users/${OWNER}/packages/container/${PACKAGE_ENC}/versions"
          else
            API_BASE="/orgs/${OWNER}/packages/container/${PACKAGE_ENC}/versions"
          fi

          VERSIONS=$(gh api --paginate "${API_BASE}" --jq '.' 2>/dev/null \
            | jq -s 'add // []' || echo '[]')

          DELETED=0
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            if gh api --method DELETE "${API_BASE}/${id}"; then
              echo "Deleted old tagged version ${id}"
              DELETED=$((DELETED + 1))
            else
              echo "Failed to delete version ${id}" >&2
            fi
          done < <(echo "${VERSIONS}" | jq -r '
            [
              .[] |
              select(.metadata.container.tags | length > 0) |
              select(
                .metadata.container.tags |
                map(test("^(latest|buildcache|v?[0-9]+\\.[0-9]+\\.[0-9]+|pw-[0-9]+\\.[0-9]+\\.[0-9]+)$")) |
                any | not
              )
            ] |
            sort_by(.created_at) |
            reverse |
            .[10:] |
            .[].id
          ')

          echo "Deleted ${DELETED} old tagged version(s)."
