name: Docker Image CI - Routing Service

on:
  push:
    branches: [ "main" ]
    tags:
      - '*'
    paths:
      - 'routing/**'
      - '.github/workflows/docker-image-routing.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'routing/**'
      - '.github/workflows/docker-image-routing.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/routing

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Shell syntax
        run: bash -n routing/entrypoint.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=test,enable=${{ github.event_name == 'pull_request' }}
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./routing
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to TrueNAS (test)
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: |
          curl -f -X POST \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            ${{ secrets.WATCHTOWER_URL_TEST }}/v1/update

      - name: Deploy to TrueNAS (latest)
        if: github.ref == 'refs/heads/main'
        run: |
          curl -f -X POST \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            ${{ secrets.WATCHTOWER_URL_PROD }}/v1/update

      # The demo stack follows latest too (documentation/plans/demodaten.md,
      # "Demo deployment"). It must never turn main red: without the secret
      # the step does nothing, and a demo that is down only leaves a warning.
      - name: Deploy to TrueNAS (demo)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          WATCHTOWER_URL_DEMO: ${{ secrets.WATCHTOWER_URL_DEMO }}
          WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_TOKEN }}
        run: |
          if [ -z "$WATCHTOWER_URL_DEMO" ]; then
            echo "WATCHTOWER_URL_DEMO is not set, no demo to update"
            exit 0
          fi
          curl -f -X POST \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -H "Authorization: Bearer $WATCHTOWER_TOKEN" \
            "$WATCHTOWER_URL_DEMO/v1/update" \
            || echo "::warning::The demo stack did not take the update"
