name: Docker Image CI - Geo Service

on:
  push:
    branches: [ "main" ]
    tags:
      - '*'
    paths:
      - 'geo/**'
      - '.github/workflows/docker-image-geo.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'geo/**'
      - '.github/workflows/docker-image-geo.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/geo

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install geo dependencies
        run: npm install
        working-directory: geo

      - name: Typecheck
        run: npm run typecheck
        working-directory: geo

      - name: Test
        run: npm test
        working-directory: geo

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=test,enable=${{ github.event_name == 'pull_request' }}
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./geo
          push: true
          # Single-arch (amd64) for now to match the rest of the deploy
          # target. Bookworm-slim + osm2pgsql is available on arm64 too,
          # so flip to `linux/amd64,linux/arm64` once we actually deploy
          # to an arm64 host.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to TrueNAS (test)
        if: github.event_name == 'pull_request'
        run: |
          curl -f -X POST \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            ${{ secrets.WATCHTOWER_URL_TEST }}/v1/update

      - name: Deploy to TrueNAS (latest)
        if: github.ref == 'refs/heads/main'
        run: |
          curl -f -X POST \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            ${{ secrets.WATCHTOWER_URL_PROD }}/v1/update
