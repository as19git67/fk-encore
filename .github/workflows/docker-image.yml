name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    tags:
      - '*'
    paths-ignore:
      - 'embedding_service/**'
      - 'insightface-service/**'
      - 'landmark-service/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'embedding_service/**'
      - 'insightface-service/**'
      - 'landmark-service/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Intentionally `npm install` (not `npm ci`): lockfiles have repeatedly
      # drifted between dev platforms in this repo, and `npm ci` would fail
      # CI on every drift. `npm install` is more forgiving.
      - name: Install backend dependencies
        run: npm install

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          VITEST: "true"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_TEST_DB: encore_test
          POSTGRES_TEST_CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/encore_test

      - name: Install frontend dependencies
        run: npm --prefix frontend install --legacy-peer-deps

      - name: Build frontend (SPA bundle)
        run: npm --prefix frontend run build

      # Installs the Encore CLI by running the upstream `install.sh` as
      # documented at https://encore.dev/docs/ts/self-host/ci-cd. We do NOT
      # pass a `-v <version>` argument: the official docs install the latest
      # GA release, and an earlier attempt to pin via `-v ${ENCORE_VERSION}`
      # caused install.sh to 403 on the CDN. The actual CLI version used is
      # logged in the next step for traceability.
      - name: Install Encore CLI (latest GA)
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -o install.sh https://encore.dev/install.sh
          bash install.sh
          rm -f install.sh
          echo "${HOME}/.encore/bin" >> "${GITHUB_PATH}"

      - name: Verify Encore CLI
        run: encore version

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=semver,pattern={{version}}
            type=raw,value=test,enable=${{ github.event_name == 'pull_request' }}

      # Stage A — Encore's official production build. Produces a portable
      # image built on node:24-bookworm-slim that contains the compiled
      # Encore app, node_modules, and the Encore runtime entrypoint. We
      # tag it locally as fk-encore-raw:build; it never leaves the runner.
      #
      # --skip-config  : we don't use Encore's SQLDatabase/PubSub/etc., so
      #                  there is no infra-config.json to generate.
      # --base         : keeps image layout consistent with the old Dockerfile.
      # --os/--arch    : explicit to avoid surprises if runners change arch.
      #
      # To build a multi-arch image (amd64 + arm64) you need TWO encore build
      # invocations and a manifest list, e.g.:
      #   encore build docker --base=... --os=linux --arch=amd64 fk-encore-raw:amd64
      #   encore build docker --base=... --os=linux --arch=arm64 fk-encore-raw:arm64
      # then run Stage B twice (once per arch, matching --build-arg BASE_IMAGE)
      # and finally assemble a manifest with `docker buildx imagetools create`.
      # Stage B's docker/build-push-action would then use platforms: linux/amd64,linux/arm64
      # and you'd pipe each per-arch Encore image through a matrix build.
      - name: Build Encore application image (Stage A)
        run: |
          encore build docker \
            --base=node:24-bookworm-slim \
            --skip-config \
            --os=linux \
            --arch=amd64 \
            fk-encore-raw:build

      # Stage B — thin runtime wrapper that adds the TrueNAS SCALE apps user
      # (568:568), bind-mount directories, the pre-built frontend SPA, and
      # bakes APP_BUILD_NUMBER into the image. Pushes the final image to ghcr.
      - name: Build and push runtime image (Stage B)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.runtime
          push: true
          platforms: linux/amd64  # multi-arch: linux/amd64,linux/arm64 (also requires Stage A matrix above)
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=fk-encore-raw:build
            BUILD_NUMBER=${{ github.run_number }}-${{ github.sha }}

      - name: Deploy to TrueNAS (test)
        if: github.event_name == 'pull_request'
        run: |
          curl -f -X POST \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            ${{ secrets.WATCHTOWER_URL_TEST }}/v1/update

      - name: Deploy to TrueNAS (latest)
        if: github.ref == 'refs/heads/main'
        run: |
          curl -f -X POST \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            ${{ secrets.WATCHTOWER_URL_PROD }}/v1/update
