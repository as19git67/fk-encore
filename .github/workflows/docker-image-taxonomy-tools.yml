name: Docker Image CI - Taxonomy Tools

on:
  push:
    branches: [ "main" ]
    tags:
      - '*'
    paths:
      - 'taxonomy-tools/**'
      - 'scripts/taxonomy/**'
      - 'documents/taxonomy.ts'
      - 'documents/tax-sections.ts'
      - 'documents/classify-prompts.ts'
      - '.github/workflows/docker-image-taxonomy-tools.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'taxonomy-tools/**'
      - 'scripts/taxonomy/**'
      - 'documents/taxonomy.ts'
      - 'documents/tax-sections.ts'
      - 'documents/classify-prompts.ts'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-taxonomy-tools

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Assemble build context
        run: bash taxonomy-tools/build-context.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=test,enable=${{ github.event_name == 'pull_request' }}
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./taxonomy-tools
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to TrueNAS (test)
        if: github.event_name == 'pull_request'
        run: |
          curl -f -X POST \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            ${{ secrets.WATCHTOWER_URL_TEST }}/v1/update

      - name: Deploy to TrueNAS (latest)
        if: github.ref == 'refs/heads/main'
        run: |
          curl -f -X POST \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            ${{ secrets.WATCHTOWER_URL_PROD }}/v1/update
