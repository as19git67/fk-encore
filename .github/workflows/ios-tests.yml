name: iOS Unit Tests

# Runs the FKPhotos Swift package unit tests on an iOS simulator. These guard
# the photo upload dedup contract (image_data_hash / full_hash), the
# filename/mime helpers and the UploadQueue claim invariants (issue #591).
#
# The app code is iOS-only (UIKit / PhotosUI), so the tests cannot run with
# `swift test` on Linux/macOS — they build for an iOS Simulator via xcodebuild
# against the SwiftPM package's auto-generated `FKPhotos-Package` scheme. No
# changes to the app .xcodeproj are required.
#
# IMPORTANT: `ios/` contains BOTH `Package.swift` and an app `FKPhotos.xcodeproj`.
# When both sit side by side, xcodebuild auto-selects the .xcodeproj — which has
# no `FKPhotos-Package` scheme and does not include the `FKPhotosTests` target —
# and fails with "does not contain a scheme named FKPhotos-Package". The unit
# tests live only in the SwiftPM package, so we move the app project aside for
# the duration of the run to force xcodebuild into the package context.
#
# NOTE: the app references iOS 26.1 PhotoKit APIs, so the runner must provide a
# matching iOS SDK / Xcode. If the build can't find the SDK or the simulator
# name, adjust `runs-on`, the Xcode selection, and the destination below.

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Print toolchain / available simulators (debug aid)
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true
          xcrun simctl list devices available | grep -i iphone || true

      - name: Use the SwiftPM package context (hide the app .xcodeproj)
        # xcodebuild prefers an .xcodeproj over Package.swift when both are
        # present, which hides the package's FKPhotos-Package scheme (and the
        # FKPhotosTests target). Move the app project out of the working dir so
        # the package becomes the only project context.
        run: mv FKPhotos.xcodeproj "$RUNNER_TEMP/FKPhotos.xcodeproj"

      - name: Discover the package test scheme
        # With only Package.swift present, xcodebuild treats the directory as an
        # implicit workspace; the aggregate scheme's exact name is not stable
        # across Xcode versions (it is NOT necessarily "FKPhotos-Package"). So
        # discover it: prefer the "-Package" aggregate, else the first scheme.
        # `xcodebuild test` resolves package dependencies on its own, so no
        # separate resolve step is needed.
        run: |
          xcodebuild -list || true
          SCHEME=$(xcodebuild -list -json 2>/dev/null | python3 -c "import sys, json; r = sys.stdin.read(); d = json.loads(r[r.find('{'):]); c = d.get('workspace') or d.get('project') or {}; s = c.get('schemes', []); p = [x for x in s if x.endswith('-Package')]; print(p[0] if p else (s[0] if s else ''))")
          echo "Selected scheme: $SCHEME"
          echo "IOS_SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Run unit tests (iOS Simulator)
        run: |
          xcodebuild test \
            -scheme "$IOS_SCHEME" \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipPackagePluginValidation \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Put the app .xcodeproj back
        # The app targets are needed for the compile check below, which is
        # the only thing in CI that looks at them at all.
        run: mv "$RUNNER_TEMP/FKPhotos.xcodeproj" FKPhotos.xcodeproj

      - name: Compile the share extension
        # The unit tests above build only the SwiftPM package
        # (Sources/FKPhotos). The share extension in F4milShare/ is a
        # separate target of the app project and is not part of it, so
        # until this step nothing in CI ever compiled it — a share
        # extension that did not build at all could be merged, and was.
        #
        # `-target` rather than `-scheme`: the project ships no shared
        # schemes, so there is no scheme to name. No tests run here; the
        # extension has none, and it is the compile that was missing.
        #
        # SYMROOT/OBJROOT are set explicitly because a target-based
        # build (as opposed to a scheme-based one) defaults SYMROOT to
        # `$(SRCROOT)/build` — and for a SwiftPM dependency that SRCROOT
        # is the package's own checkout, so Xcode tries to create
        # `SourcePackages/checkouts/<pkg>/build/`. Yams ships a Bazel
        # file named `BUILD` at its root, and macOS filesystems are
        # case-insensitive, so that directory cannot be created:
        # "File exists but is not a directory: .../checkouts/Yams/build".
        # Pointing both roots outside the checkouts avoids writing
        # anything into them (and keeps `ios/build/` out of the
        # working tree while we are at it).
        run: |
          xcodebuild build \
            -project FKPhotos.xcodeproj \
            -target F4milShare \
            -sdk iphonesimulator \
            -configuration Debug \
            SYMROOT="$RUNNER_TEMP/xcbuild" \
            OBJROOT="$RUNNER_TEMP/xcbuild/Intermediates" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Compile the widgets extension
        # Same gap as the share extension above: the widgets/Live Activity
        # extension in App/Widgets/ (#764, #768 §1) is its own target of
        # the app project, outside the SwiftPM package the unit tests
        # build, so without this step CI would never compile it at all.
        #
        # Unlike F4milShare, this target links FKPhotosLib directly (it
        # needs the package's trip/recap/feed models), which pulls in the
        # package's OpenAPIGenerator build-tool plugin — xcodebuild
        # refuses to run an unapproved plugin non-interactively, so this
        # needs the same flag the package test run above already passes.
        #
        # `-scheme` rather than `-target`, unlike the share extension:
        # a target-based build compiles the whole package graph for the
        # run destination's SDK, and that graph includes the build-tool
        # plugin's own executable. Built for iOS, swift-openapi-
        # generator refuses outright — `_OpenAPIGeneratorCore` carries
        # an `#error` for exactly this ("only to be used by
        # swift-openapi-generator itself"), since a plugin's tool has
        # to be built for the host. A scheme-based build makes that
        # host/target split correctly, which is why the package test
        # step above never hit this. Hence the shared scheme checked in
        # at FKPhotos.xcodeproj/xcshareddata/xcschemes/ — the project
        # had none, and this step needs one to exist.
        run: |
          xcodebuild build \
            -project FKPhotos.xcodeproj \
            -scheme FKPhotosWidgets \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            -skipPackagePluginValidation \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/TestResults.xcresult
          if-no-files-found: ignore
