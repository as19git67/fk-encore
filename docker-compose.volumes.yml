    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/backup
  llm_models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/llm_models
  embedding_models:
    driver: local
    driver_opts:
      type: none
      o: bind
