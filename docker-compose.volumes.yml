# fk-encore — storage layout.
#
# Split out of docker-compose.yml so a deployment can keep its own copy of
# THIS file and take every future docker-compose.yml straight from the
# repository, unedited. Everything that differs per machine lives here:
# where the data sits, and which external photo libraries are mounted in.
#
# `docker-compose.yml` pulls it in with a top-level `include:`, so no extra
# `-f` flag is needed — `docker compose up -d` finds it as long as it sits
# next to docker-compose.yml.
#
# The defaults below are the ones the repository ships with: every volume
# binds into ${DEPLOY_DATA_ROOT}/<subdir>, so pointing a whole deployment
# somewhere else is one variable in `.env` and needs no change here.
#
# What a deployment typically adds is at the bottom: external photo
# libraries. Those need two things — a volume definition, and a mount on
# the `app` service. Both can be declared here; compose merges the service
# fragment into the one in docker-compose.yml rather than replacing it.

volumes:
  photos:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/photos
  thumbnails:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/thumbnails
  pgdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/pgdata
  backup:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/backup
  llm_models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/llm_models
  embedding_models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/embedding_models
  documents:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/documents
  documents_inbox:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/documents-inbox
  finance_import:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/finance-import
  finance_export:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/finance-export
  geo_db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/geo-db
  receipt_ocr_models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/receipt-ocr-models
  geo_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/geo
  recap-music:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/recap-music
  taxonomy_out:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/taxonomy-out

# ── External photo libraries (per deployment) ─────────────────────────────────
# Directories on the host you want to import photos from. Two steps, both
# here:
#
#   1. a volume, bound to the host path
#   2. a mount on `app` under /mnt/libraries/<name>
#
# Use `:ro` for libraries in link mode so the container can never modify the
# originals. The example below is commented out; uncomment and adjust.
#
# services:
#   app:
#     volumes:
#       - photo_archive:/mnt/libraries/archive:ro
#       - photo_inbox:/mnt/libraries/inbox
#
# and add to the `volumes:` block above:
#
#   photo_archive:
#     driver: local
#     driver_opts:
#       type: none
#       o: bind
#       device: /mnt/host/path/to/archive
#   photo_inbox:
#     driver: local
#     driver_opts:
#       type: none
#       o: bind
#       device: ${DEPLOY_DATA_ROOT:-./data}/photo_import
