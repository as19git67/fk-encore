# ── External photo libraries (per deployment) ─────────────────────────────────
# Directories on the host you want to import photos from. Two entries, both
# in this file:
#
#   1. a volume, bound to the host path
#   2. a mount on `app` under /mnt/libraries/<name>
#
# The multi-file merge appends these to the mounts docker-compose.yml
# already declares — the standard eight stay. Use `:ro` for libraries in
# link mode so the container can never modify the originals.
#
# Add the volumes to the block above:
#
#   photo_archive:
#     driver: local
#     driver_opts:
#       type: none
#       o: bind
#       device: /mnt/host/path/to/archive
#
# and the mounts here, uncommented:
#
# services:
#   app:
#     volumes:
#       - photo_archive:/mnt/libraries/archive:ro
