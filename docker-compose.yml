# fk-encore — unified compose for prod, test, and any additional
# deployments sharing the same Docker host.
#
# All deployment-specific values come from an env-file. The defaults
# below match a single-deployment production setup; copy
# `.env.example` to `.env` and adjust as needed. To run a second
# deployment alongside (e.g. a PR-image test stack on a port range
# that doesn't collide), copy `.env.test.example` and bring it up
# with `--env-file`:
#
#   docker compose --env-file .env up -d              # production
#   docker compose --env-file .env.test up -d         # test/staging
#
# Most env vars are interpolated as `${VAR:-default}` so an unset
# variable still produces the prod default. The variables you'd
# typically override per deployment all share the `DEPLOY_` prefix
# (compose-only) — application-level env vars (POSTGRES_PASSWORD,
# SMTP_*, VAPID_*, BACKUP_*, FINANCE_*, GEO_DB_PASSWORD, …) keep
# their normal names so they can be reused unchanged across stacks.
#
# See `DEPLOYMENT.md` for the full reference.

name: ${COMPOSE_PROJECT_NAME:-fk-encore}

services:
  # ── Bind-mount permission fixer ────────────────────────────────────────────
  # Runs once as root before the app/llm_service start and ensures the
  # bind-mounted host directories are owned by 568:568 — the TrueNAS SCALE
  # "apps" user that every other container runs as. Without this, a freshly
  # provisioned host directory would be root-owned and the non-root services
  # would fail to write into it. Exits 0 on success; depends_on /
  # service_completed_successfully gates the dependent services on that exit.
  chown-init:
    image: alpine:3.20
    container_name: fk-encore-chown-init${DEPLOY_NAME_SUFFIX:-}
    restart: "no"
    user: "0:0"
    # Chown the directories themselves to the apps user (568:568) so
    # the container can list / create files inside them. This does NOT
    # chown files dropped later by other host users — for the finance
    # dropbox the operator needs to land files as 568:568 (or g+r with
    # the apps group set as primary on the dataset).
    command: ["sh", "-c", "chown -R 568:568 /mnt/documents /mnt/documents-inbox /mnt/models /mnt/embedding-models /mnt/finance-import /mnt/finance-export /mnt/backup /mnt/geo"]
    volumes:
      - documents:/mnt/documents
      - documents_inbox:/mnt/documents-inbox
      - llm_models:/mnt/models
      - embedding_models:/mnt/embedding-models
      - finance_import:/mnt/finance-import
      - finance_export:/mnt/finance-export
      - backup:/mnt/backup
      - geo_data:/mnt/geo

  # ── Main Encore.ts Application ─────────────────────────────────────────────
  app:
    image: ghcr.io/as19git67/fk-encore:${DEPLOY_IMAGE_TAG:-latest}
    container_name: fk-encore-app${DEPLOY_NAME_SUFFIX:-}
    restart: unless-stopped
    # Run as the TrueNAS SCALE "apps" user (UID/GID 568). Ensure the bind-
    # mounted host directories are owned by 568:568.
    user: "568:568"
    labels:
      com.centurylinklabs.watchtower.scope: ${DEPLOY_WATCHTOWER_SCOPE:-fkprod}
    depends_on:
      chown-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      insightface:
        condition: service_healthy
      embedding_service:
        condition: service_healthy
      llm_service:
        condition: service_healthy
    ports:
      - "${DEPLOY_HOST_PORT_APP:-8080}:8080"
    environment:
      PORT: "8080"
      DB_TYPE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: ${DEPLOY_PG_DATABASE:-encore}
      # PHOTO_UPLOAD_DIR / PHOTO_THUMBNAIL_DIR / PHOTO_LIBRARIES_ROOT / BACKUP_DIR
      # are hardcoded in the container as /mnt/data/photos, /mnt/data/thumbnails,
      # /mnt/libraries and /mnt/backup respectively (see photo/photo.service.ts,
      # photo/libraries.service.ts and backup/*.ts). The volume mounts below
      # are the single source of truth — do not re-declare the paths here.
      DOCUMENTS_DIR: /mnt/data/documents
      DOCUMENTS_INBOX_DIR: /mnt/data/documents-inbox
      DOCUMENTS_MAX_SIZE_MB: ${DOCUMENTS_MAX_SIZE_MB:-50}
      DOCUMENTS_INBOX_USER_EMAIL: ${DOCUMENTS_INBOX_USER_EMAIL:-}
      DOCUMENTS_OCR_LANG: ${DOCUMENTS_OCR_LANG:-deu+eng}
      DOCUMENTS_OCR_DPI: ${DOCUMENTS_OCR_DPI:-200}
      # Max document characters sent to /classify. Keep <= the llm-service's
      # CLASSIFY_TEXT_CHAR_LIMIT (raise both in lockstep with LLM_CTX).
      DOCUMENTS_CLASSIFY_CHAR_LIMIT: ${DOCUMENTS_CLASSIFY_CHAR_LIMIT:-6000}
      # Retrieval-augmented few-shot classification. Off by default: a small
      # local model copies example documents' title/sender/category into the
      # output. Opt in only after validating example safety on the model.
      DOCUMENTS_FEWSHOT_ENABLED: ${DOCUMENTS_FEWSHOT_ENABLED:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}   # override in .env!
      RP_ID: ${DEPLOY_RP_ID:-localhost}
      RP_NAME: ${DEPLOY_RP_NAME:-Vivanty App}
      RP_ORIGIN: ${DEPLOY_RP_ORIGIN:-http://localhost:8080}
      ENABLE_LOCAL_FACES: "true"
      FACE_DISTANCE_THRESHOLD: "0.42"
      INSIGHTFACE_SERVICE_URL: http://insightface:8000
      EMBEDDING_SERVICE_URL: http://embedding_service:8000
      LLM_SERVICE_URL: http://llm_service:8000
      # ENABLE_LANDMARKS retired (Epic #383) — use ENABLE_POI_DETECTION instead.
      ENABLE_POI_DETECTION: ${ENABLE_POI_DETECTION:-false}
      # Geo service (reverse geocoding + POI lookup). Talks to the geo
      # container over the compose default network. GEO_SHARED_SECRET is
      # optional but recommended in shared-host deployments.
      GEO_SERVICE_URL: ${GEO_SERVICE_URL:-http://geo:8080}
      GEO_SHARED_SECRET: ${GEO_SHARED_SECRET:-}
      # Label module — base URL of the CUPS server that exposes the label
      # printer (e.g. a Raspberry Pi with a DYMO LabelWriter 450). Set this
      # in your .env; if unset the backend falls back to localhost:631.
      CUPS_SERVER_URL: ${CUPS_SERVER_URL:-}
      # Left print margin in points (1 pt ≈ 4 px at 300 dpi); 0 disables.
      CUPS_LABEL_LEFT_MARGIN_PT: ${CUPS_LABEL_LEFT_MARGIN_PT:-1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      APP_URL: ${DEPLOY_APP_URL:-http://localhost:8080}
      # Backup subsystem — see scripts/host/README.md
      BACKUP_AUTO_STOP_MS: ${BACKUP_AUTO_STOP_MS:-1800000}
      BACKUP_TOKEN: ${BACKUP_TOKEN:-}
      BACKUP_ALLOW_CIDRS: ${BACKUP_ALLOW_CIDRS:-}
      BACKUP_TRUST_XFF: ${BACKUP_TRUST_XFF:-true}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      FINANCE_CREDENTIALS_KEY: ${FINANCE_CREDENTIALS_KEY:-}
      FINANCE_FINTS_PRODUCT_ID: ${FINANCE_FINTS_PRODUCT_ID:-dev-placeholder}
      FINANCE_FINTS_PRODUCT_VERSION: ${FINANCE_FINTS_PRODUCT_VERSION:-0.1.0}
      FINANCE_IMPORT_DIR: /mnt/data/finance-import
      FINANCE_EXPORT_DIR: /mnt/data/finance-export
      FINANCE_EXPORT_KEEP: ${FINANCE_EXPORT_KEEP:-30}
    # The app uses compose's `default` network to reach the geo service.
    # The legacy Docker socket mount + OSM bridge network attachment is
    # gone: geo replaces the runtime-spawned per-region Nominatim/Overpass
    # containers, so the app no longer needs Docker daemon access.
    volumes:
      - photos:/mnt/data/photos
      - thumbnails:/mnt/data/thumbnails
      - documents:/mnt/data/documents
      - documents_inbox:/mnt/data/documents-inbox
      - finance_import:/mnt/data/finance-import
      - finance_export:/mnt/data/finance-export
      - backup:/mnt/backup

  # ── InsightFace Service (Face Detection) ───────────────────────────────────
  insightface:
    image: ghcr.io/as19git67/fk-encore-insightface:${DEPLOY_IMAGE_TAG:-latest}
    container_name: fk-encore-insightface${DEPLOY_NAME_SUFFIX:-}
    restart: unless-stopped
    user: "568:568"
    # Pin to P-cores — see DEPLOY_ML_CPUSET in docker-compose.env.example.
    cpuset: "${DEPLOY_ML_CPUSET:-0-11}"
    labels:
      com.centurylinklabs.watchtower.scope: ${DEPLOY_WATCHTOWER_SCOPE:-fkprod}
    environment:
      ORT_LOGGING_LEVEL: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # buffalo_l loads from disk on first start (~1-2 min on a CPU-only
      # box). During start_period a failing curl doesn't count as an
      # unhealthy retry — undersize this and the app's `service_healthy`
      # gate flips early, surfacing as `dependency failed to start`
      # before the model has finished loading. Override via env on slow
      # disks (NFS, spinning rust).
      start_period: ${DEPLOY_INSIGHTFACE_START_PERIOD:-180s}

  # ── Embedding Service (CLIP + DINOv2) ──────────────────────────────────────
  # Models live in the `embedding_models` volume, NOT in the image. The
  # container's entrypoint runs `download_model.sh` automatically on every
  # start, so a cold volume populates itself on first `docker compose up`
  # (~5 min, ~5.5 GB; healthcheck start_period is sized for that).
  embedding_service:
    image: ghcr.io/as19git67/fk-encore-embedding:${DEPLOY_IMAGE_TAG:-latest}
    container_name: fk-encore-embedding${DEPLOY_NAME_SUFFIX:-}
    restart: unless-stopped
    user: "568:568"
    # Pin to P-cores — see DEPLOY_ML_CPUSET in docker-compose.env.example.
    cpuset: "${DEPLOY_ML_CPUSET:-0-11}"
    labels:
      com.centurylinklabs.watchtower.scope: ${DEPLOY_WATCHTOWER_SCOPE:-fkprod}
    depends_on:
      chown-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/${DEPLOY_PG_EMBEDDINGS_DATABASE:-embeddings}
      CLIP_MODEL_NAME: xlm-roberta-large-ViT-H-14
      CLIP_PRETRAINED: frozen_laion5b_s13b_b90k
      DINO_MODEL_NAME: facebook/dinov2-base
      LOG_LEVEL: INFO
      EMBED_NUM_THREADS: "6"
      EMBED_BACKEND: ${EMBED_BACKEND:-torch}
    volumes:
      - embedding_models:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # ~5 min CLIP + DINOv2 first-time download on a cold volume; the
      # default covers that with margin. Override via env when both
      # caches are already warm (faster healthy gate) or on very slow
      # bandwidth (extend further).
      start_period: ${DEPLOY_EMBEDDING_START_PERIOD:-600s}

  # The Grounding-DINO `landmark` service was removed in Epic #383.
  # POI detection now runs through the geo service (see below) backed
  # by per-region PostGIS databases. Remove the leftover container /
  # image after upgrade:
  #   docker rm -f fk-encore-landmark
  #   docker rmi ghcr.io/as19git67/fk-encore-landmark:latest

  # ── LLM Service (Llama GGUF classifier + multilingual-e5-base embedder) ───
  llm_service:
    image: ghcr.io/as19git67/fk-encore-llm:${DEPLOY_IMAGE_TAG:-latest}
    container_name: fk-encore-llm${DEPLOY_NAME_SUFFIX:-}
    restart: unless-stopped
    user: "568:568"
    # Pin to P-cores — see DEPLOY_ML_CPUSET in docker-compose.env.example.
    cpuset: "${DEPLOY_ML_CPUSET:-0-11}"
    labels:
      com.centurylinklabs.watchtower.scope: ${DEPLOY_WATCHTOWER_SCOPE:-fkprod}
    depends_on:
      chown-init:
        condition: service_completed_successfully
    environment:
      MODELS_DIR: /models
      LLM_MODEL_PATH: ${LLM_MODEL_PATH:-/models/llama.gguf}
      LLM_MODEL_URL: ${LLM_MODEL_URL:-https://huggingface.co/bartowski/Llama-3.2-3B-Instruct-GGUF/resolve/main/Llama-3.2-3B-Instruct-Q4_K_M.gguf}
      LLM_MODEL_SHA256: ${LLM_MODEL_SHA256:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-base}
      LLM_CTX: ${LLM_CTX:-8192}
      LLM_GPU_LAYERS: ${LLM_GPU_LAYERS:-0}
      LLM_THREADS: ${LLM_THREADS:-}
      CLASSIFY_TEXT_CHAR_LIMIT: ${CLASSIFY_TEXT_CHAR_LIMIT:-6000}
      TAX_SECTIONS_MAX: ${TAX_SECTIONS_MAX:-4}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - llm_models:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5
      # llm_service mmap's the GGUF (~2 GB) and loads the
      # multilingual-e5-base embedder on every start. On a cold
      # `llm_models` volume the entrypoint additionally downloads the
      # GGUF (also ~2 GB). Both are CPU-bound — the previous 180s was
      # tight even for warm starts and routinely caused the app's
      # `service_healthy` gate to fail before the loader was done.
      # Aligned with embedding_service to keep the cold-start envelope
      # consistent.
      start_period: ${DEPLOY_LLM_START_PERIOD:-600s}

  # ── PostgreSQL (shared instance for both app and embedding service) ─────────
  postgres:
    image: pgvector/pgvector:pg18
    container_name: fk-encore-db${DEPLOY_NAME_SUFFIX:-}
    restart: unless-stopped
    ports:
      - "${DEPLOY_HOST_PORT_POSTGRES:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${DEPLOY_PG_DATABASE:-encore}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DEPLOY_PG_DATABASE:-encore}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Geo database (PostgreSQL + PostGIS, per-region OSM data) ───────────────
  # Backs the geo service below. One DB per imported region
  # (nom_europe_germany_bayern, …) — created by the geo service's
  # /import endpoint, not declared statically here.
  geo-db:
    image: postgis/postgis:16-3.4
    container_name: fk-encore-geo-db${DEPLOY_NAME_SUFFIX:-}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${GEO_DB_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - geo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Geo service (reverse geocoding + POI lookup) ───────────────────────────
  # Node HTTP service that owns osm2pgsql + osmium and talks to geo-db.
  # Replaces the per-region Nominatim/Overpass Docker containers that
  # osm-admin used to spawn at runtime. Image is built and published by
  # .github/workflows/docker-image-geo.yml; the server only pulls.
  geo:
    image: ghcr.io/as19git67/fk-encore-geo:${DEPLOY_IMAGE_TAG:-latest}
    container_name: fk-encore-geo${DEPLOY_NAME_SUFFIX:-}
    restart: unless-stopped
    user: "568:568"
    labels:
      com.centurylinklabs.watchtower.scope: ${DEPLOY_WATCHTOWER_SCOPE:-fkprod}
    depends_on:
      chown-init:
        condition: service_completed_successfully
      geo-db:
        condition: service_healthy
    environment:
      GEO_PORT: "8080"
      GEO_DB_HOST: geo-db
      GEO_DB_PORT: "5432"
      GEO_DB_USER: postgres
      GEO_DB_PASSWORD: ${GEO_DB_PASSWORD:-postgres}
      GEO_DB_ADMIN_DB: postgres
      GEO_SHARED_SECRET: ${GEO_SHARED_SECRET:-}
      GEO_OSM2PGSQL_CACHE_MB: ${GEO_OSM2PGSQL_CACHE_MB:-2000}
      GEO_OSM2PGSQL_PROCS: ${GEO_OSM2PGSQL_PROCS:-2}
    volumes:
      - geo_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Watchtower ────────────────────────────────────────────────────────────
  # Observes only containers carrying the configured scope label so two
  # deployments on the same host stay independent.
  watchtower:
    image: containrrr/watchtower
    container_name: fk-encore-watchtower${DEPLOY_NAME_SUFFIX:-}
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN:-}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCOPE: ${DEPLOY_WATCHTOWER_SCOPE:-fkprod}
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
    command: >
      --http-api-periodic-polls
      fk-encore-app${DEPLOY_NAME_SUFFIX:-}
      fk-encore-insightface${DEPLOY_NAME_SUFFIX:-}
      fk-encore-embedding${DEPLOY_NAME_SUFFIX:-}
      fk-encore-llm${DEPLOY_NAME_SUFFIX:-}
      fk-encore-geo${DEPLOY_NAME_SUFFIX:-}
    ports:
      - "${DEPLOY_HOST_PORT_WATCHTOWER:-9000}:8080"

# ── Networks ──────────────────────────────────────────────────────────────────
# Only the implicit compose `default` bridge network is needed; the geo
# service is reached over it by service name.

# ── Volumes ───────────────────────────────────────────────────────────────────
# Every persisted volume binds into ${DEPLOY_DATA_ROOT}/<subdir>. Override
# DEPLOY_DATA_ROOT in `.env` per deployment so two stacks don't write into
# each other's data.
volumes:
  photos:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/photos
  thumbnails:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/thumbnails
  pgdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/pgdata
  backup:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/backup
  llm_models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/llm_models
  embedding_models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/embedding_models
  documents:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/documents
  documents_inbox:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/documents-inbox
  finance_import:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/finance-import
  finance_export:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/finance-export
  geo_db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/geo-db
  geo_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_DATA_ROOT:-./data}/geo
