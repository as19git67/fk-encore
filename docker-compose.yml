services:
  # ── Bind-mount permission fixer ────────────────────────────────────────────
  # Runs once as root before the app/llm_service start and ensures the three
  # bind-mounted host directories (documents archive, documents inbox, llm
  # model cache) are owned by 568:568 — the TrueNAS SCALE "apps" user that
  # every other container runs as. Without this, a freshly provisioned host
  # directory would be root-owned and the non-root services would fail to
  # write into it. Exits 0 on success; depends_on / service_completed_success-
  # fully gates the dependent services on that exit.
  chown-init:
    image: alpine:3.20
    container_name: fk-encore-chown-init
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown -R 568:568 /mnt/documents /mnt/documents-inbox /mnt/models"]
    volumes:
      - documents:/mnt/documents
      - documents_inbox:/mnt/documents-inbox
      - llm_models:/mnt/models

  # ── Main Encore.ts Application ─────────────────────────────────────────────
  app:
    image: ghcr.io/as19git67/fk-encore:latest
    container_name: fk-encore-app
    restart: unless-stopped
    # Run as the TrueNAS SCALE "apps" user (UID/GID 568). Ensure the bind-
    # mounted host directories (photos, thumbnails) are owned by 568:568.
    user: "568:568"
    labels:
      com.centurylinklabs.watchtower.scope: fkprod
    depends_on:
      chown-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      insightface:
        condition: service_healthy
      embedding_service:
        condition: service_healthy
      landmark:
        condition: service_healthy
      llm_service:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_TYPE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: encore
      PHOTO_UPLOAD_DIR: /mnt/data/photos
      PHOTO_THUMBNAIL_DIR: /mnt/data/thumbnails
      # Root directory for external photo libraries (issue #75). Every path
      # registered through /libraries must live under this root. Mount one or
      # more host directories into subpaths of /mnt/libraries (see the
      # `volumes:` section below for an example).
      PHOTO_LIBRARIES_ROOT: /mnt/libraries
      # Documents module — see documents/documents.service.ts.
      # DOCUMENTS_DIR holds the canonical archive (sha256-named PDFs in
      # YYYY/YYYY-MM shards). DOCUMENTS_INBOX_DIR is the watched drop
      # zone the Raspberry Pi rsyncs scans into.
      DOCUMENTS_DIR: /mnt/data/documents
      DOCUMENTS_INBOX_DIR: /mnt/data/documents-inbox
      DOCUMENTS_MAX_SIZE_MB: ${DOCUMENTS_MAX_SIZE_MB:-50}
      # Optional: which user owns documents arriving via the inbox. Falls
      # back to the first Admin if unset or unknown.
      DOCUMENTS_INBOX_USER_EMAIL: ${DOCUMENTS_INBOX_USER_EMAIL:-}
      # OCR knobs — see documents/text-extract.ts.
      DOCUMENTS_OCR_LANG: ${DOCUMENTS_OCR_LANG:-deu+eng}
      DOCUMENTS_OCR_DPI: ${DOCUMENTS_OCR_DPI:-200}
      ADMIN_EMAIL: admin@example.com
      ADMIN_NAME: Admin
      ADMIN_PASSWORD: changeme   # <-- hier anpassen!
      RP_ID: localhost
      RP_NAME: Vivanty App
      RP_ORIGIN: http://localhost:8080
      ENABLE_LOCAL_FACES: "true"
      FACE_DISTANCE_THRESHOLD: "0.42"
      INSIGHTFACE_SERVICE_URL: http://insightface:8000
      EMBEDDING_SERVICE_URL: http://embedding_service:8000
      LANDMARK_SERVICE_URL: http://landmark:8000
      LLM_SERVICE_URL: http://llm_service:8000
      ENABLE_LANDMARKS: "true"
      # SMTP for password reset emails (leave empty to log tokens to console)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      APP_URL: ${APP_URL:-http://localhost:8080}
      # Backup subsystem — see scripts/host/README.md
      BACKUP_DIR: /mnt/backup
      # 30 minutes; overrides the auto-stop safety timer in /internal/backup/start
      BACKUP_AUTO_STOP_MS: ${BACKUP_AUTO_STOP_MS:-1800000}
      # Shared secret for /internal/backup/* — must match
      # /etc/fk-encore/backup-token on the host. Generate with
      # scripts/host/install-backup-hook.sh. Leaving this empty disables
      # the backup endpoints (they respond with 401).
      BACKUP_TOKEN: ${BACKUP_TOKEN:-}
      # Defence-in-depth: comma-separated CIDR allow-list for
      # /internal/backup/*. Requests from outside the list are rejected
      # before the token is even checked — so a leaked token cannot be
      # abused from the public internet. Leave unset to use the built-in
      # defaults (loopback + RFC1918 + IPv6 ULA, which covers the Docker
      # bridge). Override only if the app is fronted by a reverse proxy
      # that SNATs requests from somewhere unusual.
      BACKUP_ALLOW_CIDRS: ${BACKUP_ALLOW_CIDRS:-}
      # Encore.ts proxies requests through its Rust HTTP layer, so the
      # real peer IP arrives in X-Forwarded-For (the Node socket is
      # internal). We therefore trust XFF by default — only set to
      # "false" in test rigs that bypass Encore.
      BACKUP_TRUST_XFF: ${BACKUP_TRUST_XFF:-true}
      # Web Push (optional) — see docs/push-notifications.md.
      # Generate the keypair once with `npx web-push generate-vapid-keys`,
      # then put both keys plus an operator contact into .env. Leaving
      # any of them empty keeps push silently disabled.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Finance module — see docs/finance-fints-integration.md §2.4.
      # FINANCE_CREDENTIALS_KEY is the AES-256-GCM master key that
      # encrypts bank PINs in finance_bankcontact.credentials_encrypted.
      # Must be a 32-byte value, base64-encoded. Generate once with:
      #   node -e 'console.log(require("crypto").randomBytes(32).toString("base64"))'
      # Losing it means every stored credential has to be re-entered.
      FINANCE_CREDENTIALS_KEY: ${FINANCE_CREDENTIALS_KEY:-}
      # ZKA product-id + version are required by lib-fints under PSD2;
      # see https://www.fints.org/de/hersteller/produktregistrierung.
      # The fallbacks below let the stack boot for development and
      # self-hosted use; production deployments should override with a
      # registered product-id in .env (Encore treats an *empty* secret
      # as "not set" and the FinTS dialog fails with
      # "failed to resolve secret: environment variable not found").
      FINANCE_FINTS_PRODUCT_ID: ${FINANCE_FINTS_PRODUCT_ID:-dev-placeholder}
      FINANCE_FINTS_PRODUCT_VERSION: ${FINANCE_FINTS_PRODUCT_VERSION:-0.1.0}
    volumes:
      - photos:/mnt/data/photos
      - thumbnails:/mnt/data/thumbnails
      - documents:/mnt/data/documents
      - documents_inbox:/mnt/data/documents-inbox
      - backup:/mnt/backup
      # External photo libraries — mount any host directories you want to
      # import from under /mnt/libraries. Use `:ro` for link-mode libraries
      # so the container can never modify the originals. Example:
      #   - /Users/anton/Pictures/Archive:/mnt/libraries/archive:ro
      #   - /Users/anton/Pictures/Inbox:/mnt/libraries/inbox

  # ── InsightFace Service (Face Detection) ───────────────────────────────────
  insightface:
    image: ghcr.io/as19git67/fk-encore-insightface:latest
    container_name: fk-encore-insightface
    restart: unless-stopped
    user: "568:568"
    labels:
      com.centurylinklabs.watchtower.scope: fkprod
    environment:
      ORT_LOGGING_LEVEL: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Embedding Service (CLIP + DINOv2) ──────────────────────────────────────
  embedding_service:
    image: ghcr.io/as19git67/fk-encore-embedding:latest
    container_name: fk-encore-embedding
    restart: unless-stopped
    user: "568:568"
    labels:
      com.centurylinklabs.watchtower.scope: fkprod
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/embeddings
      CLIP_MODEL_NAME: xlm-roberta-large-ViT-H-14
      CLIP_PRETRAINED: frozen_laion5b_s13b_b90k
      DINO_MODEL_NAME: facebook/dinov2-base
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Landmark Detection Service (Grounding DINO) ────────────────────────────
  landmark:
    image: ghcr.io/as19git67/fk-encore-landmark:latest
    container_name: fk-encore-landmark
    restart: unless-stopped
    user: "568:568"
    labels:
      com.centurylinklabs.watchtower.scope: fkprod
    environment:
      LANDMARK_THRESHOLD: "0.35"
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ── LLM Service (Llama GGUF classifier + multilingual-e5-base embedder) ───
  # Models are NOT baked into the image — they are mmap'ed from the llm_models
  # volume. Run `docker compose run --rm llm_service /usr/local/bin/download_model.sh`
  # once before first start to populate the volume.
  llm_service:
    image: ghcr.io/as19git67/fk-encore-llm:latest
    container_name: fk-encore-llm
    restart: unless-stopped
    user: "568:568"
    labels:
      com.centurylinklabs.watchtower.scope: fkprod
    depends_on:
      chown-init:
        condition: service_completed_successfully
    environment:
      MODELS_DIR: /models
      LLM_MODEL_PATH: /models/llama.gguf
      EMBEDDING_MODEL: intfloat/multilingual-e5-base
      LLM_CTX: "8192"
      LLM_GPU_LAYERS: "0"
      LOG_LEVEL: INFO
    volumes:
      - llm_models:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5
      # Cold-start on a spinning-rust bind mount has to warm up the GGUF
      # mmap, load sentence-transformers and import torch before uvicorn
      # accepts requests — that can take well over a minute on the TrueNAS
      # SCALE box. A short start_period marks the container unhealthy mid-
      # load, which then cascades into dependent services refusing to start.
      start_period: 180s

  # ── PostgreSQL (shared instance for both app and embedding service) ─────────
  postgres:
    image: pgvector/pgvector:pg18
    container_name: fk-encore-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: encore          # primary database for the app
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d encore"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Watchtower (empfängt Deploy-Trigger via HTTP, zieht neue Images) ─────────
  # Beobachtet ausschließlich Container mit dem Label
  # com.centurylinklabs.watchtower.scope=fkprod (siehe WATCHTOWER_SCOPE).
  watchtower:
    image: containrrr/watchtower
    container_name: fk-encore-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCOPE: fkprod
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
    command: >
      --http-api-periodic-polls
      fk-encore-app
      fk-encore-insightface
      fk-encore-embedding
      fk-encore-landmark
      fk-encore-llm
    ports:
      - "9000:8080"

volumes:
  photos:
    driver: local
    driver_opts: { type: none, o: bind, device: /Users/anton/vivanty_data/photos }
  thumbnails:
    driver: local
    driver_opts: { type: none, o: bind, device: /Users/anton/vivanty_data/thumbnails }
  pgdata:
    driver: local
    driver_opts: { type: none, o: bind, device: /Users/anton/vivanty_data/pgdata }
  # Backup volume — consumed by the /internal/backup/* endpoints and by
  # the restore-on-startup hook. The host-side backup script (see
  # scripts/host/fk-encore-backup.sh) is expected to be able to read and
  # write files in the same directory.
  backup:
    driver: local
    driver_opts: { type: none, o: bind, device: /Users/anton/vivanty_data/backup }
  # Model artefacts for the llm_service (Llama GGUF + sentence-transformers
  # cache). Populate via `docker compose run --rm llm_service /usr/local/bin/download_model.sh`.
  llm_models:
    driver: local
    driver_opts: { type: none, o: bind, device: /Users/anton/vivanty_data/llm_models }
  # Documents archive (sha256-named PDFs in YYYY/YYYY-MM shards).
  documents:
    driver: local
    driver_opts: { type: none, o: bind, device: /Users/anton/vivanty_data/documents }
  # Inbox watched by documents/inbox-watcher.ts. The Raspberry Pi rsyncs
  # scanned PDFs here over SSH; chokidar picks them up once they're stable.
  # See scripts/host/README-documents-inbox.md for the Pi-side setup.
  documents_inbox:
    driver: local
    driver_opts: { type: none, o: bind, device: /Users/anton/vivanty_data/documents-inbox }
