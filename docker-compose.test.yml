# Test-Umgebung: verwendet den 'test'-Tag (gebaut aus PRs).
# Auf TrueNAS in einem separaten Verzeichnis ablegen, z. B.
# /mnt/data/fk-encore-test/. Eigene .env-Datei mit TEST-spezifischen Werten
# anlegen (insbesondere WATCHTOWER_TOKEN). Strukturell ein Spiegel von
# docker-compose.yml — Unterschiede:
#   * Image-Tag :test (statt :latest)
#   * container_name + Watchtower-Scope tragen Suffix -test / fktest
#   * Host-Ports verschoben, damit prod und test parallel laufen können
#     (app 18080, postgres 15432, watchtower 9001)

name: fk-encore-test

services:
  # ── Bind-mount permission fixer ────────────────────────────────────────────
  # Mirror of docker-compose.yml's chown-init. See that file for the rationale.
  chown-init:
    image: alpine:3.20
    container_name: fk-encore-chown-init-test
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown -R 568:568 /mnt/documents /mnt/documents-inbox /mnt/models /mnt/finance-import /mnt/finance-export /mnt/backup"]
    volumes:
      - documents:/mnt/documents
      - documents_inbox:/mnt/documents-inbox
      - llm_models:/mnt/models
      - finance_import:/mnt/finance-import
      - finance_export:/mnt/finance-export
      - backup:/mnt/backup

  # ── Main Encore.ts Application ─────────────────────────────────────────────
  app:
    image: ghcr.io/as19git67/fk-encore:test
    container_name: fk-encore-app-test
    restart: unless-stopped
    user: "568:568"
    labels:
      com.centurylinklabs.watchtower.scope: fktest
    depends_on:
      chown-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      insightface:
        condition: service_healthy
      embedding_service:
        condition: service_healthy
      landmark:
        condition: service_healthy
      llm_service:
        condition: service_healthy
    ports:
      - "18080:8080"
    environment:
      PORT: "8080"
      DB_TYPE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: encore_test
      PHOTO_UPLOAD_DIR: /mnt/data/photos
      PHOTO_THUMBNAIL_DIR: /mnt/data/thumbnails
      # Root directory for external photo libraries (issue #75). Every path
      # registered through /libraries must live under this root.
      PHOTO_LIBRARIES_ROOT: /mnt/libraries
      # Documents module — see documents/documents.service.ts.
      DOCUMENTS_DIR: /mnt/data/documents
      DOCUMENTS_INBOX_DIR: /mnt/data/documents-inbox
      DOCUMENTS_MAX_SIZE_MB: ${DOCUMENTS_MAX_SIZE_MB:-50}
      DOCUMENTS_INBOX_USER_EMAIL: ${DOCUMENTS_INBOX_USER_EMAIL:-}
      DOCUMENTS_OCR_LANG: ${DOCUMENTS_OCR_LANG:-deu+eng}
      DOCUMENTS_OCR_DPI: ${DOCUMENTS_OCR_DPI:-200}
      ADMIN_EMAIL: admin@example.com
      ADMIN_NAME: Admin
      ADMIN_PASSWORD: changeme
      RP_ID: localhost
      RP_NAME: Vivanty App (Test)
      RP_ORIGIN: http://localhost:18080
      ENABLE_LOCAL_FACES: "true"
      FACE_DISTANCE_THRESHOLD: "0.42"
      INSIGHTFACE_SERVICE_URL: http://insightface:8000
      EMBEDDING_SERVICE_URL: http://embedding_service:8000
      LANDMARK_SERVICE_URL: http://landmark:8000
      LLM_SERVICE_URL: http://llm_service:8000
      ENABLE_LANDMARKS: "true"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      APP_URL: ${APP_URL:-http://localhost:18080}
      BACKUP_DIR: /mnt/backup
      BACKUP_AUTO_STOP_MS: ${BACKUP_AUTO_STOP_MS:-1800000}
      BACKUP_TOKEN: ${BACKUP_TOKEN:-}
      BACKUP_ALLOW_CIDRS: ${BACKUP_ALLOW_CIDRS:-}
      BACKUP_TRUST_XFF: ${BACKUP_TRUST_XFF:-true}
      # Finance module — see docker-compose.yml for the full rationale.
      FINANCE_CREDENTIALS_KEY: ${FINANCE_CREDENTIALS_KEY:-}
      FINANCE_FINTS_PRODUCT_ID: ${FINANCE_FINTS_PRODUCT_ID:-dev-placeholder}
      FINANCE_FINTS_PRODUCT_VERSION: ${FINANCE_FINTS_PRODUCT_VERSION:-0.1.0}
      FINANCE_IMPORT_DIR: /mnt/data/finance-import
      FINANCE_EXPORT_DIR: /mnt/data/finance-export
      FINANCE_EXPORT_KEEP: ${FINANCE_EXPORT_KEEP:-30}
    volumes:
      - photos:/mnt/data/photos
      - thumbnails:/mnt/data/thumbnails
      - documents:/mnt/data/documents
      - documents_inbox:/mnt/data/documents-inbox
      - finance_import:/mnt/data/finance-import
      - finance_export:/mnt/data/finance-export
      - backup:/mnt/backup

  # ── InsightFace Service (Face Detection) ───────────────────────────────────
  insightface:
    image: ghcr.io/as19git67/fk-encore-insightface:test
    container_name: fk-encore-insightface-test
    restart: unless-stopped
    user: "568:568"
    labels:
      com.centurylinklabs.watchtower.scope: fktest
    environment:
      ORT_LOGGING_LEVEL: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Embedding Service (CLIP + DINOv2) ──────────────────────────────────────
  embedding_service:
    image: ghcr.io/as19git67/fk-encore-embedding:test
    container_name: fk-encore-embedding-test
    restart: unless-stopped
    user: "568:568"
    labels:
      com.centurylinklabs.watchtower.scope: fktest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/embeddings_test
      CLIP_MODEL_NAME: xlm-roberta-large-ViT-H-14
      CLIP_PRETRAINED: frozen_laion5b_s13b_b90k
      DINO_MODEL_NAME: facebook/dinov2-base
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Landmark Detection Service (Grounding DINO) ────────────────────────────
  landmark:
    image: ghcr.io/as19git67/fk-encore-landmark:test
    container_name: fk-encore-landmark-test
    restart: unless-stopped
    user: "568:568"
    labels:
      com.centurylinklabs.watchtower.scope: fktest
    environment:
      LANDMARK_THRESHOLD: "0.35"
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ── LLM Service (Llama GGUF classifier + multilingual-e5-base embedder) ───
  # Models are NOT baked into the image — they are mmap'ed from the llm_models
  # volume. Run `docker compose run --rm llm_service /usr/local/bin/download_model.sh`
  # once before first start to populate the volume.
  llm_service:
    image: ghcr.io/as19git67/fk-encore-llm:test
    container_name: fk-encore-llm-test
    restart: unless-stopped
    user: "568:568"
    labels:
      com.centurylinklabs.watchtower.scope: fktest
    depends_on:
      chown-init:
        condition: service_completed_successfully
    environment:
      MODELS_DIR: /models
      LLM_MODEL_PATH: /models/llama.gguf
      EMBEDDING_MODEL: intfloat/multilingual-e5-base
      LLM_CTX: "8192"
      LLM_GPU_LAYERS: "0"
      LOG_LEVEL: INFO
    volumes:
      - llm_models:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg18
    container_name: fk-encore-db-test
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: encore_test
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d encore_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Watchtower (Port 9001 — separater Endpunkt vom Produktions-Watchtower) ──
  # Beobachtet ausschließlich Container mit dem Label
  # com.centurylinklabs.watchtower.scope=fktest (siehe WATCHTOWER_SCOPE).
  watchtower:
    image: containrrr/watchtower
    container_name: fk-encore-watchtower-test
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCOPE: fktest
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
    command: >
      --http-api-periodic-polls
      fk-encore-app-test
      fk-encore-insightface-test
      fk-encore-embedding-test
      fk-encore-landmark-test
      fk-encore-llm-test
    ports:
      - "9001:8080"

volumes:
  photos:
    driver: local
    driver_opts: { type: none, o: bind, device: /mnt/data/fk-encore-test/photos }
  thumbnails:
    driver: local
    driver_opts: { type: none, o: bind, device: /mnt/data/fk-encore-test/thumbnails }
  pgdata:
    driver: local
    driver_opts: { type: none, o: bind, device: /mnt/data/fk-encore-test/pgdata }
  backup:
    driver: local
    driver_opts: { type: none, o: bind, device: /mnt/data/fk-encore-test/backup }
  # Model artefacts for the llm_service (Llama GGUF + sentence-transformers
  # cache). Populate via
  # `docker compose run --rm llm_service /usr/local/bin/download_model.sh`.
  llm_models:
    driver: local
    driver_opts: { type: none, o: bind, device: /mnt/data/fk-encore-test/llm_models }
  # Documents archive (sha256-named PDFs in YYYY/YYYY-MM shards).
  documents:
    driver: local
    driver_opts: { type: none, o: bind, device: /mnt/data/fk-encore-test/documents }
  # Inbox watched by documents/inbox-watcher.ts.
  documents_inbox:
    driver: local
    driver_opts: { type: none, o: bind, device: /mnt/data/fk-encore-test/documents-inbox }
  # Finance dropbox: copy `<basename>.pending.json` files here and the
  # chokidar watcher in finance/import-pending.ts picks them up.
  finance_import:
    driver: local
    driver_opts: { type: none, o: bind, device: /mnt/data/fk-encore-test/finance-import }
  # Finance daily snapshot target (one file per day).
  finance_export:
    driver: local
    driver_opts: { type: none, o: bind, device: /mnt/data/fk-encore-test/finance-export }
