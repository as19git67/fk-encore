# fk-encore — the test stack on a copy of production
# (documentation/plans/dev-system.md, "The dev stack").
#
# Layered on top of docker-compose.yml and docker-compose.volumes.yml by
# COMPOSE_FILE in the test stack's env file (template:
# docker-compose.env.test.example):
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.volumes.yml:docker-compose.test.yml
#
# The data under DEPLOY_DATA_ROOT is a ZFS clone of prod's newest nightly
# snapshot, replaced weekly by scripts/host/test-refresh.sh. What differs
# from prod:
#
#   1. No llm-service of its own. A second Gemma 4 does not fit next to the
#      first on a 16 GB card, so the app joins prod's network and talks to
#      prod's llm-service, like the demo. The aesthetic service (which lends
#      prod's GPU at night) does not start either.
#   2. Nothing leaves the host on its own. APP_ENVIRONMENT=dev puts every
#      outbound path under a mode `off | redirect | on` (lib/environment.ts),
#      set per path with DEV_OUTBOUND_<KIND> in the env file. Without a line
#      there, mail goes to the mail catcher below (web page on
#      DEPLOY_HOST_PORT_MAIL), whatever the recipient, and push, FinTS,
#      SerpApi, EODHD, printing and background work on prod's llm-service
#      are off — so an env file copied from prod opens nothing. A path set
#      to `on` uses the key the env file gives it: give it one of test's
#      own, never prod's.
#   3. The upgrade check runs here (service upgrade_check below): every
#      image merged to main migrates a copy of prod's newest dump before
#      prod takes it.
#
# `!override` needs Docker Compose 2.24 or later.

services:
  app:
    depends_on: !override
      chown-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      insightface:
        condition: service_healthy
      embedding_service:
        condition: service_healthy
    environment:
      APP_ENVIRONMENT: dev
      LLM_SERVICE_URL: ${DEPLOY_LLM_SERVICE_URL:-http://fk-encore-llm:8000}
      # Mode per outbound path; empty means the default of lib/environment.ts.
      DEV_OUTBOUND_MAIL: ${DEV_OUTBOUND_MAIL:-}
      DEV_OUTBOUND_PUSH: ${DEV_OUTBOUND_PUSH:-}
      DEV_OUTBOUND_FINTS: ${DEV_OUTBOUND_FINTS:-}
      DEV_OUTBOUND_SERPAPI: ${DEV_OUTBOUND_SERPAPI:-}
      DEV_OUTBOUND_EODHD: ${DEV_OUTBOUND_EODHD:-}
      DEV_OUTBOUND_PRINT: ${DEV_OUTBOUND_PRINT:-}
      DEV_OUTBOUND_LLM: ${DEV_OUTBOUND_LLM:-}
      # Where `redirect` sends mail: the catcher below.
      DEV_MAIL_HOST: mail_catcher
      DEV_MAIL_PORT: "1025"
    networks:
      - default
      - prod

  llm_service:
    profiles: ["own-llm"]

  aesthetic_service:
    profiles: ["own-llm"]

  # Catches every mail the test app sends in `redirect` mode; read them on
  # http://<host>:${DEPLOY_HOST_PORT_MAIL}. Kept in memory, gone on restart.
  mail_catcher:
    image: axllent/mailpit:v1.21.8
    container_name: fk-encore-mail-test
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "2000"
    ports:
      - "${DEPLOY_BIND_MAIL:-0.0.0.0}:${DEPLOY_HOST_PORT_MAIL:-18025}:8025"

  # The upgrade check (documentation/plans/dev-system.md, "The upgrade
  # check"): the app image of a merge to main, tagged `candidate`, restores
  # prod's newest nightly dump into a scratch database of this stack's
  # postgres, runs its migrations on it and on an empty database, compares
  # the two schemas and reports the commit status prod-data/upgrade-check.
  # Prod only takes the image as `latest` after that status is green
  # (.github/workflows/docker-image.yml). Watchtower of this stack replaces
  # the container when a new candidate appears; it checks once and then
  # waits. Only with COMPOSE_PROFILES=upgrade-check in the env file, once
  # the first candidate exists.
  upgrade_check:
    image: ${DEPLOY_IMAGE_BASE:-ghcr.io/as19git67/fk-encore}:${UPGRADE_CHECK_TAG:-candidate}
    container_name: fk-encore-upgrade-check${DEPLOY_NAME_SUFFIX:-}
    profiles: ["upgrade-check"]
    restart: unless-stopped
    user: "568:568"
    labels:
      com.centurylinklabs.watchtower.scope: ${DEPLOY_WATCHTOWER_SCOPE:-fkprod}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["node", "/opt/fk-encore/upgrade-check/upgrade-check.mjs"]
    command: ["--stay"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      UPGRADE_CHECK_DUMP_DIR: /mnt/prod-backup
      UPGRADE_CHECK_GITHUB_TOKEN: ${UPGRADE_CHECK_GITHUB_TOKEN:-}
      UPGRADE_CHECK_IGNORE: ${UPGRADE_CHECK_IGNORE:-}
    volumes:
      # Prod's backup directory, read-only: the check reads the newest
      # encore-daily-*.dump and nothing else. Never created by compose.
      - type: bind
        source: ${UPGRADE_CHECK_DUMP_DIR:-/upgrade-check-dump-dir-is-not-set}
        target: /mnt/prod-backup
        read_only: true
        bind:
          create_host_path: false

  # The list of docker-compose.yml plus the upgrade check: Watchtower only
  # updates the containers it names.
  watchtower:
    command: >
      --http-api-periodic-polls
      fk-encore-app${DEPLOY_NAME_SUFFIX:-}
      fk-encore-insightface${DEPLOY_NAME_SUFFIX:-}
      fk-encore-embedding${DEPLOY_NAME_SUFFIX:-}
      fk-encore-llm${DEPLOY_NAME_SUFFIX:-}
      fk-encore-aesthetic${DEPLOY_NAME_SUFFIX:-}
      fk-encore-receipt-ocr${DEPLOY_NAME_SUFFIX:-}
      fk-encore-geo${DEPLOY_NAME_SUFFIX:-}
      fk-encore-routing${DEPLOY_NAME_SUFFIX:-}
      fk-encore-taxonomy-tools${DEPLOY_NAME_SUFFIX:-}
      fk-encore-upgrade-check${DEPLOY_NAME_SUFFIX:-}

networks:
  prod:
    external: true
    # The default network of the prod stack: <COMPOSE_PROJECT_NAME>_default.
    name: ${TEST_PROD_NETWORK:-fk-encore_default}
