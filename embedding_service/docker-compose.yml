services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: embedding_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: embeddings
    # Loopback only: this is a development convenience with the default
    # postgres/postgres credentials, and on a laptop on an untrusted network
    # "0.0.0.0" makes it an open database.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  embedding_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: embedding_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/embeddings
      CLIP_MODEL_NAME: xlm-roberta-large-ViT-H-14
      CLIP_PRETRAINED: frozen_laion5b_s13b_b90k
      DINO_MODEL_NAME: facebook/dinov2-base
      LOG_LEVEL: INFO
    # Loopback only — the service has no authentication of its own.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - embedding_models:/models

volumes:
  pgdata:
  embedding_models:
