# Optional document-AI profile for one NVIDIA GPU. Combine this with the base
# compose file; photo embedding and face recognition intentionally stay on CPU.
services:
  llm_service:
    image: ${LLM_GPU_IMAGE:-ghcr.io/as19git67/fk-encore-llm-gpu}:${DEPLOY_IMAGE_TAG:-latest}
    build:
      context: ./llm-service
      dockerfile: Dockerfile.gpu
    environment:
      LLM_MODEL_PATH: ${LLM_GPU_MODEL_PATH:-/models/Qwen3-14B-Q4_K_M.gguf}
      LLM_MODEL_URL: ${LLM_GPU_MODEL_URL:-https://huggingface.co/Qwen/Qwen3-14B-GGUF/resolve/main/Qwen3-14B-Q4_K_M.gguf}
      LLM_MODEL_SHA256: ${LLM_GPU_MODEL_SHA256:-}
      LLM_GPU_LAYERS: ${LLM_GPU_OFFLOAD_LAYERS:--1}
      LLM_ACCELERATOR: cuda
      LLM_EMBED_DEVICE: ${LLM_GPU_EMBED_DEVICE:-cuda}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
