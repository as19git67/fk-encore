<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 900" role="img" aria-label="Weiterreise mit festem Termin: Abfahrts- und Ankunftstag eingeben, Folgen für die Aufenthalte und Konflikte" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="16" y="28" font-size="15" fill="#1f2328" font-weight="600">Weiterreise mit festem Termin (Ticket) und ein Konflikt</text><rect x="16" y="48" width="360" height="760" rx="24" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="34" y="82" font-size="12" fill="#2f6fd6">Abbrechen</text><text x="196" y="82" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle">Weiterreise</text><text x="360" y="82" font-size="12" fill="#2f6fd6" font-weight="600" text-anchor="end">Sichern</text><text x="34" y="112" font-size="10.5" fill="#656d76" font-weight="600">ERSTER ORT → ZWEITER ORT</text><rect x="32" y="122" width="72" height="28" rx="6" fill="none" stroke="#8c959f"/><text x="68" y="141" font-size="11" fill="#1f2328" text-anchor="middle">Flug</text><rect x="108" y="122" width="80" height="28" rx="6" fill="#2f6fd6" fill-opacity="0.15" stroke="#2f6fd6"/><text x="148" y="141" font-size="11" fill="#2f6fd6" text-anchor="middle">Bahn, Bus</text><rect x="192" y="122" width="60" height="28" rx="6" fill="none" stroke="#8c959f"/><text x="222" y="141" font-size="11" fill="#1f2328" text-anchor="middle">Auto</text><text x="34" y="190" font-size="12" fill="#1f2328">Termin steht fest</text><rect x="318" y="175" width="40" height="22" rx="11" fill="#2fa64a"/><circle cx="347" cy="186" r="9" fill="#ffffff"/><text x="34" y="228" font-size="12" fill="#1f2328">Abfahrtstag</text><rect x="212" y="210" width="110" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="222" y="229" font-size="11.5" fill="#1f2328">05.06.2027</text><text x="34" y="268" font-size="12" fill="#1f2328">Abfahrt</text><text x="34" y="283" font-size="10.5" fill="#656d76">Erster Ort</text><rect x="212" y="252" width="110" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="222" y="271" font-size="11.5" fill="#1f2328">21:30</text><circle cx="346" cy="266" r="7" fill="#656d76" fill-opacity="0.5"/><text x="34" y="320" font-size="12" fill="#1f2328">Ankunftstag</text><rect x="212" y="302" width="110" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="222" y="321" font-size="11.5" fill="#1f2328">06.06.2027</text><text x="34" y="360" font-size="12" fill="#1f2328">Ankunft</text><text x="34" y="375" font-size="10.5" fill="#656d76">Zweiter Ort</text><rect x="212" y="344" width="110" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="222" y="363" font-size="11.5" fill="#1f2328">07:15</text><circle cx="346" cy="358" r="7" fill="#656d76" fill-opacity="0.5"/><text x="34" y="408" font-size="10.5" fill="#656d76">↔ „Erster Ort“ endet jetzt am Sa., 5. Juni (3 Tage · 2 Nächte).</text><text x="34" y="426" font-size="10.5" fill="#656d76">↔ „Zweiter Ort“ beginnt jetzt am So., 6. Juni.</text><text x="34" y="452" font-size="10.5" fill="#656d76">Ein Ticket für Zug, Flug oder Fähre: die Weiterreise bleibt an</text><text x="34" y="466" font-size="10.5" fill="#656d76">diesem Tag stehen. Der Aufenthalt davor endet am Abfahrtstag,</text><text x="34" y="480" font-size="10.5" fill="#656d76">die Aufenthalte danach folgen der Ankunft. Ortszeit.</text><text x="34" y="512" font-size="12" fill="#1f2328">Nächte unterwegs</text><text x="360" y="512" font-size="11.5" fill="#656d76" text-anchor="end">1</text><text x="34" y="534" font-size="10.5" fill="#656d76">Die Nächte folgen aus Abfahrts- und Ankunftstag.</text><text x="34" y="566" font-size="10.5" fill="#656d76" font-weight="600">NOTIZ</text><rect x="32" y="574" width="328" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="42" y="593" font-size="11.5" fill="#1f2328">Nachtzug, Wagen 12, Platz 45</text><text x="196" y="650" font-size="12" fill="#cf222e" text-anchor="middle">Angaben zurücksetzen</text><rect x="392" y="48" width="360" height="760" rx="24" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="410" y="82" font-size="12" fill="#2f6fd6">Abbrechen</text><text x="572" y="82" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle">Weiterreise</text><text x="736" y="82" font-size="12" fill="#2f6fd6" font-weight="600" text-anchor="end">Sichern</text><text x="410" y="112" font-size="10.5" fill="#656d76" font-weight="600">ERSTER ORT → HAFENSTADT</text><text x="410" y="150" font-size="12" fill="#1f2328">Termin steht fest</text><rect x="694" y="135" width="40" height="22" rx="11" fill="#2fa64a"/><circle cx="723" cy="146" r="9" fill="#ffffff"/><text x="410" y="188" font-size="12" fill="#1f2328">Abfahrtstag</text><rect x="588" y="170" width="110" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="598" y="189" font-size="11.5" fill="#1f2328">01.06.2027</text><text x="410" y="228" font-size="12" fill="#1f2328">Abfahrt</text><text x="410" y="243" font-size="10.5" fill="#656d76">Erster Ort</text><rect x="588" y="212" width="110" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="598" y="231" font-size="11.5" fill="#1f2328">10:00</text><circle cx="722" cy="226" r="7" fill="#656d76" fill-opacity="0.5"/><text x="410" y="280" font-size="12" fill="#1f2328">Ankunftstag</text><rect x="588" y="262" width="110" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="598" y="281" font-size="11.5" fill="#1f2328">01.06.2027</text><text x="410" y="320" font-size="12" fill="#1f2328">Ankunft</text><text x="410" y="335" font-size="10.5" fill="#656d76">Hafenstadt</text><rect x="588" y="304" width="110" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="598" y="323" font-size="11.5" fill="#1f2328">15:00</text><circle cx="722" cy="318" r="7" fill="#656d76" fill-opacity="0.5"/><text x="410" y="368" font-size="10.5" fill="#cf222e">⚠ Die Weiterreise hat einen festen Termin am Di., 1. Juni,</text><text x="410" y="382" font-size="10.5" fill="#cf222e">aber „Erster Ort“ beginnt erst am Do., 3. Juni. Davor kürzen,</text><text x="410" y="396" font-size="10.5" fill="#cf222e">„Erster Ort“ lösen oder den Termin ändern.</text><text x="410" y="420" font-size="10.5" fill="#cf222e">⚠ „Hafenstadt“ ist auf den Mo., 7. Juni festgelegt, die</text><text x="410" y="434" font-size="10.5" fill="#cf222e">Weiterreise kommt mit festem Termin aber am Di., 1. Juni an.</text><text x="410" y="448" font-size="10.5" fill="#cf222e">Einen der beiden Termine lösen.</text><text x="410" y="480" font-size="10.5" fill="#656d76">„Sichern“ zeigt die erste Meldung noch einmal unten im</text><text x="410" y="494" font-size="10.5" fill="#656d76">Blatt und schreibt nichts, solange ein Konflikt besteht.</text><text x="16" y="840" font-size="11.5" fill="#1f2328">Mit Termin ist die Weiterreise gepinnt wie ein Aufenthalt mit „Beginn steht fest“: sie bleibt an ihrem Tag,</text><text x="16" y="860" font-size="11.5" fill="#1f2328">der Aufenthalt davor endet am Abfahrtstag (seine Länge folgt), die Aufenthalte danach rücken mit der Ankunft.</text><text x="16" y="880" font-size="11.5" fill="#1f2328">Im Blatt des Aufenthalts stehen „Von“/„Bis“ dann nur lesbar da; die Karte im Verlauf trägt eine Nadel.</text></svg>
