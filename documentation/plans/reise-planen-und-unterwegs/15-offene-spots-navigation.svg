<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1100" viewBox="0 0 1280 1100" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-label="Navigation zwischen den Bildschirmen des Reiseplaners in der iOS-App">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="28" font-size="15" font-weight="600" fill="#1f2328">Offene Spots: was sich in der Navigation ändert</text>
<path d="M180.0,362.0 L250.0,362.0" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#a)"/>
<text x="215.0" y="356.0" text-anchor="middle" font-size="11.5" fill="#1f2328">antippen</text>
<path d="M100.0,334.0 L100.0,102.0 L250.0,102.0" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#a)"/>
<text x="108.0" y="200.0" text-anchor="start" font-size="11.5" fill="#1f2328">„Neue Reise“</text>
<path d="M450.0,102.0 L720.0,102.0" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#a)"/>
<text x="585.0" y="96.0" text-anchor="middle" font-size="11.5" fill="#1f2328">„Aufenthalt hinzufügen“</text>
<path d="M450.0,362.0 L520.0,362.0" fill="none" stroke="#57606a" stroke-width="1.3"/>
<path d="M520.0,192.0 L520.0,552.0" fill="none" stroke="#57606a" stroke-width="1.3"/>
<path d="M520.0,192.0 L720.0,192.0" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#a)"/>
<text x="620.0" y="186.0" text-anchor="middle" font-size="11.5" fill="#1f2328">nach rechts wischen, lang drücken</text>
<path d="M520.0,282.0 L720.0,282.0" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#a)"/>
<text x="620.0" y="276.0" text-anchor="middle" font-size="11.5" fill="#1f2328">Weiterreise antippen</text>
<path d="M520.0,372.0 L720.0,372.0" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#a)"/>
<text x="620.0" y="366.0" text-anchor="middle" font-size="11.5" fill="#1f2328">Plus an einer Schiffsfahrt</text>
<path d="M520.0,462.0 L720.0,462.0" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#a)"/>
<text x="620.0" y="456.0" text-anchor="middle" font-size="11.5" fill="#1f2328">Zuhause antippen</text>
<path d="M520.0,552.0 L720.0,552.0" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#a)"/>
<text x="620.0" y="546.0" text-anchor="middle" font-size="11.5" fill="#1f2328">Koffer oben</text>
<path d="M390.0,320.0 L390.0,120.0 L720.0,120.0" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#a)"/>
<text x="600.0" y="132.0" text-anchor="middle" font-size="11.5" fill="#1f2328">Plus an der Linie</text>
<path d="M840.0,310.0 L840.0,344.0" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#a)"/>
<text x="848.0" y="332.0" text-anchor="start" font-size="11.5" fill="#1f2328">Hafen einfügen</text>
<path d="M350.0,404.0 L350.0,690.0" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#a)"/>
<text x="358.0" y="520.0" text-anchor="start" font-size="11.5" fill="#1f2328">Aufenthalt oder</text>
<text x="358.0" y="535.0" text-anchor="start" font-size="11.5" fill="#1f2328">Tag antippen</text>
<text x="342.0" y="600.0" text-anchor="end" font-size="11.5" fill="#1f2328">Zurück</text>
<path d="M450.0,732.0 L520.0,732.0" fill="none" stroke="#57606a" stroke-width="1.3"/>
<path d="M520.0,688.0 L520.0,1028.0" fill="none" stroke="#57606a" stroke-width="1.3"/>
<path d="M520.0,688.0 L720.0,688.0" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#a)"/>
<text x="620.0" y="682.0" text-anchor="middle" font-size="11.5" fill="#1f2328">„Ideen (n) und Suche“</text>
<path d="M520.0,808.0 L720.0,808.0" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#a)"/>
<text x="620.0" y="802.0" text-anchor="middle" font-size="11.5" fill="#1f2328">„⋯“ an der Karte</text>
<path d="M520.0,918.0 L720.0,918.0" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#a)"/>
<text x="620.0" y="912.0" text-anchor="middle" font-size="11.5" fill="#1f2328">„⋯“ am Tageskopf</text>
<path d="M520.0,1028.0 L720.0,1028.0" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#a)"/>
<text x="620.0" y="1022.0" text-anchor="middle" font-size="11.5" fill="#1f2328">„Tag füllen“ an einem Tag</text>
<path d="M520.0,688.0 L520.0,638.0 L1140.0,638.0 L1140.0,660.0" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#a)"/>
<text x="860.0" y="632.0" text-anchor="middle" font-size="11.5" fill="#1f2328">Spot-Karte antippen</text>
<path d="M960.0,688.0 L1020.0,688.0" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#a)"/>
<text x="990.0" y="682.0" text-anchor="middle" font-size="11.5" fill="#1f2328">Zeile</text>
<path d="M1140.0,716.0 L1140.0,780.0" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#a)"/>
<text x="1148.0" y="754.0" text-anchor="start" font-size="11.5" fill="#1f2328">„Route“, Wegzeile</text>
<rect x="20" y="334" width="160" height="56" rx="12" fill="#eef4fd" stroke="#2f6fd6" stroke-width="1.5"/>
<text x="32" y="356" font-size="13.5" font-weight="600" fill="#1f2328">Reisen</text>
<text x="32" y="374" font-size="11.5" fill="#656d76">Liste der Reisen</text>
<rect x="250" y="74" width="200" height="56" rx="12" fill="#eef4fd" stroke="#2f6fd6" stroke-width="1.5"/>
<text x="262" y="96" font-size="13.5" font-weight="600" fill="#1f2328">Neue Reise</text>
<text x="262" y="114" font-size="11.5" fill="#656d76">leerer Reiseverlauf</text>
<rect x="250" y="320" width="200" height="84" rx="12" fill="#eef4fd" stroke="#2f6fd6" stroke-width="1.5"/>
<text x="262" y="342" font-size="13.5" font-weight="600" fill="#1f2328">Reiseverlauf</text>
<text x="262" y="360" font-size="11.5" fill="#656d76">Aufenthalte mit ihren Tagen,</text>
<text x="262" y="375" font-size="11.5" fill="#656d76">Weiterreisen; Liste | Karte</text>
<rect x="720" y="74" width="240" height="56" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="732" y="96" font-size="13.5" font-weight="600" fill="#1f2328">Neuer Aufenthalt</text>
<text x="732" y="114" font-size="11.5" fill="#656d76">Wo, Von, Wie lange, Vor Ort</text>
<rect x="720" y="164" width="240" height="56" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="732" y="186" font-size="13.5" font-weight="600" fill="#1f2328">Aufenthalt</text>
<text x="732" y="204" font-size="11.5" fill="#656d76">Details, „Aufenthalt planen“</text>
<rect x="720" y="254" width="240" height="56" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="732" y="276" font-size="13.5" font-weight="600" fill="#1f2328">Weiterreise</text>
<text x="732" y="294" font-size="11.5" fill="#656d76">Zeiten, Nächte, Notiz</text>
<rect x="720" y="344" width="240" height="56" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="732" y="366" font-size="13.5" font-weight="600" fill="#1f2328">Neuer Hafen</text>
<text x="732" y="384" font-size="11.5" fill="#656d76">teilt eine Schiffsfahrt</text>
<rect x="720" y="434" width="240" height="56" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="732" y="456" font-size="13.5" font-weight="600" fill="#1f2328">Zuhause</text>
<text x="732" y="474" font-size="11.5" fill="#656d76">Anfang und Ende der Reise</text>
<rect x="720" y="524" width="240" height="56" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.1"/>
<text x="732" y="546" font-size="13.5" font-weight="600" fill="#1f2328">Reise-Menü (Koffer)</text>
<text x="732" y="564" font-size="11.5" fill="#656d76">Einstellungen, Gruppe, Änderungen</text>
<rect x="250" y="690" width="200" height="84" rx="12" fill="#fff8e5" stroke="#bf8700" stroke-width="2"/>
<text x="262" y="712" font-size="13.5" font-weight="600" fill="#1f2328">Aufenthalt planen</text>
<text x="262" y="730" font-size="11.5" fill="#656d76">vorab: Noch offen + Tage (A)</text>
<text x="262" y="745" font-size="11.5" fill="#656d76">unterwegs: Als Nächstes (C, D)</text>
<rect x="720" y="1000" width="240" height="56" rx="12" fill="#eafbea" stroke="#1a7f37" stroke-width="2" stroke-dasharray="6 4"/>
<text x="732" y="1022" font-size="13.5" font-weight="600" fill="#1f2328">Tag füllen</text>
<text x="732" y="1040" font-size="11.5" fill="#656d76">Vorschlag mit Gründen (B)</text>
<rect x="720" y="660" width="240" height="56" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="732" y="682" font-size="13.5" font-weight="600" fill="#1f2328">Spot-Auswahl</text>
<text x="732" y="700" font-size="11.5" fill="#656d76">Ideen, Highlights, Suche, + Tag n</text>
<rect x="1020" y="660" width="240" height="56" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="1032" y="682" font-size="13.5" font-weight="600" fill="#1f2328">Spot-Details</text>
<text x="1032" y="700" font-size="11.5" fill="#656d76">halb und voll, seitlich blättern</text>
<rect x="1020" y="780" width="240" height="56" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="1032" y="802" font-size="13.5" font-weight="600" fill="#1f2328">Weg</text>
<text x="1032" y="820" font-size="11.5" fill="#656d76">Verkehrsmittel, Dauer, Karten-App</text>
<rect x="720" y="780" width="240" height="56" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.1"/>
<text x="732" y="802" font-size="13.5" font-weight="600" fill="#1f2328">Aktionen ⋯</text>
<text x="732" y="820" font-size="11.5" fill="#656d76">anderer Tag, Termin, Priorität</text>
<rect x="720" y="890" width="240" height="56" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.1"/>
<text x="732" y="912" font-size="13.5" font-weight="600" fill="#1f2328">Tag ⋯</text>
<text x="732" y="930" font-size="11.5" fill="#656d76">Reihenfolge, Pause, feste Zeit, Ausflug</text>
<text x="1000" y="904" font-size="11.5" fill="#656d76">Ein Tag hat keinen eigenen Bildschirm.</text>
<text x="1000" y="920" font-size="11.5" fill="#656d76">Die Karte der Tage: „Tage | Karte“</text><text x="1000" y="936" font-size="11.5" fill="#656d76">oben in „Aufenthalt planen“.</text>
<text x="20" y="450" font-size="11.5" fill="#656d76">Unterwegs öffnet sich die Reise</text>
<text x="20" y="466" font-size="11.5" fill="#656d76">gleich in „Aufenthalt planen“,</text>
<text x="20" y="482" font-size="11.5" fill="#656d76">am laufenden Tag.</text>
<text x="20" y="820" font-size="11.5" fill="#656d76">Gelb: derselbe Bildschirm,</text>
<text x="20" y="836" font-size="11.5" fill="#656d76">neuer Inhalt. Vorab steht</text>
<text x="20" y="852" font-size="11.5" fill="#656d76">„Noch offen“ über den Tagen,</text>
<text x="20" y="868" font-size="11.5" fill="#656d76">am laufenden Tag „Als Nächstes“.</text>
<text x="20" y="884" font-size="11.5" fill="#656d76">Grün: neues Blatt.</text>
<text x="20" y="900" font-size="11.5" fill="#656d76">Alles andere bleibt, wie es ist.</text>
<text x="980" y="190" font-size="11.5" fill="#656d76">„Aufenthalt planen“ im Blatt</text>
<text x="980" y="206" font-size="11.5" fill="#656d76">„Aufenthalt“ öffnet ebenfalls</text>
<text x="980" y="222" font-size="11.5" fill="#656d76">die Planung dieses Aufenthalts.</text>
<text x="980" y="238" font-size="11.5" fill="#656d76">Ankunft und Abfahrt „›“</text>
<text x="980" y="254" font-size="11.5" fill="#656d76">öffnen die Weiterreise.</text><text x="980" y="278" font-size="11.5" fill="#656d76">Der Kopf von „Aufenthalt planen“</text><text x="980" y="294" font-size="11.5" fill="#656d76">(„›“) öffnet das Blatt „Aufenthalt“.</text>
<text x="1020" y="560" font-size="11.5" fill="#656d76">In den Spot-Details öffnet</text>
<text x="1020" y="576" font-size="11.5" fill="#656d76">„Karte“ die Karten-App,</text>
<text x="1020" y="592" font-size="11.5" fill="#656d76">„Anderer Tag“ die Tage,</text>
<text x="1020" y="608" font-size="11.5" fill="#656d76">„Mehr“ die Aktionen ⋯.</text>
<rect x="20" y="1072" width="28" height="16" rx="5" fill="#eef4fd" stroke="#2f6fd6"/><text x="56" y="1085" font-size="11.5" fill="#1f2328">Bildschirm, „Zurück“ führt zurück</text>
<rect x="280" y="1072" width="28" height="16" rx="5" fill="#fff" stroke="#8c959f" stroke-dasharray="4 3"/><text x="316" y="1085" font-size="11.5" fill="#1f2328">Blatt von unten</text>
<rect x="440" y="1072" width="28" height="16" rx="5" fill="#f6f8fa" stroke="#8c959f"/><text x="476" y="1085" font-size="11.5" fill="#1f2328">Menü</text>
<rect x="560" y="1072" width="28" height="16" rx="5" fill="#fff8e5" stroke="#bf8700" stroke-width="2"/><text x="596" y="1085" font-size="11.5" fill="#1f2328">ändert sich</text>
<rect x="700" y="1072" width="28" height="16" rx="5" fill="#eafbea" stroke="#1a7f37" stroke-width="2" stroke-dasharray="4 3"/><text x="736" y="1085" font-size="11.5" fill="#1f2328">neu</text>
</svg>