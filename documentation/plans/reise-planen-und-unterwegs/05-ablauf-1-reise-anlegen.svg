<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 470" role="img" aria-label="Vier Schritte von „Neue Reise“ bis zur Planungsansicht eines Aufenthalts" font-size="10"><rect width="100%" height="100%" fill="#ffffff"/><text x="16" y="20" font-size="14" font-weight="600" fill="#1f2328">Ablauf 1 · Eine Reise anlegen (Musterstadt, 3 Tage)</text><g><rect x="16" y="52" width="164" height="340" rx="18" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><circle cx="28" cy="38" r="10" fill="#2f6fd6"></circle><text x="28" y="42" font-size="11" font-weight="600" fill="white" text-anchor="middle">1</text><path d="M184 222.0h16m-5 -5l5 5l-5 5" fill="none" stroke="#8c959f" stroke-width="1.5"></path></g><text x="16" y="414" font-size="10" fill="#1f2328">„+“ bei den Reisen öffnet gleich</text><text x="16" y="428" font-size="10" fill="#1f2328">das Blatt des ersten Aufenthalts.</text><text x="26" y="80" font-size="12" font-weight="600" fill="#1f2328">Reisen</text><text x="168" y="80" font-size="16" font-weight="600" text-anchor="end" fill="#2f6fd6">+</text><rect x="26" y="100" width="144" height="40" rx="5" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="34" y="116" font-size="10" font-weight="600" fill="#1f2328">Küstenreise</text><text x="34" y="130" font-size="9.5" fill="#656d76">Mai 2026 · 9 Tage</text><rect x="26" y="148" width="144" height="40" rx="5" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="34" y="164" font-size="10" font-weight="600" fill="#1f2328">Bergwochenende</text><text x="34" y="178" font-size="9.5" fill="#656d76">Okt 2026 · 3 Tage</text><text x="26" y="214" font-size="9.5" fill="#656d76">Kein leerer Verlauf vorab:</text><text x="26" y="227" font-size="9.5" fill="#656d76">Name, Anreise und weitere</text><text x="26" y="240" font-size="9.5" fill="#656d76">Aufenthalte kommen danach.</text><g><circle cx="162" cy="75" r="12" fill="#2f6fd6" fill-opacity="0.22" stroke="#2f6fd6" stroke-width="1.5"></circle><circle cx="162" cy="75" r="4" fill="#2f6fd6"></circle></g><g><rect x="204" y="52" width="164" height="340" rx="18" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><circle cx="216" cy="38" r="10" fill="#2f6fd6"></circle><text x="216" y="42" font-size="11" font-weight="600" fill="white" text-anchor="middle">2</text><path d="M372 222.0h16m-5 -5l5 5l-5 5" fill="none" stroke="#8c959f" stroke-width="1.5"></path></g><text x="204" y="414" font-size="10" fill="#1f2328">Wo, Von und Bis; „Ergibt“ zählt</text><text x="204" y="428" font-size="10" fill="#1f2328">die Tage. „Hinzufügen“.</text><text x="214" y="76" font-size="9.5" fill="#2f6fd6">Abbrechen</text><text x="358" y="76" font-size="9.5" font-weight="600" text-anchor="end" fill="#2f6fd6">Hinzufügen</text><text x="286" y="94" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f2328">Neuer Aufenthalt</text><text x="214" y="116" font-size="8.5" font-weight="600" fill="#656d76">WO?</text><rect x="214" y="121" width="144" height="22" rx="5" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="222" y="136" font-size="10" fill="#1f2328">Musterstadt</text><text x="214" y="162" font-size="8.5" font-weight="600" fill="#656d76">WANN?</text><text x="214" y="180" font-size="10" fill="#1f2328">Von</text><rect x="270" y="167" width="88" height="20" rx="5" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="276" y="181" font-size="9.5" fill="#1f2328">Mo 23.11.2026</text><text x="214" y="206" font-size="10" fill="#1f2328">Bis</text><rect x="270" y="193" width="88" height="20" rx="5" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="276" y="207" font-size="9.5" fill="#1f2328">Mi 25.11.2026</text><text x="214" y="230" font-size="10" fill="#1f2328">Ergibt</text><text x="358" y="230" font-size="9.5" text-anchor="end" fill="#656d76">3 Tage · 2 Nächte</text><text x="214" y="254" font-size="8.5" font-weight="600" fill="#656d76">ANKUNFT UND ABFAHRT</text><text x="214" y="271" font-size="10" fill="#1f2328">Ankunft</text><text x="358" y="271" font-size="9.5" text-anchor="end" fill="#2f6fd6">offen · festlegen</text><text x="214" y="291" font-size="10" fill="#1f2328">Abfahrt</text><text x="358" y="291" font-size="9.5" text-anchor="end" fill="#2f6fd6">offen · festlegen</text><text x="214" y="315" font-size="8.5" font-weight="600" fill="#656d76">ÜBERNACHTUNG</text><text x="214" y="332" font-size="9.5" fill="#2f6fd6">✓ Unterkunft steht fest</text><text x="214" y="348" font-size="9.5" fill="#1f2328">Noch nichts gebucht</text><text x="214" y="364" font-size="9.5" fill="#1f2328">An Bord</text><g><circle cx="338" cy="73" r="12" fill="#2f6fd6" fill-opacity="0.22" stroke="#2f6fd6" stroke-width="1.5"></circle><circle cx="338" cy="73" r="4" fill="#2f6fd6"></circle></g><g><rect x="392" y="52" width="164" height="340" rx="18" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><circle cx="404" cy="38" r="10" fill="#2f6fd6"></circle><text x="404" y="42" font-size="11" font-weight="600" fill="white" text-anchor="middle">3</text><path d="M560 222.0h16m-5 -5l5 5l-5 5" fill="none" stroke="#8c959f" stroke-width="1.5"></path></g><text x="392" y="414" font-size="10" fill="#1f2328">Die App schlägt den Namen vor;</text><text x="392" y="428" font-size="10" fill="#1f2328">Ändern: Koffer › Einstellungen.</text><text x="392" y="442" font-size="10" fill="#1f2328">„Planen“ öffnet die Tage.</text><text x="402" y="80" font-size="12" font-weight="600" fill="#1f2328">Musterstadt im November</text><text x="402" y="96" font-size="9" fill="#656d76">Namensvorschlag</text><line x1="408" y1="116" x2="408" y2="250" stroke="#d0d7de" stroke-width="1.25"></line><rect x="418" y="116" width="128" height="128" rx="7" fill="#2f6fd6" fill-opacity="0.08" stroke="#2f6fd6" stroke-width="1.25"></rect><text x="426" y="134" font-size="10.5" font-weight="600" fill="#1f2328">Musterstadt</text><text x="426" y="148" font-size="9.5" fill="#656d76">3 Tage · 2 Nächte</text><text x="426" y="161" font-size="9.5" fill="#656d76">Mo 23.11. bis Mi 25.11.</text><text x="426" y="184" font-size="9.5" fill="#1f2328">Tag 1 · Mo</text><text x="498" y="184" font-size="9" fill="#656d76">frei</text><rect x="520" y="179" width="20" height="4" rx="2" fill="#d0d7de" fill-opacity="1" stroke="none" stroke-width="0"></rect><text x="426" y="206" font-size="9.5" fill="#1f2328">Tag 2 · Di</text><text x="498" y="206" font-size="9" fill="#656d76">frei</text><rect x="520" y="201" width="20" height="4" rx="2" fill="#d0d7de" fill-opacity="1" stroke="none" stroke-width="0"></rect><text x="426" y="228" font-size="9.5" fill="#1f2328">Tag 3 · Mi</text><text x="498" y="228" font-size="9" fill="#656d76">frei</text><rect x="520" y="223" width="20" height="4" rx="2" fill="#d0d7de" fill-opacity="1" stroke="none" stroke-width="0"></rect><g><circle cx="408" cy="262" r="8" fill="none" stroke="#8c959f" stroke-width="1.25"></circle><path d="M404.5 262H411.5M408 258.5V265.5" stroke="#8c959f" stroke-width="1.25"></path></g><rect x="500" y="122" width="40" height="16" rx="8" fill="#2f6fd6" fill-opacity="0.12" stroke="#2f6fd6"></rect><text x="520" y="133.5" font-size="8.5" font-weight="600" fill="#2f6fd6" text-anchor="middle">Planen</text><g><circle cx="520" cy="130" r="12" fill="#2f6fd6" fill-opacity="0.22" stroke="#2f6fd6" stroke-width="1.5"></circle><circle cx="520" cy="130" r="4" fill="#2f6fd6"></circle></g><g><rect x="580" y="52" width="164" height="340" rx="18" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><circle cx="592" cy="38" r="10" fill="#2f6fd6"></circle><text x="592" y="42" font-size="11" font-weight="600" fill="white" text-anchor="middle">4</text></g><text x="580" y="414" font-size="10" fill="#1f2328">Alle Tage auf einem Bildschirm.</text><text x="580" y="428" font-size="10" fill="#1f2328">Der Kopf mit „›“ öffnet die Details,</text><text x="580" y="442" font-size="10" fill="#1f2328">das Plus Ideen und Suche.</text><text x="590" y="76" font-size="9.5" fill="#2f6fd6">‹ Reise</text><text x="734" y="108" text-anchor="end" font-size="15" font-weight="600" fill="#8c959f">›</text><text x="590" y="96" font-size="12" font-weight="600" fill="#1f2328">Musterstadt</text><text x="590" y="110" font-size="9" fill="#656d76">3 Tage · Mo 23.11. bis Mi 25.11.</text><rect x="590" y="120" width="144" height="24" rx="6" fill="#2f6fd6" fill-opacity="0.1" stroke="#2f6fd6" stroke-width="1.25"></rect><text x="662" y="136" font-size="10" font-weight="600" fill="#2f6fd6" text-anchor="middle">+ Ideen und Suche</text><text x="590" y="166" font-size="10" font-weight="600" fill="#1f2328">Tag 1 · Mo 23.11.</text><rect x="590" y="174" width="144" height="30" rx="6" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="662" y="193" font-size="9" fill="#656d76" text-anchor="middle">noch frei</text><text x="590" y="222" font-size="10" font-weight="600" fill="#1f2328">Tag 2 · Di 24.11.</text><rect x="590" y="230" width="144" height="30" rx="6" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="662" y="249" font-size="9" fill="#656d76" text-anchor="middle">noch frei</text><text x="590" y="278" font-size="10" font-weight="600" fill="#1f2328">Tag 3 · Mi 25.11.</text><rect x="590" y="286" width="144" height="30" rx="6" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="662" y="305" font-size="9" fill="#656d76" text-anchor="middle">noch frei</text><g><circle cx="662" cy="132" r="12" fill="#2f6fd6" fill-opacity="0.22" stroke="#2f6fd6" stroke-width="1.5"></circle><circle cx="662" cy="132" r="4" fill="#2f6fd6"></circle></g></svg>
