<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 470" role="img" aria-label="Vier Schritte vom leeren Verlauf bis zur Planungsansicht eines Aufenthalts" font-size="10"><rect width="100%" height="100%" fill="#ffffff"/><text x="16" y="20" font-size="14" font-weight="600" fill="#1f2328">Ablauf 1 · Eine Reise anlegen (Musterstadt, 3 Tage)</text><g><rect x="16" y="52" width="164" height="340" rx="18" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><circle cx="28" cy="38" r="10" fill="#2f6fd6"></circle><text x="28" y="42" font-size="11" font-weight="600" fill="white" text-anchor="middle">1</text><path d="M184 222.0h16m-5 -5l5 5l-5 5" fill="none" stroke="#8c959f" stroke-width="1.5"></path></g><text x="16" y="414" font-size="10" fill="#1f2328">„Neue Reise“ öffnet den leeren</text><text x="16" y="428" font-size="10" fill="#1f2328">Verlauf. Tippen auf das Plus.</text><text x="26" y="80" font-size="12" font-weight="600" fill="#1f2328">Neue Reise</text><text x="26" y="96" font-size="9.5" fill="#656d76">noch ohne Datum</text><line x1="38" y1="120" x2="38" y2="160" stroke="#d0d7de" stroke-width="1.25"></line><g><circle cx="38" cy="160" r="8" fill="none" stroke="#8c959f" stroke-width="1.25"></circle><path d="M34.5 160H41.5M38 156.5V163.5" stroke="#8c959f" stroke-width="1.25"></path></g><text x="52" y="164" font-size="10" fill="#656d76">Aufenthalt hinzufügen</text><text x="26" y="200" font-size="9.5" fill="#656d76">Zuhause ist gesetzt? Dann</text><text x="26" y="213" font-size="9.5" fill="#656d76">bietet das Plus auch die</text><text x="26" y="226" font-size="9.5" fill="#656d76">Anreise an.</text><g><circle cx="38" cy="160" r="12" fill="#2f6fd6" fill-opacity="0.22" stroke="#2f6fd6" stroke-width="1.5"></circle><circle cx="38" cy="160" r="4" fill="#2f6fd6"></circle></g><g><rect x="204" y="52" width="164" height="340" rx="18" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><circle cx="216" cy="38" r="10" fill="#2f6fd6"></circle><text x="216" y="42" font-size="11" font-weight="600" fill="white" text-anchor="middle">2</text><path d="M372 222.0h16m-5 -5l5 5l-5 5" fill="none" stroke="#8c959f" stroke-width="1.5"></path></g><text x="204" y="414" font-size="10" fill="#1f2328">Wo, Von und Wie lange.</text><text x="204" y="428" font-size="10" fill="#1f2328">Bis ist gerechnet. „Hinzufügen“.</text><text x="214" y="76" font-size="9.5" fill="#2f6fd6">Abbrechen</text><text x="358" y="76" font-size="9.5" font-weight="600" fill="#2f6fd6" text-anchor="end">Hinzufügen</text><text x="286" y="94" font-size="10.5" font-weight="600" fill="#1f2328" text-anchor="middle">Neuer Aufenthalt</text><text x="214" y="120" font-size="9.5" fill="#656d76">Wo?</text><rect x="214" y="125" width="144" height="22" rx="5" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="222" y="140" font-size="10" fill="#1f2328">Musterstadt</text><text x="214" y="164" font-size="9.5" fill="#656d76">Von?</text><rect x="214" y="169" width="144" height="22" rx="5" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="222" y="184" font-size="10" fill="#1f2328">Mo 23.11.2026</text><text x="214" y="208" font-size="9.5" fill="#656d76">Wie lange?</text><rect x="214" y="213" width="144" height="22" rx="5" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="222" y="228" font-size="10" fill="#1f2328">− 3 Tage · 2 Nächte +</text><text x="214" y="252" font-size="9.5" fill="#656d76">Bis</text><rect x="214" y="257" width="144" height="22" rx="5" fill="#f3f4f6" fill-opacity="1" stroke="#d0d7de" stroke-width="1.25"></rect><text x="222" y="272" font-size="10" fill="#656d76">Mi 25.11.2026</text><text x="214" y="300" font-size="9.5" fill="#656d76">Ohne Hotel: Stadtzentrum,</text><text x="214" y="313" font-size="9.5" fill="#656d76">15 km Umkreis.</text><g><circle cx="338" cy="73" r="12" fill="#2f6fd6" fill-opacity="0.22" stroke="#2f6fd6" stroke-width="1.5"></circle><circle cx="338" cy="73" r="4" fill="#2f6fd6"></circle></g><g><rect x="392" y="52" width="164" height="340" rx="18" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><circle cx="404" cy="38" r="10" fill="#2f6fd6"></circle><text x="404" y="42" font-size="11" font-weight="600" fill="white" text-anchor="middle">3</text><path d="M560 222.0h16m-5 -5l5 5l-5 5" fill="none" stroke="#8c959f" stroke-width="1.5"></path></g><text x="392" y="414" font-size="10" fill="#1f2328">Die App schlägt den Namen vor;</text><text x="392" y="428" font-size="10" fill="#1f2328">Tippen auf den Titel ändert ihn.</text><text x="392" y="442" font-size="10" fill="#1f2328">Tippen auf Musterstadt plant.</text><text x="402" y="80" font-size="12" font-weight="600" fill="#1f2328">Musterstadt im November</text><text x="402" y="96" font-size="9" fill="#656d76">Vorschlag · tippen zum Ändern</text><line x1="408" y1="116" x2="408" y2="250" stroke="#d0d7de" stroke-width="1.25"></line><rect x="418" y="116" width="128" height="128" rx="7" fill="#2f6fd6" fill-opacity="0.08" stroke="#2f6fd6" stroke-width="1.25"></rect><text x="426" y="134" font-size="10.5" font-weight="600" fill="#1f2328">Musterstadt</text><text x="426" y="148" font-size="9.5" fill="#656d76">3 Tage · 2 Nächte</text><text x="426" y="161" font-size="9.5" fill="#656d76">Mo 23.11. bis Mi 25.11.</text><text x="426" y="184" font-size="9.5" fill="#1f2328">Tag 1 · Mo</text><text x="498" y="184" font-size="9" fill="#656d76">frei</text><rect x="520" y="179" width="20" height="4" rx="2" fill="#d0d7de" fill-opacity="1" stroke="none" stroke-width="0"></rect><text x="426" y="206" font-size="9.5" fill="#1f2328">Tag 2 · Di</text><text x="498" y="206" font-size="9" fill="#656d76">frei</text><rect x="520" y="201" width="20" height="4" rx="2" fill="#d0d7de" fill-opacity="1" stroke="none" stroke-width="0"></rect><text x="426" y="228" font-size="9.5" fill="#1f2328">Tag 3 · Mi</text><text x="498" y="228" font-size="9" fill="#656d76">frei</text><rect x="520" y="223" width="20" height="4" rx="2" fill="#d0d7de" fill-opacity="1" stroke="none" stroke-width="0"></rect><g><circle cx="408" cy="262" r="8" fill="none" stroke="#8c959f" stroke-width="1.25"></circle><path d="M404.5 262H411.5M408 258.5V265.5" stroke="#8c959f" stroke-width="1.25"></path></g><g><circle cx="482" cy="138" r="12" fill="#2f6fd6" fill-opacity="0.22" stroke="#2f6fd6" stroke-width="1.5"></circle><circle cx="482" cy="138" r="4" fill="#2f6fd6"></circle></g><g><rect x="580" y="52" width="164" height="340" rx="18" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><circle cx="592" cy="38" r="10" fill="#2f6fd6"></circle><text x="592" y="42" font-size="11" font-weight="600" fill="white" text-anchor="middle">4</text></g><text x="580" y="414" font-size="10" fill="#1f2328">Alle Tage auf einem Bildschirm.</text><text x="580" y="428" font-size="10" fill="#1f2328">„Bearbeiten“ öffnet die Details,</text><text x="580" y="442" font-size="10" fill="#1f2328">das Plus Ideen und Suche.</text><text x="590" y="76" font-size="9.5" fill="#2f6fd6">‹ Reise</text><text x="734" y="76" font-size="9.5" fill="#2f6fd6" text-anchor="end">Bearbeiten</text><text x="590" y="96" font-size="12" font-weight="600" fill="#1f2328">Musterstadt</text><text x="590" y="110" font-size="9" fill="#656d76">3 Tage · Mo 23.11. bis Mi 25.11.</text><rect x="590" y="120" width="144" height="24" rx="6" fill="#2f6fd6" fill-opacity="0.1" stroke="#2f6fd6" stroke-width="1.25"></rect><text x="662" y="136" font-size="10" font-weight="600" fill="#2f6fd6" text-anchor="middle">+ Ideen und Suche</text><text x="590" y="166" font-size="10" font-weight="600" fill="#1f2328">Tag 1 · Mo 23.11.</text><rect x="590" y="174" width="144" height="30" rx="6" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="662" y="193" font-size="9" fill="#656d76" text-anchor="middle">noch frei</text><text x="590" y="222" font-size="10" font-weight="