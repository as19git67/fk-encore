xt x="16" y="725" font-size="11" fill="#1f2328">tragen ihre Dauer als Etikett. ÖPNV kann Valhalla nicht:</text><text x="16" y="740" font-size="11" fill="#1f2328">gestrichelt, Luftlinie, Zeit geschätzt. Unten die Liste</text><text x="16" y="755" font-size="11" fill="#1f2328">mit Wegzeilen; ein Tipp auf Etikett oder Zeile öffnet …</text><text x="392" y="710" font-size="11" fill="#1f2328">… das Blatt „Weg“: Von und Nach (tauschbar), Chips je</text><text x="392" y="725" font-size="11" fill="#1f2328">Verkehrsmittel mit Dauer, nur diese Strecke auf der</text><text x="392" y="740" font-size="11" fill="#1f2328">Karte, Ankunft gegen Öffnungszeit und Ticket geprüft,</text><text x="392" y="755" font-size="11" fill="#1f2328">Übergabe an Apple Karten. Navigiert wird dort.</text></svg>
