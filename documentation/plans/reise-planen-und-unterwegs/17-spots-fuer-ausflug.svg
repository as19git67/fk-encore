<svg xmlns="http://www.w3.org/2000/svg" width="768" height="990" viewBox="0 0 768 990" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Spot-Auswahl für einen Ausflug: wofür gesucht wird und wohin der Spot geht" xmlns:c2pa="http://c2pa.org/manifest"><rect width="100%" height="100%" fill="#ffffff"/><text x="16" y="28" font-size="15" font-weight="600" fill="#1f2328">Spots für einen Ausflug: die Auswahl weiß, wofür sie sucht</text><rect x="16" y="48" width="360" height="900" rx="24" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="36" y="74" font-size="12" fill="#656d76">9:41</text><line x1="16" y1="92" x2="376" y2="92" stroke="#8c959f"/><text x="32" y="118" font-size="13" fill="#2f6fd6">Abbrechen</text><text x="196" y="118" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Spot hinzufügen</text><text x="16" y="970" font-size="12" fill="#656d76">A · Aus „+ Spot in Seestadt“: sucht dort, legt ins Fenster</text><text x="32" y="150" font-size="10.5" font-weight="600" fill="#656d76">FÜR</text><rect x="32" y="158" width="328" height="56" rx="12" fill="#2f6fd6" fill-opacity="0.08" stroke="#2f6fd6" stroke-width="1.25"/><text x="46" y="180" font-size="12.5" font-weight="600" fill="#1f2328">🚗  Ausflug nach Seestadt</text><text x="346" y="180" font-size="11.5" font-weight="600" text-anchor="end" fill="#2f6fd6">Ändern</text><text x="46" y="199" font-size="11" fill="#656d76">Tag 3 · 10:40–13:00 · noch 1 h 20 frei</text><rect x="32" y="226" width="328" height="34" rx="10" fill="#f3f4f6" stroke="none" stroke-width="1"/><text x="46" y="248" font-size="12" fill="#656d76">🔍  In Seestadt suchen</text><rect x="32" y="272" width="84" height="26" rx="13" fill="#2f6fd6" fill-opacity="0.15" stroke="none" stroke-width="1"/><text x="74.0" y="289" font-size="11" font-weight="600" text-anchor="middle" fill="#2f6fd6">Highlights</text><rect x="122" y="272" width="72" height="26" rx="13" fill="#f3f4f6" stroke="none" stroke-width="1"/><text x="158.0" y="289" font-size="11" text-anchor="middle" fill="#1f2328">Ideen (2)</text><rect x="200" y="272" width="60" height="26" rx="13" fill="#f3f4f6" stroke="none" stroke-width="1"/><text x="230.0" y="289" font-size="11" text-anchor="middle" fill="#1f2328">Essen</text><rect x="266" y="272" width="76" height="26" rx="13" fill="#f3f4f6" stroke="none" stroke-width="1"/><text x="304.0" y="289" font-size="11" text-anchor="middle" fill="#1f2328">Strecken</text><text x="32" y="322" font-size="10.5" font-weight="600" fill="#656d76">UM SEESTADT</text><rect x="32" y="330" width="328" height="48" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="46" y="350" font-size="12.5" font-weight="600" fill="#1f2328">Hafenmuseum</text><text x="46" y="367" font-size="11" fill="#656d76">Museum · 1 h · 600 m vom Ziel</text><text x="344" y="360" font-size="18" font-weight="600" text-anchor="end" fill="#2f6fd6">+</text><rect x="32" y="386" width="328" height="48" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="46" y="406" font-size="12.5" font-weight="600" fill="#1f2328">Altstadtgassen</text><text x="46" y="423" font-size="11" fill="#656d76">Spaziergang · 45 min · am Ziel</text><text x="344" y="416" font-size="18" font-weight="600" text-anchor="end" fill="#2f6fd6">+</text><rect x="32" y="442" width="328" height="48" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="46" y="462" font-size="12.5" font-weight="600" fill="#656d76">Kunsthalle</text><text x="46" y="479" font-size="11" fill="#656d76">Museum · 2 h · passt nicht, 1 h 20 frei</text><text x="344" y="472" font-size="18" font-weight="600" text-anchor="end" fill="#656d76">+</text><text x="32" y="506" font-size="10.5" font-weight="600" fill="#656d76">AUS EUREN IDEEN, NAHE SEESTADT</text><rect x="32" y="514" width="328" height="48" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="46" y="534" font-size="12.5" font-weight="600" fill="#1f2328">Burgruine</text><text x="46" y="551" font-size="11" fill="#656d76">Will · 1 h · 2 km vom Ziel</text><text x="344" y="544" font-size="18" font-weight="600" text-anchor="end" fill="#2f6fd6">+</text><rect x="32" y="570" width="328" height="48" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="46" y="590" font-size="12.5" font-weight="600" fill="#1f2328">Strandbad</text><text x="46" y="607" font-size="11" fill="#656d76">Wenn Zeit · 1 h 30 · 3 km vom Ziel</text><text x="344" y="600" font-size="18" font-weight="600" text-anchor="end" fill="#2f6fd6">+</text><text x="32" y="650" font-size="10.5" fill="#656d76">„+“ legt den Spot in das Fenster des Ausflugs,</text><text x="32" y="664" font-size="10.5" fill="#656d76">nicht in den Tag in Bergdorf. Was nicht mehr</text><text x="32" y="678" font-size="10.5" fill="#656d76">ins Fenster passt, steht blass da und geht</text><text x="32" y="692" font-size="10.5" fill="#656d76">trotzdem, der Abschnitt zeigt dann „zu viel“.</text><text x="32" y="720" font-size="10.5" fill="#656d76">Ideen zeigt zuerst, was nahe am Ziel liegt;</text><text x="32" y="734" font-size="10.5" fill="#656d76">der Rest des Aufenthalts folgt darunter.</text><text x="32" y="762" font-size="10.5" fill="#656d76">Langes Drücken auf „+“: anderer Tag, anderer</text><text x="32" y="776" font-size="10.5" fill="#656d76">Ausflug oder nur als Idee merken.</text><rect x="400" y="48" width="360" height="900" rx="24" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="420" y="74" font-size="12" fill="#656d76">9:41</text><line x1="400" y1="92" x2="760" y2="92" stroke="#8c959f"/><text x="416" y="118" font-size="13" fill="#2f6fd6">Abbrechen</text><text x="580" y="118" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Spot hinzufügen</text><text x="400" y="970" font-size="12" fill="#656d76">B · „Ändern“ oder ohne Ausflug geöffnet: wählen, wofür</text><text x="416" y="150" font-size="10.5" font-weight="600" fill="#656d76">FÜR</text><rect x="416" y="158" width="328" height="280" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="430" y="182" font-size="12.5" font-weight="600" fill="#1f2328">Bergdorf</text><text x="430" y="199" font-size="11" fill="#656d76">der Aufenthalt, um die Unterkunft</text><line x1="416" y1="212" x2="744" y2="212" stroke="#d0d7de"/><text x="430" y="234" font-size="10" font-weight="600" fill="#656d76">TAG 3 · DO 9. SEPT.</text><text x="430" y="258" font-size="13" font-weight="600" fill="#2f6fd6">✓</text><text x="450" y="258" font-size="12.5" font-weight="600" fill="#1f2328">🚗  Ausflug nach Seestadt</text><text x="450" y="275" font-size="11" fill="#656d76">10:40–13:00 · noch 1 h 20 frei</text><text x="450" y="304" font-size="12.5" font-weight="600" fill="#1f2328">🚗  Ausflug nach Hafenstadt</text><text x="450" y="321" font-size="11" fill="#656d76">15:50–18:00 · noch 1 h 20 frei</text><line x1="416" y1="336" x2="744" y2="336" stroke="#d0d7de"/><text x="430" y="358" font-size="10" font-weight="600" fill="#656d76">TAG 4 · FR 10. SEPT.</text><text x="450" y="382" font-size="12.5" font-weight="600" fill="#1f2328">Ganzer Tag in Großstadt</text><text x="450" y="399" font-size="11" fill="#656d76">ganztägiger Ausflug</text><line x1="416" y1="412" x2="744" y2="412" stroke="#d0d7de"/><text x="430" y="430" font-size="10" fill="#656d76">Nur Ausflüge stehen hier; ein Tag ohne steckt in „Bergdorf“.</text><text x="416" y="470" font-size="10.5" fill="#656d76">Ohne Ausflug geöffnet (Ideen und Suche), steht</text><text x="416" y="484" font-size="10.5" fill="#656d76">„Für“ auf dem Aufenthalt. Liegt ein Treffer nahe</text><text x="416" y="498" font-size="10.5" fill="#656d76">am Ziel eines Ausflugs, sagt seine Zeile es:</text><rect x="416" y="512" width="328" height="48" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="430" y="532" font-size="12.5" font-weight="600" fill="#1f2328">Hafenmuseum</text><text x="430" y="549" font-size="11" fill="#656d76">nahe Seestadt · Ausflug Tag 3</text><text x="728" y="542" font-size="18" font-weight="600" text-anchor="end" fill="#2f6fd6">+</text><text x="416" y="582" font-size="10.5" fill="#656d76">und „+“ schlägt den Ausflug als Ziel vor, nicht den</text><text x="416" y="596" font-size="10.5" fill="#656d76">ersten freien Tag.</text><text x="416" y="630" font-size="10.5" fill="#656d76">Die Karte der Auswahl zeigt das Ziel des gewählten</text><text x="416" y="644" font-size="10.5" fill="#656d76">Ausflugs mit seinem Suchkreis; „In diesem Bereich</text><text x="416" y="658" font-size="10.5" fill="#656d76">suchen“ bleibt beim Ausflug.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>