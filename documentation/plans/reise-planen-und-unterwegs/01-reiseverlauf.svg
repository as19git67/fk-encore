y="248" font-size="11.5" fill="#656d76">Fr 27.11. bis Mo 30.11. · Hotel Beispiel</text><line x1="64" y1="258" x2="352" y2="258" stroke="#d0d7de"></line><text x="68" y="280" font-size="11.5" fill="#1f2328">Tag 1 · Fr 27.11. · an 12:30</text><text x="262" y="280" text-anchor="end" font-size="11.5" fill="#656d76">2 Spots</text><g><rect x="272" y="276" width="76" height="4" rx="2" fill="#d0d7de"></rect><rect x="272" y="276" width="34.2" height="4" rx="2" fill="#2f6fd6"></rect></g><line x1="64" y1="290" x2="352" y2="290" stroke="#d0d7de"></line><text x="68" y="310" font-size="11.5" fill="#1f2328">Tag 2 · Sa 28.11.</text><text x="262" y="310" text-anchor="end" font-size="11.5" fill="#656d76">4 Spots</text><g><rect x="272" y="306" width="76" height="4" rx="2" fill="#d0d7de"></rect><rect x="272" y="306" width="68.4" height="4" rx="2" fill="#2f6fd6"></rect></g><line x1="64" y1="320" x2="352" y2="320" stroke="#d0d7de"></line><text x="68" y="340" font-size="11.5" fill="#1f2328">Tag 3 · So 29.11.</text><text x="262" y="340" text-anchor="end" font-size="11.5" fill="#656d76">noch frei</text><g><rect x="272" y="336" width="76" height="4" rx="2" fill="#d0d7de"></rect><rect x="272" y="336" width="0" height="4" rx="2" fill="#2f6fd6"></rect></g><line x1="64" y1="350" x2="352" y2="350" stroke="#d0d7de"></line><text x="68" y="370" font-size="11.5" fill="#1f2328">Tag 4 · Mo 30.11. · ab 10:00</text><text x="262" y="370" text-anchor="end" font-size="11.5" fill="#656d76">1 Spot</text><g><rect x="272" y="366" width="76" height="4" rx="2" fill="#d0d7de"></rect><rect x="272" y="366" width="19" height="4" rx="2" fill="#2f6fd6"></rect></g></g><g><g><circle cx="40" cy="390" r="9" fill="none" stroke="#8c959f" stroke-width="1.25"></circle><path d="M36 390H44M40 386V394" stroke="#8c959f" stroke-width="1.25"></path></g></g><g><circle cx="40" cy="418" r="5" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.25"></circle><rect x="56" y="400" width="304" height="36" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="68" y="422" font-size="11.5" fill="#1f2328">Fähre · ab 10:00 · an 17:30</text><text x="348" y="422" text-anchor="end" font-size="11.5" fill="#656d76">Mo 30.11.</text></g><g><circle cx="40" cy="472" r="5" fill="#2f6fd6" stroke="#2f6fd6" stroke-width="1.25"></circle><rect x="56" y="452" width="304" height="172" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="68" y="474" font-weight="600" fill="#1f2328">Küstenstadt</text><text x="348" y="474" text-anchor="end" font-size="11.5" fill="#1f2328">4 Tage · 3 Nächte</text><text x="68" y="492" font-size="11.5" fill="#656d76">Mo 30.11. bis Do 3.12. · noch nichts gebucht</text><line x1="64" y1="502" x2="352" y2="502" stroke="#d0d7de"></line><text x="68" y="524" font-size="11.5" fill="#1f2328">Tag 1 · Mo 30.11. · an 17:30</text><text x="262" y="524" text-anchor="end" font-size="11.5" fill="#656d76">noch frei</text><g><rect x="272" y="520" width="76" height="4" rx="2" fill="#d0d7de"></rect><rect x="272" y="520" width="0" height="4" rx="2" fill="#2f6fd6"></rect></g><line x1="64" y1="534" x2="352" y2="534" stroke="#d0d7de"></line><text x="68" y="554" font-size="11.5" fill="#1f2328">Tag 2 · Di 1.12.</text><text x="262" y="554" text-anchor="end" font-size="11.5" fill="#656d76">3 Spots</text><g><rect x="272" y="550" width="76" height="4" rx="2" fill="#d0d7de"></rect><rect x="272" y="550" width="45.6" height="4" rx="2" fill="#2f6fd6"></rect></g><line x1="64" y1="564" x2="352" y2="564" stroke="#d0d7de"></line><text x="68" y="584" font-size="11.5" fill="#1f2328">Tag 3 · Mi 2.12.</text><text x="262" y="584" text-anchor="end" font-size="11.5" fill="#656d76">zu viel</text><rect x="272" y="580" width="76" height="4" rx="2" fill="#2f6fd6"></rect><line x1="64" y1="594" x2="352" y2="594" stroke="#d0d7de"></line><text x="68" y="614" font-size="11.5" fill="#1f2328">Tag 4 · Do 3.12. · ab 11:00</text><text x="262" y="614" text-anchor="end" font-size="11.5" fill="#656d76">noch frei</text><g><rect x="272" y="610" width="76" height="4" rx="2" fill="#d0d7de"></rect><rect x="272" y="610" width="0" height="4" rx="2" fill="#2f6fd6"></rect></g></g><g><circle cx="40" cy="660" r="5" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.25"></circle><rect x="56" y="642" width="304" height="36" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="68" y="664" font-size="11.5" fill="#1f2328">Heimreise · Flug · Zeiten offen</text><text x="348" y="664" text-anchor="end" font-size="11.5" fill="#656d76">Do 3.12.</text></g><g><g><circle cx="40" cy="700" r="9" fill="none" stroke="#8c959f" stroke-width="1.25"></circle><path d="M36 700H44M40 696V704" stroke="#8c959f" stroke-width="1.25"></path></g><text x="56" y="704" font-size="11.5" fill="#656d76">Aufenthalt oder Heimreise anhängen</text></g><text x="36" y="744" font-size="11" fill="#656d76">Tippen auf einen Aufenthalt öffnet ihn zum Planen (unten).</text><g><rect x="392" y="48" width="352" height="448" rx="24" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="410" y="82" font-size="12" fill="#2f6fd6">Abbrechen</text><text x="568" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Neuer Aufenthalt</text><text x="728" y="82" text-anchor="end" font-size="12" font-weight="600" fill="#2f6fd6">Hinzufügen</text><text x="410" y="121" font-size="12" fill="#1f2328">Wo?</text><rect x="500" y="102" width="228" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="510" y="121" font-size="11.5" fill="#656d76">Ort oder Unterkunft suchen</text><text x="718" y="121" text-anchor="end" font-size="12" fill="#656d76">⌕</text><text x="410" y="173" font-size="12" fill="#1f2328">Von?</text><rect x="500" y="154" width="228" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="510" y="173" font-size="11.5" fill="#1f2328">Fr 27.11.2026</text><text x="500" y="198" font-size="10.5" fill="#656d76">optional, nur am Reiseanfang, sonst gerechnet</text><text x="410" y="233" font-size="12" fill="#1f2328">Wie lange?</text><rect x="500" y="214" width="228" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="614" y="233" text-anchor="middle" font-size="11.5" fill="#1f2328">−   4 Tage · 3 Nächte   +</text><text x="410" y="285" font-size="12" fill="#1f2328">Bis</text><rect x="500" y="266" width="228" height="28" rx="6" fill="#f3f4f6" stroke="#d0d7de"></rect><text x="510" y="285" font-size="11.5" fill="#656d76">Mo 30.11.2026</text><text x="500" y="310" font-size="10.5" fill="#656d76">gerechnet, nur zum Lesen; ohne Datum leer</text><text x="410" y="345" font-size="12" fill="#1f2328">Vor Ort</text><rect x="500" y="326" width="228" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="510" y="345" font-size="11.5" fill="#1f2328">zu Fuß und Bus</text><text x="410" y="393" font-size="12" fill="#1f2328">Übernachtung</text><text x="728" y="393" text-anchor="end" font-size="11.5" fill="#656d76">Hotel Beispiel</text><text x="410" y="414" font-size="10.5" fill="#656d76">Unterkunft suchen oder „noch nichts gebucht“ (15 km Umkreis).</text><text x="410" y="428" font-size="10.5" fill="#656d76">Liegt davor und danach ein Schiff (Kreuzfahrt), steht hier</text><text x="410" y="442" font-size="10.5" fill="#656d76">„an Bord“; jeder Hafen ist ein eigener Aufenthalt.</text><text x="410" y="478" font-size="10.5" fill="#656d76">Die Weiterreise dorthin entsteht mit, Zeiten offen.</text></g><g><text x="392" y="530" font-size="13" font-weight="600" fill="#1f2328">Was einen Spot anpinnt</text><g><circle cx="400" cy="548" r="6" fill="#2f6fd6" stroke="#2f6fd6" stroke-width="1.5"></circle><line x1="400" y1="554" x2="400" y2="560" stroke="#2f6fd6" stroke-width="1.5"></line></g><text x="414" y="552" font-size="11.5" fill="#1f2328">gepinnt: feste Zeit, die App verschiebt ihn nicht</text><text x="414" y="574" font-size="11.5" fill="#1f2328">Ticket oder Zeitfenster (Eintritt, Führung)</text><text x="414" y="594" font-size="11.5" fill="#1f2328">Fotostopp wegen des Lichts (Sonnenuntergang)</text><text x="414" y="614" font-size="11.5" fill="#1f2328">Reservierung (Tisch, Tour, Bootsausflug)</text><text x="414" y="634" font-size="11.5" fill="#1f2328">Ereignis zu fester Zeit (Konzert, Markt, Fest)</text><text x="414" y="654" font-size="11.5" fill="#1f2328">feste Abfahrt (Fähre, Seilbahn, letzte Rückfahrt)</text><text x="414" y="676" font-size="11.5" fill="#656d76">nur an einem Tag offen: an den Tag, nicht an die Uhrzeit</text><g><circle cx="400" cy="702" r="6" fill="none" stroke="#8c959f" stroke-width="1.5"></circle><line x1="400" y1="708" x2="400" y2="714" stroke="#8c959f" stroke-width="1.5"></line></g><text x="414" y="706" font-size="11.5" fill="#1f2328">nicht gepinnt: die App schlägt Reihenfolge vor</text></g><g><rect x="16" y="800" width="360" height="530" rx="24" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="36" y="832" font-size="12" fill="#2f6fd6">‹ Reise</text><text x="356" y="832" text-anchor="end" font-size="12" fill="#2f6fd6">Bearbeiten</text><text x="36" y="858" font-size="15" font-weight="600" fill="#1f2328">Inselhafen</text><text x="36" y="876" font-size="11.5" fill="#656d76">4 Tage · Fr 27.11. bis Mo 30.11. · Hotel Beispiel</text><rect x="32" y="888" width="328" height="30" rx="8" fill="#2f6fd6" fill-opacity="0.1" stroke="#2f6fd6"></rect><g><circle cx="50" cy="903" r="9" fill="none" stroke="#8c959f" stroke-width="1.25"></circle><path d="M46 903H54M50 899V907" stroke="#8c959f" stroke-width="1.25"></path></g><text x="66" y="907" font-size="12" font-weight="600" fill="#2f6fd6">Ideen (6) und Suche</text><text x="32" y="944" font-size="12" font-weight="600" fill="#1f2328">Tag 1 · Fr 27.11. · an 12:30</text><text x="360" y="944" text-anchor="end" font-size="11" fill="#656d76">2 h 30 von 5 h</text><rect x="32" y="952" width="328" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><g><circle cx="46" cy="970" r="6" fill="none" stroke="#8c959f" stroke-width="1.5"></circle><line x1="46" y1="976" x2="46" y2="982" stroke="#8c959f" stroke-width="1.5"></line></g><text x="60" y="970" font-size="12" font-weight="600" fill="#1f2328">Kathedrale</text><text x="60" y="986" font-size="11" fill="#656d76">gotisch, am Hafen · 60 min</text><text x="60" y="1001" font-size="11" fill="#1f2328">ca. 13:45 · Muss</text><g><rect x="250" y="962" width="34" height="34" rx="4" fill="#f3f4f6" stroke="#d0d7de"></rect><path d="M254 990L263 979L270 986L275 981L280 990Z" fill="#d0d7de"></path></g><g><rect x="290" y="962" width="34" height="34" rx="4" fill="#f3f4f6" stroke="#d0d7de"></rect><path d="M294 990L303 979L310 986L315 981L320 990Z" fill="#d0d7de"></path></g><text x="348" y="983" text-anchor="end" font-size="13" fill="#656d76">⋯</text><rect x="32" y="1014" width="328" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><g><circle cx="46" cy="1032" r="6" fill="#2f6fd6" stroke="#2f6fd6" stroke-width="1.5"></circle><line x1="46" y1="1038" x2="46" y2="1044" stroke="#2f6fd6" stroke-width="1.5"></line></g><text x="60" y="1032" font-size="12" font-weight="600" fill="#1f2328">Beispielmuseum</text><text x="60" y="1048" font-size="11" fill="#656d76">Moderne Kunst · 90 min</text><text x="60" y="1063" font-size="11" fill="#1f2328">Ticket: Fr 27.11. 15:30 · gepinnt</text><g><rect x="250" y="1024" width="34" height="34" rx="4" fill="#f3f4f6" stroke="#d0d7de"></rect><path d="M254 1052L263 1041L270 1048L275 1043L280 1052Z" fill="#d0d7de"></path></g><g><rect x="290" y="1024" width="34" height="34" rx="4" fill="#f3f4f6" stroke="#d0d7de"></rect><path d="M294 1052L303 1041L310 1048L315 1043L320 1052Z" fill="#d0d7de"></path></g><text x="348" y="1045" text-anchor="end" font-size="13" fill="#656d76">⋯</text><text x="32" y="1100" font-size="12" font-weight="600" fill="#1f2328">Tag 2 · Sa 28.11.</text><text x="360" y="1100" text-anchor="end" font-size="11" fill="#656d76">9 h von 10 h</text><rect x="32" y="1108" width="328" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><g><circle cx="46" cy="1126" r="6" fill="#2f6fd6" stroke="#2f6fd6" stroke-width="1.5"></circle><line x1="46" y1="1132" x2="46" y2="1138" stroke="#2f6fd6" stroke-width="1.5"></line></g><text x="60" y="1126" font-size="12" font-weight="600" fill="#1f2328">Aussicht am Hafen</text><text x="60" y="1142" font-size="11" fill="#656d76">Fotostopp · 30 min</text><text x="60" y="1157" font-size="11" fill="#1f2328">Licht 17:20 · gepinnt</text><g><rect x="250" y="1118" width="34" height="34" rx="4" fill="#f3f4f6" stroke="#d0d7de"></rect><path d="M254 1146L263 1135L270 1142L275 1137L280 1146Z" fill="#d0d7de"></path></g><g><rect x="290" y="1118" width="34" height="34" rx="4" fill="#f3f4f6" stroke="#d0d7de"></rect><path d="M294 1146L303 1135L310 1142L315 1137L320 1146Z" fill="#d0d7de"></path></g><text x="348" y="1139" text-anchor="end" font-size="13" fill="#656d76">⋯</text><text x="32" y="1184" font-size="11" fill="#656d76">und 3 weitere Spots</text><text x="32" y="1218" font-size="12" font-weight="600" fill="#1f2328">Tag 3 · So 29.11.</text><text x="360" y="1218" text-anchor="end" font-size="11" fill="#656d76">noch frei</text><rect x="32" y="1226" width="328" height="32" rx="8" fill="none" stroke="#8c959f" stroke-dasharray="4 3"></rect><text x="196" y="1246" text-anchor="middle" font-size="11" fill="#656d76">Spot hierher ziehen oder aus den Ideen hinzufügen</text><text x="32" y="1290" font-size="12" font-weight="600" fill="#1f2328">Tag 4 · Mo 30.11. · ab 10:00</text><text x="360" y="1290" text-anchor="end" font-size="11" fill="#656d76">1 Spot bis zur Fähre</text></g><g><text x="392" y="832" font-size="13" font-weight="600" fill="#1f2328">Den Aufenthalt planen</text><text x="392" y="858" font-size="11.5" fill="#1f2328">Alle Tage des Aufenthalts auf einem Bildschirm.</text><text x="392" y="882" font-size="11.5" fill="#1f2328">Plus öffnet die Ideen und die eingebaute Suche;</text><text x="392" y="898" font-size="11.5" fill="#1f2328">„Hinzufügen“ legt den Spot in einen Tag.</text><text x="392" y="922" font-size="11.5" fill="#1f2328">Ziehen ändert die Reihenfolge, auch in einen anderen Tag.</text><text x="392" y="946" font-size="11.5" fill="#1f2328">Antippen öffnet die Details, ⋯ die Aktionen.</text><text x="392" y="970" font-size="11.5" fill="#1f2328">Die Karte zeigt Bild, Dauer, Priorität und geschätzte Zeit;</text><text x="392" y="986" font-size="11.5" fill="#1f2328">ein gepinnter Spot seine feste Zeit und den Grund dafür.</text><text x="392" y="1010" font-size="11.5" fill="#1f2328">Ankunft und Abfahrt kürzen den ersten und letzten Tag.</text><text x="392" y="1034" font-size="11.5" fill="#1f2328">Die Summe je Tag (verplant von verfügbar) zeigt dasselbe</text><text x="392" y="1050" font-size="11.5" fill="#1f2328">wie die Füllmarke im Reiseverlauf.</text></g><text x="16" y="1346" font-size="11.5" fill="#656d76">Graue Daten sind gerechnet; eingegeben werden nur das Von des ersten Aufenthalts (oder der Anreise), die Tage und die Fahrzeiten.</text></svg>
