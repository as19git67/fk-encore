2f6fd6" fill-opacity="0.12" stroke="#2f6fd6" stroke-width="1.25"></rect><text x="322" y="553" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2f6fd6">+ Tag 3</text><line x1="90" y1="584" x2="360" y2="584" stroke="#d0d7de"></line><g><rect x="32" y="592" width="48" height="48" rx="6" fill="#f3f4f6" stroke="#d0d7de"></rect><path d="M37.76 631.36L50.24 616L59.839999999999996 625.6L66.56 618.88L74.24000000000001 631.36Z" fill="#d0d7de"></path></g><text x="90" y="608" font-size="12" font-weight="600" fill="#1f2328">Aussicht am Hafen</text><text x="90" y="624" font-size="11" fill="#656d76">Aussicht · 1,4 km · bekannt</text><text x="90" y="638" font-size="11" fill="#656d76">schön bei Sonnenuntergang</text><text x="356" y="614" text-anchor="end" font-size="11.5" fill="#656d76">✓ Tag 2</text><rect x="126" y="690" width="140" height="30" rx="15" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><line x1="196" y1="690" x2="196" y2="720" stroke="#8c959f"></line><text x="161" y="710" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">Liste</text><text x="231" y="710" text-anchor="middle" font-size="11.5" fill="#656d76">Karte</text></g><g><rect x="392" y="48" width="352" height="700" rx="24" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="410" y="84" font-size="15" font-weight="600" fill="#656d76">Inselhafen</text><text x="410" y="112" font-size="12" font-weight="600" fill="#656d76">Tag 1 · Fr 27.11.</text><rect x="408" y="122" width="320" height="48" rx="8" fill="none" stroke="#d0d7de"></rect><text x="420" y="150" font-size="12" fill="#656d76">Kathedrale</text><rect x="408" y="178" width="320" height="48" rx="8" fill="#2f6fd6" fill-opacity="0.1" stroke="#2f6fd6" stroke-width="2"></rect><text x="420" y="206" font-size="12" font-weight="600" fill="#1f2328">Beispielmuseum</text><text x="716" y="206" text-anchor="end" font-size="11" fill="#2f6fd6">angetippt</text><rect x="408" y="234" width="320" height="48" rx="8" fill="none" stroke="#d0d7de"></rect><text x="420" y="262" font-size="12" fill="#656d76">Pause · Kaffee</text><rect x="393" y="296" width="350" height="451" rx="20" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"></rect><rect x="550" y="306" width="36" height="5" rx="2.5" fill="#8c959f"></rect><circle cx="718" cy="330" r="12" fill="#d0d7de"></circle><text x="718" y="334" text-anchor="middle" font-size="12" fill="#1f2328">✕</text><g><rect x="410" y="322" width="96" height="96" rx="6" fill="#f3f4f6" stroke="#d0d7de"></rect><path d="M421.52 400.72L446.48 370L465.68 389.2L479.12 375.76L494.48 400.72Z" fill="#d0d7de"></path></g><text x="518" y="344" font-size="14" font-weight="600" fill="#1f2328">Beispielmuseum</text><text x="518" y="362" font-size="11" fill="#656d76">Museum · Moderne Kunst</text><text x="518" y="378" font-size="11" fill="#656d76">1,2 km vom Hotel · 1 von 5 Bildern</text><rect x="518" y="388" width="108" height="22" rx="11" fill="#2f6fd6" fill-opacity="0.15" stroke="#2f6fd6"></rect><g><circle cx="530" cy="395" r="5" fill="#2f6fd6"></circle><line x1="530" y1="400" x2="530" y2="405" stroke="#2f6fd6" stroke-width="1.5"></line></g><text x="542" y="403" font-size="11" fill="#2f6fd6">gepinnt 15:30</text><rect x="632" y="388" width="44" height="22" rx="11" fill="none" stroke="#8c959f"></rect><text x="654" y="403" text-anchor="middle" font-size="11" fill="#1f2328">Muss</text><text x="410" y="446" font-size="11.5" fill="#656d76">Ticket</text><text x="500" y="446" font-size="11.5" fill="#1f2328">Fr 27.11. 15:30 · Beleg ansehen</text><text x="410" y="468" font-size="11.5" fill="#656d76">Geöffnet</text><text x="500" y="468" font-size="11.5" fill="#1f2328">heute 10–19 Uhr</text><text x="410" y="490" font-size="11.5" fill="#656d76">Geplant</text><text x="500" y="490" font-size="11.5" fill="#1f2328">Tag 1 · ca. 15:30 bis 17:00 · 90 min</text><text x="410" y="512" font-size="11.5" fill="#656d76">Notiz</text><text x="500" y="512" font-size="11.5" fill="#1f2328">Dachterrasse nicht verpassen</text><text x="410" y="544" font-size="11.5" fill="#1f2328">Sammlung moderner Kunst in einem alten Speicher</text><text x="410" y="560" font-size="11.5" fill="#1f2328">direkt an der Stadtmauer, mit Blick über die Bucht …</text><text x="410" y="576" font-size="10.5" fill="#656d76">aus Wikivoyage</text><rect x="410" y="596" width="72" height="40" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="446" y="621" text-anchor="middle" font-size="11" fill="#1f2328">Route</text><rect x="490" y="596" width="72" height="40" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="526" y="621" text-anchor="middle" font-size="11" fill="#1f2328">Karte</text><rect x="570" y="596" width="72" height="40" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="606" y="621" text-anchor="middle" font-size="11" fill="#1f2328">Anderer Tag</text><rect x="650" y="596" width="72" height="40" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="686" y="621" text-anchor="middle" font-size="11" fill="#1f2328">⋯ Mehr</text><text x="568" y="672" text-anchor="middle" font-size="11" fill="#656d76">⌃ nach oben ziehen: alle Bilder, Zeiten, Website</text><text x="568" y="692" text-anchor="middle" font-size="11" fill="#656d76">nach unten wischen oder oben tippen: zu</text><text x="568" y="712" text-anchor="middle" font-size="11" fill="#656d76">‹ › seitlich wischen: nächster Spot des Tags</text></g><g><rect x="16" y="780" width="360" height="700" rx="24" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><rect x="178" y="790" width="36" height="5" rx="2.5" fill="#8c959f"></rect><text x="360" y="820" text-anchor="end" font-size="12" font-weight="600" fill="#2f6fd6">Fertig</text><rect x="32" y="832" width="328" height="150" rx="10" fill="#f3f4f6" stroke="#d0d7de"></rect><path d="M60 960L130 890L180 935L215 905L330 960Z" fill="#d0d7de"></path><text x="196" y="974" text-anchor="middle" font-size="10.5" fill="#656d76">● ○ ○ ○ ○  wischen für weitere Bilder</text><text x="32" y="1008" font-size="15" font-weight="600" fill="#1f2328">Beispielmuseum</text><text x="32" y="1026" font-size="11" fill="#656d76">Museum · Moderne Kunst · 1,2 km vom Hotel</text><rect x="32" y="1036" width="108" height="22" rx="11" fill="#2f6fd6" fill-opacity="0.15" stroke="#2f6fd6"></rect><g><circle cx="44" cy="1043" r="5" fill="#2f6fd6"></circle><line x1="44" y1="1048" x2="44" y2="1053" stroke="#2f6fd6" stroke-width="1.5"></line></g><text x="56" y="1051" font-size="11" fill="#2f6fd6">gepinnt 15:30</text><rect x="146" y="1036" width="44" height="22" rx="11" fill="none" stroke="#8c959f"></rect><text x="168" y="1051" text-anchor="middle" font-size="11" fill="#1f2328">Muss</text><rect x="196" y="1036" width="56" height="22" rx="11" fill="none" stroke="#8c959f"></rect><text x="224" y="1051" text-anchor="middle" font-size="11" fill="#1f2328">90 min</text><text x="32" y="1086" font-size="12" font-weight="600" fill="#1f2328">Beschreibung</text><text x="32" y="1104" font-size="11.5" fill="#1f2328">Sammlung moderner Kunst in einem alten Speicher</text><text x="32" y="1120" font-size="11.5" fill="#1f2328">direkt an der Stadtmauer, mit Blick über die Bucht.</text><text x="32" y="1136" font-size="11.5" fill="#1f2328">Die Dachterrasse ist frei zugänglich.</text><text x="32" y="1152" font-size="10.5" fill="#656d76">aus Wikivoyage · Seite öffnen</text><text x="32" y="1182" font-size="12" font-weight="600" fill="#1f2328">Öffnungszeiten</text><text x="32" y="1200" font-size="11.5" fill="#1f2328">Di–Sa 10–19 · So 10–15 · Mo geschlossen</text><text x="32" y="1216" font-size="11" fill="#656d76">Tag 4 (Mo 30.11.) geschlossen</text><text x="32" y="1246" font-size="12" font-weight="600" fill="#1f2328">Ticket</text><text x="32" y="1264" font-size="11.5" fill="#1f2328">Fr 27.11. 15:30 · 2 Personen · Beleg ansehen</text><text x="32" y="1294" font-size="12" font-weight="600" fill="#1f2328">Notiz und Kontakt</text><text x="32" y="1312" font-size="11.5" fill="#1f2328">Dachterrasse nicht verpassen</text><text x="32" y="1328" font-size="11.5" fill="#2f6fd6">Website · Anrufen · Quelle der Idee</text><line x1="16" y1="1404" x2="376" y2="1404" stroke="#8c959f"></line><rect x="32" y="1418" width="72" height="40" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="68" y="1443" text-anchor="middle" font-size="11" fill="#1f2328">Route</text><rect x="112" y="1418" width="72" height="40" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="148" y="1443" text-anchor="middle" font-size="11" fill="#1f2328">Karte</text><rect x="192" y="1418" width="72" height="40" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="228" y="1443" text-anchor="middle" font-size="11" fill="#1f2328">Anderer Tag</text><rect x="272" y="1418" width="72" height="40" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="308" y="1443" text-anchor="middle" font-size="11" fill="#1f2328">⋯ Mehr</text></g><g><text x="392" y="800" font-size="13" font-weight="600" fill="#1f2328">Details öffnen und schließen</text><text x="392" y="826" font-size="11.5" fill="#1f2328">Tippen auf eine Spot-Karte oder eine Zeile der Auswahl</text><text x="392" y="842" font-size="11.5" fill="#1f2328">öffnet ein Blatt von unten auf halber Höhe (oben rechts).</text><text x="392" y="858" font-size="11.5" fill="#1f2328">Der Tag bleibt darüber sichtbar, die Karte ist markiert.</text><text x="392" y="882" font-size="11.5" fill="#1f2328">Nach oben ziehen: volle Höhe (links) mit allen Bildern,</text><text x="392" y="898" font-size="11.5" fill="#1f2328">Beschreibung, Woche, Ticket, Notiz und Quelle.</text><text x="392" y="922" font-size="11.5" fill="#1f2328">Zu: nach unten wischen, auf den Tag darüber tippen,</text><text x="392" y="938" font-size="11.5" fill="#1f2328">✕ oder „Fertig“. Kein Zurück-Knopf, kein Seitenwechsel.</text><text x="392" y="962" font-size="11.5" fill="#1f2328">Seitlich wischen blättert zum nächsten Spot des Tags.</text><text x="392" y="986" font-size="11.5" fill="#1f2328">⋯ an der Karte führt direkt zu den Aktionen, ohne Details;</text><text x="392" y="1002" font-size="11.5" fill="#1f2328">lang drücken hebt die Karte zum Ziehen an.</text><text x="392" y="1046" font-size="13" font-weight="600" fill="#1f2328">Spots auswählen (oben links)</text><text x="392" y="1072" font-size="11.5" fill="#1f2328">Das Plus im Aufenthalt öffnet ein großes Blatt.</text><text x="392" y="1096" font-size="11.5" fill="#1f2328">Ein Suchfeld für Namen, Kategorien und eingefügte</text><text x="392" y="1112" font-size="11.5" fill="#1f2328">Karten-Links; Chips filtern: Ideen, Highlights, Essen, mehr.</text><text x="392" y="1136" font-size="11.5" fill="#1f2328">Ohne Suchwort: zuerst eure Ideen, dann die Highlights</text><text x="392" y="1152" font-size="11.5" fill="#1f2328">nach Bekanntheit, beides mit Bild, Dauer und Hinweisen.</text><text x="392" y="1176" font-size="11.5" fill="#1f2328">„+ Tag 3“ legt den Spot in den vorgeschlagenen Tag</text><text x="392" y="1192" font-size="11.5" fill="#1f2328">(erster mit Platz, an dem er offen ist); lang drücken</text><text x="392" y="1208" font-size="11.5" fill="#1f2328">wählt einen anderen Tag oder „Nur merken“ (Idee).</text><text x="392" y="1232" font-size="11.5" fill="#1f2328">„✓ Tag 1“ zeigt, was schon eingeplant ist.</text><text x="392" y="1256" font-size="11.5" fill="#1f2328">Das Blatt bleibt offen, bis „Fertig“: mehrere Spots</text><text x="392" y="1272" font-size="11.5" fill="#1f2328">hintereinander; der Tag dahinter füllt sich mit.</text><text x="392" y="1296" font-size="11.5" fill="#1f2328">Tippen auf eine Zeile öffnet dieselben Details.</text></g></svg>
