<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1500" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 1500" role="img" aria-label="Spots kommen aus einem Blatt mit Ideen und Suche; Details öffnen sich als Blatt von unten und schließen mit einem Wisch" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="16" y="28" font-size="15" font-weight="600" fill="#1f2328">Spots auswählen und ansehen: beides als Blatt von unten, zu mit einem Wisch</text><g><rect x="16" y="48" width="360" height="700" rx="24" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><rect x="17" y="49" width="358" height="40" rx="23" fill="#d0d7de" fill-opacity="0.5"></rect><text x="36" y="74" font-size="12" fill="#656d76">Inselhafen</text><line x1="16" y1="92" x2="376" y2="92" stroke="#8c959f"></line><rect x="178" y="100" width="36" height="5" rx="2.5" fill="#8c959f"></rect><text x="196" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Spots für Inselhafen</text><text x="360" y="130" text-anchor="end" font-size="12" font-weight="600" fill="#2f6fd6">Fertig</text><rect x="32" y="144" width="328" height="32" rx="8" fill="#f3f4f6" stroke="#d0d7de"></rect><text x="44" y="165" font-size="11.5" fill="#656d76">⌕  Name, Kategorie oder Karten-Link</text><rect x="32" y="186" width="46" height="24" rx="12" fill="#2f6fd6" fill-opacity="0.15" stroke="#2f6fd6" stroke-width="1.25"></rect><text x="55" y="202" text-anchor="middle" font-size="11" fill="#2f6fd6">Alle</text><rect x="84" y="186" width="66" height="24" rx="12" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="117" y="202" text-anchor="middle" font-size="11" fill="#1f2328">Ideen 6</text><rect x="156" y="186" width="82" height="24" rx="12" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="197" y="202" text-anchor="middle" font-size="11" fill="#1f2328">Highlights</text><rect x="244" y="186" width="52" height="24" rx="12" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="270" y="202" text-anchor="middle" font-size="11" fill="#1f2328">Essen</text><rect x="302" y="186" width="58" height="24" rx="12" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="331" y="202" text-anchor="middle" font-size="11" fill="#1f2328">Mehr ▾</text><text x="32" y="236" font-size="10.5" font-weight="600" fill="#656d76">EURE IDEEN · 4 VON 6 NOCH OHNE TAG</text><g><rect x="32" y="246" width="48" height="48" rx="6" fill="#f3f4f6" stroke="#d0d7de"></rect><path d="M37.76 285.36L50.24 270L59.839999999999996 279.6L66.56 272.88L74.24000000000001 285.36Z" fill="#d0d7de"></path></g><text x="90" y="262" font-size="12" font-weight="600" fill="#1f2328">Kathedrale</text><text x="90" y="278" font-size="11" fill="#656d76">Kirche · 60 min · Muss</text><text x="90" y="292" font-size="11" fill="#656d76">Di–So 10–18</text><text x="356" y="268" text-anchor="end" font-size="11.5" fill="#656d76">✓ Tag 1</text><line x1="90" y1="302" x2="360" y2="302" stroke="#d0d7de"></line><g><rect x="32" y="310" width="48" height="48" rx="6" fill="#f3f4f6" stroke="#d0d7de"></rect><path d="M37.76 349.36L50.24 334L59.839999999999996 343.6L66.56 336.88L74.24000000000001 349.36Z" fill="#d0d7de"></path></g><text x="90" y="326" font-size="12" font-weight="600" fill="#1f2328">Altstadtgassen</text><text x="90" y="342" font-size="11" fill="#656d76">Spaziergang · 90 min · Will</text><text x="90" y="356" font-size="11" fill="#656d76">aus einem geteilten Link</text><rect x="286" y="318" width="72" height="26" rx="13" fill="#2f6fd6" fill-opacity="0.12" stroke="#2f6fd6" stroke-width="1.25"></rect><text x="322" y="335" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2f6fd6">+ Tag 3</text><line x1="90" y1="366" x2="360" y2="366" stroke="#d0d7de"></line><g><rect x="32" y="374" width="48" height="48" rx="6" fill="#f3f4f6" stroke="#d0d7de"></rect><path d="M37.76 413.36