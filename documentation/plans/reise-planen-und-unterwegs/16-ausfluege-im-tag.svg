40 min Fahrt</text><rect x="44" y="296" width="304" height="48" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="58" y="316" font-size="12.5" font-weight="600" fill="#1f2328">Dom</text><text x="58" y="333" font-size="11" fill="#656d76">10:40 · 1 h · Will</text><text x="334" y="324" font-size="14" text-anchor="end" fill="#656d76">⋯</text><text x="58" y="360" font-size="10.5" fill="#656d76">↓  8 min zu Fuß</text><rect x="44" y="368" width="304" height="48" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="58" y="388" font-size="12.5" font-weight="600" fill="#1f2328">Uferpromenade</text><text x="58" y="405" font-size="11" fill="#656d76">11:50 · 45 min · Wenn Zeit</text><text x="334" y="396" font-size="14" text-anchor="end" fill="#656d76">⋯</text><text x="46" y="440" font-size="12" font-weight="600" fill="#2f6fd6">+ Spot in Seestadt</text><text x="346" y="440" font-size="11" text-anchor="end" fill="#2f6fd6">Weg zeigen</text><text x="46" y="457" font-size="10.5" fill="#656d76">sucht um Seestadt, legt in dieses Fenster</text><text x="46" y="484" font-size="10.5" fill="#656d76">↓  zurück in Bergdorf 13:40</text><rect x="32" y="492" width="328" height="48" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="46" y="512" font-size="12.5" font-weight="600" fill="#1f2328">Trattoria am Platz</text><text x="46" y="529" font-size="11" fill="#656d76">13:45 · 1 h · Essen</text><text x="346" y="520" font-size="14" text-anchor="end" fill="#656d76">⋯</text><rect x="32" y="554" width="328" height="156" rx="14" fill="#2f6fd6" fill-opacity="0.08" stroke="#2f6fd6" stroke-width="1.25"/><text x="46" y="578" font-size="12.5" font-weight="600" fill="#1f2328">🚗  Ausflug nach Hafenstadt</text><text x="346" y="578" font-size="14" text-anchor="end" fill="#2f6fd6">⋯</text><text x="46" y="596" font-size="11" fill="#656d76">Abfahrt 15:00 · zurück 18:00 · je 50 min Fahrt</text><rect x="44" y="608" width="304" height="48" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="58" y="628" font-size="12.5" font-weight="600" fill="#1f2328">Leuchtturm</text><text x="58" y="645" font-size="11" fill="#656d76">15:50 · 1 h 30 · Muss · Licht 17:30</text><text x="334" y="636" font-size="14" text-anchor="end" fill="#656d76">⋯</text><text x="46" y="682" font-size="12" font-weight="600" fill="#2f6fd6">+ Spot in Hafenstadt</text><text x="346" y="682" font-size="11" text-anchor="end" fill="#2f6fd6">Weg zeigen</text><text x="46" y="699" font-size="10.5" fill="#656d76">noch 1 h 20 frei im Fenster</text><text x="46" y="726" font-size="10.5" fill="#656d76">↓  zurück in Bergdorf 18:50</text><rect x="32" y="736" width="328" height="40" rx="12" fill="none" stroke="#8c959f" stroke-width="1"/><text x="196" y="761" font-size="12" font-weight="600" text-anchor="middle" fill="#2f6fd6">+ Spot in Bergdorf</text><text x="32" y="800" font-size="10.5" fill="#656d76">Vor, zwischen und nach den Ausflügen plant</text><text x="32" y="814" font-size="10.5" fill="#656d76">der Tag um die Unterkunft. Jeder Spot gehört</text><text x="32" y="828" font-size="10.5" fill="#656d76">zu dem Abschnitt, in dem er steht; Ziehen</text><text x="32" y="842" font-size="10.5" fill="#656d76">zwischen Abschnitten geht wie zwischen Tagen.</text><rect x="392" y="48" width="360" height="900" rx="24" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="412" y="74" font-size="12" fill="#656d76">9:41</text><line x1="392" y1="92" x2="752" y2="92" stroke="#8c959f"/><text x="408" y="118" font-size="18" fill="#2f6fd6">‹</text><text x="572" y="118" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Tag 3</text><text x="392" y="970" font-size="12" fill="#656d76">B · ⋯ am Tag › „Ausflug hinzufügen“</text><rect x="393" y="140" width="358" height="807" rx="20" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/><rect x="552" y="148" width="40" height="4" rx="2" fill="#d0d7de" stroke="none" stroke-width="1"/><text x="408" y="178" font-size="12" fill="#2f6fd6">Abbrechen</text><text x="572" y="178" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Ausflug</text><text x="736" y="178" font-size="12" font-weight="600" text-anchor="end" fill="#2f6fd6">Sichern</text><text x="408" y="210" font-size="10.5" font-weight="600" fill="#656d76">TAG 3 · DO 9. SEPT.</text><rect x="408" y="218" width="328" height="40" rx="10" fill="#f3f4f6" stroke="none" stroke-width="1"/><text x="422" y="243" font-size="12.5" fill="#1f2328">📍  Seestadt</text><text x="722" y="243" font-size="11" text-anchor="end" fill="#2f6fd6">Ändern</text><text x="408" y="282" font-size="10.5" font-weight="600" fill="#656d76">WIE LANGE</text><rect x="408" y="290" width="328" height="30" rx="8" fill="#f3f4f6" stroke="none" stroke-width="1"/><rect x="574" y="293" width="159" height="24" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="490" y="310" font-size="11.5" text-anchor="middle" fill="#656d76">Ganzer Tag</text><text x="654" y="310" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f2328">Zeitfenster</text><rect x="408" y="330" width="328" height="132" rx="10" fill="#f3f4f6" stroke="none" stroke-width="1"/><text x="422" y="354" font-size="12" fill="#1f2328">Abfahrt an der Unterkunft</text><rect x="662" y="340" width="62" height="22" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="693" y="355" font-size="12" text-anchor="middle" fill="#1f2328">10:00</text><line x1="422" y1="368" x2="722" y2="368" stroke="#d0d7de"/><text x="422" y="388" font-size="12" fill="#656d76">Ankunft in Seestadt</text><text x="722" y="388" font-size="12" text-anchor="end" fill="#656d76">ca. 10:40</text><line x1="422" y1="402" x2="722" y2="402" stroke="#d0d7de"/><text x="422" y="422" font-size="12" fill="#1f2328">Rückfahrt um</text><rect x="662" y="408" width="62" height="22" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="693" y="423" font-size="12" text-anchor="middle" fill="#1f2328">13:00</text><line x1="422" y1="436" x2="722" y2="436" stroke="#d0d7de"/><text x="422" y="455" font-size="12" fill="#656d76">Zurück in Bergdorf</text><text x="722" y="455" font-size="12" text-anchor="end" fill="#656d76">ca. 13:40</text><text x="408" y="482" font-size="10.5" fill="#656d76">Davor und danach plant der Tag in Bergdorf.</text><text x="408" y="496" font-size="10.5" fill="#656d76">Mehrere Ausflüge an einem Tag gehen, solange</text><text x="408" y="510" font-size="10.5" fill="#656d76">sie sich nicht überschneiden.</text><text x="408" y="540" font-size="10.5" font-weight="600" fill="#656d76">WIE WEIT</text><rect x="408" y="548" width="328" height="30" rx="8" fill="#f3f4f6" stroke="none" stroke-width="1"/><rect x="411" y="551" width="106" height="24" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="464" y="568" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f2328">Ortskern</text><text x="572" y="568" font-size="11.5" text-anchor="middle" fill="#656d76">Ort</text><text x="682" y="568" font-size="11.5" text-anchor="middle" fill="#656d76">Gegend</text><text x="408" y="596" font-size="10.5" fill="#656d76">Gesucht wird zu Fuß um den Ortskern.</text><rect x="408" y="618" width="328" height="40" rx="10" fill="#f3f4f6" stroke="none" stroke-width="1"/><text x="422" y="643" font-size="12.5" fill="#cf222e">Ausflug entfernen</text><text x="408" y="678" font-size="10.5" fill="#656d76">Seine Spots gehen zurück zu den Ideen.</text><text x="408" y="716" font-size="10.5" fill="#656d76">Ganzer Tag: der ganze Tag findet in Seestadt</text><text x="408" y="730" font-size="10.5" fill="#656d76">statt, wie bisher. Abfahrt und Rückfahrt sind</text><text x="408" y="744" font-size="10.5" fill="#656d76">dann freiwillig; ein Tag mit Zeitfenstern kann</text><text x="408" y="758" font-size="10.5" fill="#656d76">keinen ganzen Ausflug mehr dazu nehmen.</text><text x="408" y="796" font-size="10.5" fill="#656d76">Im ⋯ eines Ausflugs: Zeiten ändern, Weg zeigen,</text><text x="408" y="810" font-size="10.5" fill="#656d76">Ausflug entfernen.</text></svg>