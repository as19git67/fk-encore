<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1080" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 1080" role="img" aria-label="Das Blatt eines Aufenthalts trägt Von und Bis mit festem Beginn; das Blatt einer Weiterreise füllt die Zeit dazwischen" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/>
<rect x="16" y="48" width="360" height="880" rx="24" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="34" y="82" font-size="12" fill="#2f6fd6">Abbrechen</text><text x="196.0" y="82" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Aufenthalt</text><text x="360" y="82" font-size="12" font-weight="600" text-anchor="end" fill="#2f6fd6">Sichern</text><text x="34" y="108" font-size="10.5" font-weight="600" fill="#656d76">NAME</text><rect x="32" y="116" width="328" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="42" y="135" font-size="11.5" fill="#1f2328">Hafenstadt</text><text x="34" y="162" font-size="10.5" font-weight="600" fill="#656d76">WO?</text><rect x="32" y="170" width="328" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="42" y="189" font-size="11.5" fill="#1f2328">Hafenstadt, Kreuzfahrthafen</text><text x="352" y="189" font-size="11.5" text-anchor="end" fill="#2f6fd6">Ändern</text><text x="34" y="216" font-size="10.5" font-weight="600" fill="#656d76">WANN?</text><text x="34" y="243" font-size="12" fill="#1f2328">Beginn steht fest</text><rect x="318" y="228" width="40" height="22" rx="11" fill="#2fa64a"/><circle cx="347" cy="239" r="9" fill="#ffffff"/><text x="34" y="279" font-size="12" fill="#1f2328">Von</text><rect x="250" y="260" width="110" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="260" y="279" font-size="11.5" fill="#1f2328">Fr 27.11.2026</text><text x="34" y="315" font-size="12" fill="#1f2328">Bis</text><rect x="250" y="296" width="110" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="260" y="315" font-size="11.5" fill="#1f2328">Sa 28.11.2026</text><text x="34" y="351" font-size="12" fill="#1f2328">Ergibt</text><text x="360" y="351" font-size="11.5" text-anchor="end" fill="#656d76">2 Tage · 1 Nacht</text><text x="34" y="374" font-size="10.5" fill="#656d76">Der Aufenthalt bleibt an diesem Tag stehen, was auch immer</text><text x="34" y="388" font-size="10.5" fill="#656d76">sich davor ändert. Die Weiterreise davor nimmt die Nächte.</text><text x="34" y="410" font-size="10.5" font-weight="600" fill="#656d76">ANKUNFT UND ABFAHRT</text><text x="34" y="437" font-size="12" fill="#1f2328">An Land ab</text><text x="34" y="452" font-size="10.5" fill="#656d76">Schiff von Inselhafen</text><rect x="250" y="420" width="110" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="260" y="439" font-size="11.5" fill="#1f2328">08:00</text><text x="34" y="485" font-size="12" fill="#1f2328">An Bord bis</text><text x="34" y="500" font-size="10.5" fill="#656d76">Schiff nach Küstenstadt</text><text x="360" y="485" font-size="11.5" text-anchor="end" fill="#2f6fd6">offen · festlegen</text><text x="265" y="500" font-size="10.5" fill="#656d76">rechnet mit 10:00</text><text x="34" y="524" font-size="10.5" fill="#656d76">Ortszeit. Dieselben Zeiten stehen an der Weiterreise; offen</text><text x="34" y="538" font-size="10.5" fill="#656d76">rechnet der Tag mit der angenommenen Zeit.</text><text x="34" y="566" font-size="12" fill="#1f2328">Vor Ort</text><text x="360" y="566" font-size="11.5" text-anchor="end" fill="#656d76">zu Fuß  ⌄</text><text x="34" y="600" font-size="10.5" font-weight="600" fill="#656d76">ÜBERNACHTUNG</text><text x="34" y="627" font-size="12" fill="#1f2328">Übernachtung</text><text x="360" y="627" font-size="11.5" text-anchor="end" fill="#656d76">an Bord</text><text x="34" y="660" font-size="12" fill="#1f2328">Tenderhafen</text><rect x="318" y="645" width="40" height="22" rx="11" fill="#d0d7de"/><circle cx="329" cy="656" r="9" fill="#f3f4f6"/><text x="34" y="686" font-size="10.5" fill="#656d76">Davor und danach fährt ein Schiff, also wird an Bord</text><text x="34" y="700" font-size="10.5" fill="#656d76">übernachtet. „Alle an Bord“ ist eine Stunde vor der Abfahrt.</text><text x="34" y="722" font-size="10.5" fill="#656d76">Sonst eine Wahl aus drei: Unterkunft steht fest ·</text><text x="34" y="736" font-size="10.5" fill="#656d76">Noch nichts gebucht · An Bord.</text><rect x="32" y="770" width="328" height="36" rx="10" fill="#2f6fd6" fill-opacity="0.12" stroke="#2f6fd6"/><text x="196.0" y="793" font-size="12" font-weight="600" text-anchor="middle" fill="#2f6fd6">Aufenthalt planen</text><text x="196.0" y="846" font-size="12" text-anchor="middle" fill="#cf222e">Aufenthalt entfernen</text><text x="34" y="900" font-size="10.5" fill="#656d76">Aus der Planungsansicht geöffnet fehlen „planen“ und „entfernen“.</text><rect x="392" y="48" width="352" height="880" rx="24" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="410" y="82" font-size="12" fill="#2f6fd6">Abbrechen</text><text x="568.0" y="82" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Weiterreise</text><text x="728" y="82" font-size="12" font-weight="600" text-anchor="end" fill="#2f6fd6">Sichern</text><text x="410" y="112" font-size="10.5" font-weight="600" fill="#656d76">INSELHAFEN → HAFENSTADT</text><rect x="408" y="122" width="60" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="438" y="141" font-size="11" text-anchor="middle" fill="#1f2328">Flug</text><rect x="472" y="122" width="60" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="502" y="141" font-size="11" text-anchor="middle" fill="#1f2328">Bahn</text><rect x="536" y="122" width="60" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="566" y="141" font-size="11" text-anchor="middle" fill="#1f2328">Auto</text><rect x="600" y="122" width="60" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="630" y="141" font-size="11" text-anchor="middle" fill="#1f2328">Bus</text><rect x="664" y="122" width="60" height="28" rx="6" fill="#2f6fd6" fill-opacity="0.15" stroke="#2f6fd6" stroke-width="1.25"/><text x="694" y="141" font-size="11" text-anchor="middle" fill="#2f6fd6">Schiff</text><text x="410" y="195" font-size="12" fill="#1f2328">Abfahrt</text><text x="410" y="210" font-size="10.5" fill="#656d76">Inselhafen</text><rect x="618" y="178" width="110" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="628" y="197" font-size="11.5" fill="#1f2328">18:00</text><text x="410" y="243" font-size="12" fill="#1f2328">Ankunft</text><text x="410" y="258" font-size="10.5" fill="#656d76">Hafenstadt</text><rect x="618" y="226" width="110" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="628" y="245" font-size="11.5" fill="#1f2328">08:00</text><text x="410" y="282" font-size="10.5" fill="#656d76">Ortszeit, am Ort der Abfahrt und am Ort der Ankunft.</text><text x="410" y="310" font-size="12" fill="#1f2328">Nächte unterwegs</text><text x="728" y="310" font-size="11.5" text-anchor="end" fill="#656d76">1</text><text x="410" y="342" font-size="12" fill="#1f2328">Ergibt</text><text x="728" y="342" font-size="11.5" text-anchor="end" fill="#656d76">an Fr 27.11. 08:00</text><text x="410" y="368" font-size="10.5" fill="#656d76">„Hafenstadt“ hat einen festen Beginn; die Nächte</text><text x="410" y="382" font-size="10.5" fill="#656d76">ergeben sich daraus. Ohne festen Beginn: −  n  +</text><text x="410" y="404" font-size="10.5" fill="#656d76">Nachtzug, Fähre, Flug über Nacht oder Seetage.</text><text x="410" y="436" font-size="10.5" font-weight="600" fill="#656d76">NOTIZ</text><rect x="408" y="444" width="320" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="418" y="463" font-size="11.5" fill="#656d76">z. B. Flugnummer, Sitzplatz</text><text x="410" y="500" font-size="12" fill="#2f6fd6">+ Hafen einfügen</text><text x="410" y="522" font-size="10.5" fill="#656d76">Ein Hafen teilt die Fahrt; das Ende der Reise bleibt.</text><text x="568.0" y="580" font-size="12" text-anchor="middle" fill="#cf222e">Angaben zurücksetzen</text><text x="410" y="620" font-size="10.5" fill="#656d76">Kein Schalter „Zeiten noch offen“ mehr: eine leere Zeit</text><text x="410" y="634" font-size="10.5" fill="#656d76">zeigt „offen · festlegen“ und, womit der Tag rechnet.</text><text x="410" y="656" font-size="10.5" fill="#656d76">Die Anreise hat kein eigenes „Von“: ihr Tag folgt aus dem</text><text x="410" y="670" font-size="10.5" fill="#656d76">„Von“ des ersten Aufenthalts und den Nächten unterwegs.</text><text x="16" y="960" font-size="13" font-weight="600" fill="#1f2328">So kommt man hin</text><text x="16" y="984" font-size="11.5" fill="#1f2328">Aufenthalt: Tipp auf seine Karte im Reiseverlauf, oder auf den Kopf der Planungsansicht („›“).</text><text x="16" y="1004" font-size="11.5" fill="#1f2328">Start und Ende der Aufenthalte sind das Gerüst; die Weiterreisen füllen auf. „Beginn steht fest“ hält einen</text><text x="16" y="1024" font-size="11.5" fill="#1f2328">Aufenthalt an seinem Tag (Hotel gebucht, Hafen im Fahrplan); ohne Pin rutscht er mit, wenn sich davor etwas ändert.</text><text x="16" y="1044" font-size="11.5" fill="#1f2328">Weiterreise: Tipp auf ihre Karte im Verlauf. Ankunft und Abfahrt lassen sich auch im Blatt des Aufenthalts ändern.</text><text x="16" y="1064" font-size="11.5" fill="#1f2328">Ein Hafen ist ein Aufenthalt wie eine Stadt, nur mit Übernachtung an Bord; „An Land ab“ und „An Bord bis“.</text><text x="16" y="28" font-size="15" font-weight="600" fill="#1f2328">Aufenthalt (hier ein Hafen mit festem Beginn) und die Weiterreise davor</text>
</svg>
