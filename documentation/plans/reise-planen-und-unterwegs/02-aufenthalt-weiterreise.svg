<svg xmlns="http://www.w3.org/2000/svg" width="760" height="860" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 860" role="img" aria-label="Ein Hafen der Kreuzfahrt ist ein Aufenthalt mit Übernachtung an Bord; eine Weiterreise hat ein eigenes Blatt" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="16" y="28" font-size="15" font-weight="600" fill="#1f2328">Details eines Aufenthalts (hier ein Hafen) und das Blatt einer Weiterreise</text><g><rect x="16" y="48" width="360" height="600" rx="24" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="34" y="82" font-size="12" fill="#2f6fd6">Abbrechen</text><text x="196" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Aufenthalt</text><text x="358" y="82" text-anchor="end" font-size="12" font-weight="600" fill="#2f6fd6">Fertig</text><text x="34" y="121" font-size="12" fill="#1f2328">Name</text><rect x="124" y="102" width="236" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="134" y="121" font-size="11.5" fill="#1f2328">Hafenstadt</text><text x="34" y="161" font-size="12" fill="#1f2328">Wo?</text><rect x="124" y="142" width="236" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="134" y="161" font-size="11.5" fill="#1f2328">Hafenstadt, Kreuzfahrthafen</text><text x="34" y="201" font-size="12" fill="#1f2328">Wie lange?</text><rect x="124" y="182" width="236" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="242" y="201" text-anchor="middle" font-size="11.5" fill="#1f2328">−   2 Tage · 1 Nacht   +</text><text x="34" y="241" font-size="12" fill="#1f2328">Von, Bis</text><rect x="124" y="222" width="236" height="28" rx="6" fill="#f3f4f6" stroke="#d0d7de"></rect><text x="134" y="241" font-size="11.5" fill="#656d76">Fr 27.11. bis Sa 28.11., gerechnet</text><text x="34" y="281" font-size="12" fill="#1f2328">Ankunft</text><rect x="124" y="262" width="236" height="28" rx="6" fill="#f3f4f6" stroke="#d0d7de"></rect><text x="134" y="281" font-size="11.5" fill="#656d76">Fr 27.11. 08:00 · Schiff  ›</text><text x="34" y="321" font-size="12" fill="#1f2328">Abfahrt</text><rect x="124" y="302" width="236" height="28" rx="6" fill="#f3f4f6" stroke="#d0d7de"></rect><text x="134" y="321" font-size="11.5" fill="#656d76">Sa 28.11. 22:00 · Schiff  ›</text><text x="124" y="346" font-size="10.5" fill="#656d76">Zeiten stehen an den Schiffsfahrten; › öffnet sie</text><text x="34" y="381" font-size="12" fill="#1f2328">Übernachtung</text><rect x="124" y="362" width="236" height="28" rx="6" fill="#f3f4f6" stroke="#d0d7de"></rect><text x="134" y="381" font-size="11.5" fill="#656d76">an Bord</text><text x="124" y="406" font-size="10.5" fill="#656d76">weil davor und danach ein Schiff fährt</text><text x="34" y="441" font-size="12" fill="#1f2328">Vor Ort</text><rect x="124" y="422" width="236" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="134" y="441" font-size="11.5" fill="#1f2328">zu Fuß und Bus</text><text x="34" y="480" font-size="10.5" fill="#656d76">An Land statt Übernachtung: Unterkunft suchen oder</text><text x="34" y="494" font-size="10.5" fill="#656d76">„noch nichts gebucht“, dann Stadtzentrum mit 15 km Umkreis.</text><rect x="32" y="540" width="328" height="36" rx="10" fill="#2f6fd6" fill-opacity="0.12" stroke="#2f6fd6"></rect><text x="196" y="563" text-anchor="middle" font-size="12" font-weight="600" fill="#2f6fd6">Aufenthalt planen ›</text><text x="196" y="614" text-anchor="middle" font-size="12" fill="#656d76">Aufenthalt entfernen</text></g><g><rect x="392" y="48" width="352" height="600" rx="24" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="410" y="82" font-size="12" fill="#2f6fd6">Abbrechen</text><text x="568" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Anreise</text><text x="728" y="82" text-anchor="end" font-size="12" font-weight="600" fill="#2f6fd6">Fertig</text><text x="410" y="112" font-size="11.5" fill="#656d76">Zuhause → Inselhafen (Einschiffung)</text><rect x="408" y="126" width="60" height="28" rx="6" fill="#2f6fd6" fill-opacity="0.15" stroke="#2f6fd6" stroke-width="1.25"></rect><text x="438" y="145" text-anchor="middle" font-size="11" fill="#2f6fd6">Flug</text><rect x="472" y="126" width="60" height="28" rx="6" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="502" y="145" text-anchor="middle" font-size="11" fill="#1f2328">Bahn</text><rect x="536" y="126" width="60" height="28" rx="6" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="566" y="145" text-anchor="middle" font-size="11" fill="#1f2328">Auto</text><rect x="600" y="126" width="60" height="28" rx="6" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="630" y="145" text-anchor="middle" font-size="11" fill="#1f2328">Bus</text><rect x="664" y="126" width="64" height="28" rx="6" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="696" y="145" text-anchor="middle" font-size="11" fill="#1f2328">Schiff</text><text x="410" y="189" font-size="12" fill="#1f2328">Ab</text><rect x="500" y="170" width="228" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="510" y="189" font-size="11.5" fill="#1f2328">Zuhause</text><text x="500" y="214" font-size="10.5" fill="#656d76">einmal festgelegt, für jede Reise gemerkt</text><text x="410" y="245" font-size="12" fill="#1f2328">Von</text><rect x="500" y="226" width="228" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="510" y="245" font-size="11.5" fill="#1f2328">Mi 25.11.2026</text><text x="500" y="270" font-size="10.5" fill="#656d76">nur an der Anreise; setzt den Reisebeginn</text><text x="410" y="301" font-size="12" fill="#1f2328">Abfahrt</text><rect x="500" y="282" width="100" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="510" y="301" font-size="11.5" fill="#1f2328">18:40</text><text x="612" y="301" font-size="12" fill="#1f2328">Ankunft</text><rect x="668" y="282" width="60" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="678" y="301" font-size="11.5" fill="#1f2328">21:05</text><text x="500" y="326" font-size="10.5" fill="#656d76">Ortszeit; bei Zeitzonenwechsel „+8 h“</text><text x="410" y="357" font-size="12" fill="#1f2328">Nächte unterwegs</text><rect x="560" y="338" width="168" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="644" y="357" text-anchor="middle" font-size="11.5" fill="#1f2328">−   0   +</text><text x="500" y="382" font-size="10.5" fill="#656d76">Nachtzug, Fähre, Flug über Nacht, Seetage</text><text x="410" y="414" font-size="12" fill="#1f2328">Ergibt</text><rect x="500" y="395" width="228" height="28" rx="6" fill="#f3f4f6" stroke="#d0d7de"></rect><text x="510" y="414" font-size="11.5" fill="#656d76">an Mi 25.11. 21:05</text><text x="410" y="455" font-size="12" fill="#1f2328">Zeiten noch offen</text><g><rect x="688" y="440" width="40" height="22" rx="11" fill="#d0d7de"></rect><circle cx="699" cy="451" r="9" fill="#f3f4f6"></circle></g><text x="410" y="478" font-size="10.5" fill="#656d76">an: Zeiten ausgegraut, der Tag rechnet mit Vorgaben</text><text x="410" y="514" font-size="12" fill="#1f2328">Notiz</text><rect x="500" y="495" width="228" height="28" rx="6" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="510" y="514" font-size="11.5" fill="#656d76">z. B. Flugnummer, Sitzplatz</text><text x="568" y="600" text-anchor="middle" font-size="12" fill="#656d76">Anreise entfernen</text></g><g><text x="16" y="690" font-size="13" font-weight="600" fill="#1f2328">So kommt man hin</text><text x="16" y="714" font-size="11.5" fill="#1f2328">Aufenthalt: „Bearbeiten“ im Kopf der Planungsansicht; „Aufenthalt planen“ führt zurück.</text><text x="16" y="734" font-size="11.5" fill="#1f2328">Ein Hafen der Kreuzfahrt ist ein Aufenthalt wie eine Stadt, nur mit Übernachtung an Bord.</text><text x="16" y="758" font-size="11.5" fill="#1f2328">Weiterreise: Tippen auf ihre Karte im Verlauf oder auf Ankunft und Abfahrt eines Aufenthalts.</text><text x="16" y="778" font-size="11.5" fill="#1f2328">Zwischen zwei Aufenthalten fehlen „Ab“ und „Von“; an der Heimreise heißt „Ab“ „Nach“ (Zuhause).</text><text x="16" y="802" font-size="11.5" fill="#1f2328">Eine Schiffsfahrt mit Seetagen trägt sie als Nächte unterwegs; ein Plus darauf fügt einen Hafen ein.</text></g></svg>
