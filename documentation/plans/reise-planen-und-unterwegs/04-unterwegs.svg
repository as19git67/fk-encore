<svg xmlns="http://www.w3.org/2000/svg" width="760" height="990" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 990" role="img" aria-label="Während der Reise bleibt die Planungsansicht dieselbe; besuchte Spots stehen oben mit Zeiten, Wetter und Fotos, ein Weg ist mit einem Tipp da" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="16" y="28" font-size="15" font-weight="600" fill="#1f2328">Unterwegs: dieselbe Ansicht, oben was war, darunter was noch kommt</text><g><rect x="16" y="48" width="360" height="760" rx="24" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="36" y="80" font-size="12" fill="#2f6fd6">‹ Reise</text><text x="356" y="118" text-anchor="end" font-size="20" font-weight="600" fill="#8c959f">›</text><text x="36" y="104" font-size="15" font-weight="600" fill="#1f2328">Inselhafen</text><text x="36" y="122" font-size="11.5" fill="#656d76">Tag 2 von 4 · heute · ☀ 19° jetzt</text><rect x="32" y="134" width="328" height="46" rx="8" fill="#2f6fd6" fill-opacity="0.1" stroke="#2f6fd6"></rect><text x="44" y="153" font-size="12" font-weight="600" fill="#1f2328">25 min hinter dem Plan</text><text x="44" y="170" font-size="11" fill="#656d76">Die Bucht passt heute nicht mehr.</text><rect x="270" y="143" width="80" height="28" rx="14" fill="#2f6fd6" fill-opacity="0.2" stroke="#2f6fd6"></rect><text x="310" y="161" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2f6fd6">Neu ordnen</text><text x="32" y="206" font-size="12" font-weight="600" fill="#656d76">Tag 1 · Fr 27.11. · ☁ 17°</text><text x="360" y="206" text-anchor="end" font-size="11" fill="#656d76">✓ 3 Spots · 24 Fotos  ›</text><line x1="32" y1="216" x2="360" y2="216" stroke="#d0d7de"></line><text x="32" y="238" font-size="12" font-weight="600" fill="#1f2328">Tag 2 · Sa 28.11. · heute</text><text x="360" y="238" text-anchor="end" font-size="11" fill="#656d76">2 von 5 besucht</text><rect x="32" y="248" width="328" height="62" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><g><circle cx="46" cy="266" r="7" fill="#2f6fd6"></circle><path d="M42.5 266L45 269L50 263" stroke="#f3f4f6" stroke-width="1.8" fill="none"></path></g><text x="60" y="270" font-size="12" font-weight="600" fill="#1f2328">Kathedrale</text><text x="60" y="286" font-size="11" fill="#1f2328">09:40 bis 10:55 · 75 statt 60 min</text><text x="60" y="301" font-size="11" fill="#656d76">☀ 18° · 12 Fotos</text><g><rect x="262" y="256" width="30" height="30" rx="4" fill="#f3f4f6" stroke="#d0d7de"></rect><path d="M265.6 280.6L273.4 271L279.4 277L283.6 272.8L288.4 280.6Z" fill="#d0d7de"></path></g><g><rect x="296" y="256" width="30" height="30" rx="4" fill="#f3f4f6" stroke="#d0d7de"></rect><path d="M299.6 280.6L307.4 271L313.4 277L317.6 272.8L322.4 280.6Z" fill="#d0d7de"></path></g><text x="350" y="300" text-anchor="end" font-size="10.5" fill="#656d76">+10</text><rect x="32" y="316" width="328" height="62" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><g><circle cx="46" cy="334" r="7" fill="#2f6fd6"></circle><path d="M42.5 334L45 337L50 331" stroke="#f3f4f6" stroke-width="1.8" fill="none"></path></g><text x="60" y="338" font-size="12" font-weight="600" fill="#1f2328">Markthalle</text><text x="60" y="354" font-size="11" fill="#1f2328">11:20 bis 12:05 · nicht geplant</text><text x="60" y="369" font-size="11" fill="#656d76">☀ 19° · 5 Fotos</text><g><rect x="262" y="324" width="30" height="30" rx="4" fill="#f3f4f6" stroke="#d0d7de"></rect><path d="M265.6 348.6L273.4 339L279.4 345L283.6 340.8L288.4 348.6Z" fill="#d0d7de"></path></g><g><rect x="296" y="324" width="30" height="30" rx="4" fill="#f3f4f6" stroke="#d0d7de"></rect><path d="M299.6 348.6L307.4 339L313.4 345L317.6 340.8L322.4 348.6Z" fill="#d0d7de"></path></g><line x1="32" y1="396" x2="360" y2="396" stroke="#2f6fd6" stroke-width="2"></line><circle cx="32" cy="396" r="4" fill="#2f6fd6"></circle><text x="360" y="390" text-anchor="end" font-size="11" font-weight="600" fill="#2f6fd6">jetzt 13:10</text><text x="60" y="416" font-size="11" fill="#2f6fd6">→ 6 min zu Fuß · 450 m · Weg zeigen</text><rect x="32" y="426" width="328" height="66" rx="8" fill="#2f6fd6" fill-opacity="0.1" stroke="#2f6fd6" stroke-width="2"></rect><circle cx="46" cy="444" r="7" fill="none" stroke="#8c959f" stroke-width="1.5"></circle><text x="60" y="448" font-size="12" font-weight="600" fill="#1f2328">Altstadtgassen</text><text x="60" y="464" font-size="11" fill="#1f2328">als Nächstes · ca. 13:20 bis 14:50</text><text x="60" y="479" font-size="11" fill="#656d76">Will · 90 min</text><rect x="270" y="444" width="80" height="30" rx="15" fill="#2f6fd6"></rect><text x="310" y="463" text-anchor="middle" font-size="12" font-weight="600" fill="#f3f4f6">Route</text><text x="60" y="512" font-size="11" fill="#656d76">→ 18 min zu Fuß</text><rect x="32" y="522" width="328" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><g><circle cx="46" cy="540" r="5" fill="#2f6fd6"></circle><line x1="46" y1="545" x2="46" y2="550" stroke="#2f6fd6" stroke-width="1.5"></line></g><text x="60" y="544" font-size="12" font-weight="600" fill="#1f2328">Aussicht am Hafen</text><text x="60" y="562" font-size="11" fill="#1f2328">Licht 17:20 · gepinnt</text><rect x="32" y="582" width="328" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><circle cx="46" cy="600" r="7" fill="none" stroke="#8c959f" stroke-width="1.5"></circle><text x="60" y="604" font-size="12" font-weight="600" fill="#656d76">Beispielbucht</text><text x="60" y="622" font-size="11" fill="#656d76">Wenn Zeit · passt heute nicht mehr</text><rect x="270" y="596" width="80" height="24" rx="12" fill="#2f6fd6" fill-opacity="0.15" stroke="#2f6fd6" stroke-width="1.25"></rect><text x="310" y="612" text-anchor="middle" font-size="11" fill="#2f6fd6">→ Tag 3?</text><text x="32" y="664" font-size="12" font-weight="600" fill="#1f2328">Tag 3 · So 29.11.</text><text x="360" y="664" text-anchor="end" font-size="11" fill="#656d76">☂ 14° erwartet · 2 Spots</text><line x1="32" y1="674" x2="360" y2="674" stroke="#d0d7de"></line><text x="32" y="696" font-size="12" font-weight="600" fill="#1f2328">Tag 4 · Mo 30.11. · ab 10:00</text><text x="360" y="696" text-anchor="end" font-size="11" fill="#656d76">1 Spot</text><rect x="32" y="740" width="328" height="36" rx="10" fill="#2f6fd6" fill-opacity="0.1" stroke="#2f6fd6"></rect><text x="196" y="763" text-anchor="middle" font-size="12" font-weight="600" fill="#2f6fd6">+ Ideen und Suche</text></g><g><rect x="392" y="48" width="352" height="520" rx="24" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><rect x="550" y="58" width="36" height="5" rx="2.5" fill="#8c959f"></rect><text x="568" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Weg</text><text x="728" y="92" text-anchor="end" font-size="12" font-weight="600" fill="#2f6fd6">Fertig</text><text x="410" y="125" font-size="12" fill="#656d76">Von</text><rect x="456" y="106" width="240" height="28" rx="6" fill="none" stroke="#8c959f"></rect><text x="466" y="125" font-size="11.5" fill="#1f2328">● Mein Standort  ▾</text><text x="410" y="161" font-size="12" fill="#656d76">Nach</text><rect x="456" y="142" width="240" height="28" rx="6" fill="none" stroke="#8c959f"></rect><text x="466" y="161" font-size="11.5" fill="#1f2328">Altstadtgassen  ▾</text><text x="718" y="145" text-anchor="middle" font-size="15" fill="#2f6fd6">⇅</text><rect x="408" y="182" width="66" height="24" rx="12" fill="#2f6fd6" fill-opacity="0.15" stroke="#2f6fd6" stroke-width="1.25"></rect><text x="441" y="198" text-anchor="middle" font-size="11" fill="#2f6fd6">Zu Fuß</text><rect x="480" y="182" width="66" height="24" rx="12" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="513" y="198" text-anchor="middle" font-size="11" fill="#1f2328">ÖPNV</text><rect x="552" y="182" width="56" height="24" rx="12" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="580" y="198" text-anchor="middle" font-size="11" fill="#1f2328">Auto</text><rect x="614" y="182" width="56" height="24" rx="12" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="642" y="198" text-anchor="middle" font-size="11" fill="#1f2328">Taxi</text><rect x="408" y="220" width="320" height="160" rx="10" fill="#f3f4f6" stroke="#d0d7de"></rect><path d="M440 350 L470 330 L520 335 L560 300 L610 290 L660 250" fill="none" stroke="#2f6fd6" stroke-width="3" stroke-dasharray="6 4"></path><circle cx="440" cy="350" r="6" fill="#2f6fd6"></circle><circle cx="660" cy="250" r="7" fill="none" stroke="#2f6fd6" stroke-width="2.5"></circle><text x="450" y="370" font-size="10.5" fill="#656d76">du</text><text x="672" y="246" font-size="10.5" fill="#656d76">Ziel</text><text x="410" y="408" font-size="14" font-weight="600" fill="#1f2328">6 min · 450 m</text><text x="410" y="426" font-size="11" fill="#656d76">an ca. 13:16, fünf Minuten vor dem Plan</text><rect x="408" y="440" width="320" height="34" rx="10" fill="#2f6fd6"></rect><text x="568" y="462" text-anchor="middle" font-size="12" font-weight="600" fill="#f3f4f6">In der Karten-App starten</text><text x="410" y="502" font-size="10.5" font-weight="600" fill="#656d76">ANDERES ZIEL</text><text x="410" y="524" font-size="11.5" fill="#1f2328">Aussicht am Hafen</text><text x="728" y="524" text-anchor="end" font-size="11.5" fill="#656d76">22 min</text><text x="410" y="546" font-size="11.5" fill="#1f2328">Hotel Beispiel</text><text x="728" y="546" text-anchor="end" font-size="11.5" fill="#656d76">12 min</text></g><g><text x="392" y="604" font-size="13" font-weight="600" fill="#1f2328">Was die App unterwegs mitschreibt</text><text x="392" y="628" font-size="11.5" fill="#1f2328">Besucht: wer 10 min im Umkreis von 100 m ist, hakt ab;</text><text x="392" y="644" font-size="11.5" fill="#1f2328">Ankunft und Abfahrt stehen dabei.</text><text x="392" y="668" font-size="11.5" fill="#1f2328">Fotos des Tages kommen nach Zeit und Ort zum Spot.</text><text x="392" y="692" font-size="11.5" fill="#1f2328">Wetter je Spot und Tag; für künftige Tage die Vorhersage.</text><text x="392" y="716" font-size="11.5" fill="#1f2328">Besuchte Spots stehen oben in der echten Reihenfolge,</text><text x="392" y="732" font-size="11.5" fill="#1f2328">auch ungeplante (Markthalle); darunter „jetzt“.</text><text x="392" y="756" font-size="11.5" fill="#1f2328">Umplanen wie vorher; „Neu ordnen“ ordnet nur ab jetzt.</text><text x="392" y="780" font-size="11.5" fill="#1f2328">Vorbei und nicht besucht: am Abend einmal fragen,</text><text x="392" y="796" font-size="11.5" fill="#1f2328">anderer Tag oder zurück zu den Ideen.</text><text x="392" y="836" font-size="13" font-weight="600" fill="#1f2328">Weg schnell zeigen, auch vor der Reise</text><text x="392" y="860" font-size="11.5" fill="#1f2328">„Route“ am nächsten Spot: vom Standort dorthin.</text><text x="392" y="884" font-size="11.5" fill="#1f2328">Tippen auf die Wegzeile zwischen zwei Spots:</text><text x="392" y="900" font-size="11.5" fill="#1f2328">derselbe Weg, Von und Nach vorbelegt.</text><text x="392" y="924" font-size="11.5" fill="#1f2328">„Route“ in den Spot-Details: vom Standort zu ihm.</text><text x="392" y="948" font-size="11.5" fill="#1f2328">Von und Nach sind änderbar; ohne Standort der Spot davor.</text></g><text x="16" y="984" font-size="11.5" fill="#656d76">Das Gerüst ist dasselbe wie beim Planen; neu sind Haken, echte Zeiten, Wetter, Fotos und die Linie „jetzt“.</text></svg>
