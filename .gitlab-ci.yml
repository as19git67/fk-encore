# ---------------------------------------------------------------------------
# Shared Watchtower deploy — fires once per pipeline, after whatever build
# jobs actually ran, instead of once per (former) workflow.
# ---------------------------------------------------------------------------

# Deploy has no `changes:` gate of its own — it relies on app:build's rule 2
# (unconditional `on_success` whenever the pipeline source matches, with no
# changes: filter) firing for virtually any diff that isn't confined to the
# three service dirs ignored by app:test/app:build. That means deploy always
# has at least one real `needs:` dependency in practice, EXCEPT when a change
# touches only embedding_service/**, insightface-service/** or geo/** — and
# in that case the matching sidecar build job (embedding:build/etc.) runs
# instead, so deploy still has a genuine dependency. If app:build's rule 2
# ever grows its own `changes:` filter, re-check this invariant — deploy
# could start firing the Watchtower webhook with nothing new to serve.
.deploy_needs: &deploy_needs
  - job: app:build
    optional: true
  - job: embedding:build
    optional: true
  - job: geo:build
    optional: true
  - job: insightface:build
    optional: true
  - job: llm:build
    optional: true
  - job: receipt-ocr:build
    optional: true
  - job: taxonomy-tools:build
    optional: true
  - job: playwright-image:build
    optional: true

deploy:test:
  stage: deploy
  image: curlimages/curl:8.11.1
  needs: *deploy_needs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - >
      curl -f -X POST
      --retry 5 --retry-delay 10 --retry-all-errors
      -H "Authorization: Bearer ${WATCHTOWER_TOKEN}"
      "${WATCHTOWER_URL_TEST}/v1/update"

deploy:prod:
  stage: deploy
  image: curlimages/curl:8.11.1
  needs: *deploy_needs
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - >
      curl -f -X POST
      --retry 5 --retry-delay 10 --retry-all-errors
      -H "Authorization: Bearer ${WATCHTOWER_TOKEN}"
      "${WATCHTOWER_URL_PROD}/v1/update"

# ---------------------------------------------------------------------------
# ghcr-cleanup.yml -> registry.scheggs.net cleanup
#
# GitLab's Container Registry has a native bulk-delete endpoint
# (keep_n + name_regex_keep/name_regex_delete) that replaces the GHCR
# script's two-step "find orphaned untagged manifests, then trim old tagged
# versions" logic outright — GitLab's registry garbage-collects unreferenced
# manifests on its own once a tag is deleted, so there is no need to hunt
# down child-manifest digests by hand.
#
# NOTE: for this API GitLab needs a token with `api` scope on the project
# (a Project Access Token works; $CI_JOB_TOKEN is enough on most GitLab
# versions >= 13 for same-project registry management, but if a version here
# rejects it, set CLEANUP_TOKEN as a masked CI/CD variable — a Project/Personal
# Access Token, sent as PRIVATE-TOKEN rather than JOB-TOKEN, see below).
#
# Consider instead configuring this natively under Settings > Packages and
# registries > Container registry > Cleanup policy, which covers the same
# "keep N, protect these tags" policy with zero pipeline code. This job is
# kept for parity with the old workflow (same protected-tag regex, runs on
# the same daily schedule) and to allow on-demand manual runs.
# ---------------------------------------------------------------------------

cleanup:registry:
  stage: cleanup
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  variables:
    # Protected: latest, buildcache, semver (1.2.3 / v1.2.3), pw-<x.y.z>.
    PROTECTED_TAG_REGEX: '^(latest|buildcache|v?[0-9]+\.[0-9]+\.[0-9]+|pw-[0-9]+\.[0-9]+\.[0-9]+)$'
    KEEP_N: "10"
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -euo pipefail
      # CI_JOB_TOKEN authenticates via the JOB-TOKEN header; a Project/Personal
      # Access Token (CLEANUP_TOKEN) authenticates via PRIVATE-TOKEN instead —
      # sending a PAT as JOB-TOKEN gets rejected with 401.
      if [ -n "${CLEANUP_TOKEN:-}" ]; then
        AUTH_HEADER="PRIVATE-TOKEN: ${CLEANUP_TOKEN}"
      else
        AUTH_HEADER="JOB-TOKEN: ${CI_JOB_TOKEN}"
      fi
      API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories"

      REPOS=$(curl -fsSL --header "${AUTH_HEADER}" "${API}?per_page=100")
      echo "${REPOS}" | jq -r '.[] | "\(.id)\t\(.path)"'

      echo "${REPOS}" | jq -r '.[].id' | while read -r repo_id; do
        [ -z "$repo_id" ] && continue
        echo "Cleaning repository id ${repo_id}"
        curl -fsSL --header "${AUTH_HEADER}" -X DELETE \
          "${API}/${repo_id}/tags?name_regex_delete=.*&name_regex_keep=${PROTECTED_TAG_REGEX}&keep_n=${KEEP_N}"
      done
