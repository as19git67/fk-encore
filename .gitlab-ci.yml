# ---------------------------------------------------------------------------
# docker-image-llm.yml (cpu + cuda matrix)
# ---------------------------------------------------------------------------

llm:test:
  stage: test
  image: python:3.11-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &llm_paths
        - "llm-service/**/*"
        - ".gitlab-ci.yml"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
      changes: *llm_paths
  script:
    - cd llm-service
    - pip install fastapi httpx pytest pydantic
    - pytest tests/ -v

# Both variants compile llama-cpp-python from source (PyPI ships only an
# sdist, and the CPU build needs custom CMAKE_ARGS to disable AVX-512 — see
# llm-service/Dockerfile). fail_fast: false so a broken CUDA build still
# leaves a publishable CPU image. Registry-backed buildx cache per variant
# (the `buildcache` tag) so touching main.py alone reuses the compiled layer.
llm:build:
  <<: *docker_dind
  stage: build
  needs: ["llm:test"]
  parallel:
    matrix:
      - VARIANT: cpu
        DOCKERFILE: llm-service/Dockerfile
        SUFFIX: ""
      - VARIANT: cuda
        DOCKERFILE: llm-service/Dockerfile.gpu
        SUFFIX: "-gpu"
  variables:
    IMAGE_PATH: "${CI_PROJECT_PATH}/llm${SUFFIX}"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *llm_paths
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
      changes: *llm_paths
  before_script:
    - *registry_login
    - *compute_tags
  script:
    - docker buildx create --use --driver docker-container
    - |
      TAG_ARGS=""
      while read -r tag; do
        [ -z "$tag" ] && continue
        TAG_ARGS="$TAG_ARGS -t $tag"
      done < tags.txt
      docker buildx build ./llm-service \
        -f "$DOCKERFILE" \
        --platform linux/amd64 \
        $TAG_ARGS \
        --cache-from "type=registry,ref=${REGISTRY}/${IMAGE_PATH}:buildcache" \
        --cache-to "type=registry,ref=${REGISTRY}/${IMAGE_PATH}:buildcache,mode=max" \
        --push

# ---------------------------------------------------------------------------
# docker-image-playwright-e2e.yml — pre-baked Playwright runner image
# ---------------------------------------------------------------------------

playwright-image:build:
  <<: *docker_dind
  stage: build
  timeout: 30 minutes
  variables:
    IMAGE_PATH: "${CI_PROJECT_PATH}/playwright-e2e"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &pw_image_paths
        - "docker/Dockerfile.playwright-e2e"
        - ".gitlab-ci.yml"
        - "frontend/package.json"
        - "frontend/package-lock.json"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
      changes: *pw_image_paths
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apk add --no-cache nodejs npm
    - *registry_login
  script:
    # Read the Playwright version from frontend/package-lock.json so the
    # baked-in chromium matches what `npx playwright test` runs later. Drift
    # here surfaces as "browser executable doesn't exist" at runtime.
    - PW_VERSION=$(node -p "require('./frontend/package-lock.json').packages['node_modules/@playwright/test'].version")
    - echo "Resolved Playwright version ${PW_VERSION}"
    - |
      IMAGE="${REGISTRY}/${IMAGE_PATH}"
      : > tags.txt
      [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && echo "${IMAGE}:latest" >> tags.txt
      [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && echo "${IMAGE}:pw-${PW_VERSION}" >> tags.txt
      [ -n "$CI_COMMIT_TAG" ] && echo "${IMAGE}:${CI_COMMIT_TAG}" >> tags.txt
      [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ] && echo "${IMAGE}:test" >> tags.txt
      # Manual web-triggered one-off rebuild (e.g. testing a Dockerfile
      # change on a feature branch) matches none of the above and would
      # otherwise leave tags.txt empty -> buildx push with zero -t flags.
      if [ ! -s tags.txt ]; then
        echo "${IMAGE}:manual-${CI_COMMIT_SHORT_SHA}" >> tags.txt
      fi
      cat tags.txt
    - docker buildx create --use --driver docker-container
    - |
      TAG_ARGS=""
      while read -r tag; do
        [ -z "$tag" ] && continue
        TAG_ARGS="$TAG_ARGS -t $tag"
      done < tags.txt
      # mcr.microsoft.com hands out pre-signed Azure-blob URLs that
      # intermittently 403; one retry after a short wait is plenty in
      # practice (see GH run 26364805275).
      docker buildx build . \
        -f docker/Dockerfile.playwright-e2e \
        --build-arg PLAYWRIGHT_VERSION="${PW_VERSION}" \
        $TAG_ARGS \
        --push \
      || { echo "First build attempt failed (likely a transient MCR 403); retrying in 30s"; sleep 30; \
           docker buildx build . -f docker/Dockerfile.playwright-e2e --build-arg PLAYWRIGHT_VERSION="${PW_VERSION}" $TAG_ARGS --push; }

