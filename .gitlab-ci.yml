    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
      changes: *geo_paths
  script:
    - cd geo
    - npm install
    - npm run typecheck
    - npm test

geo:build:
  <<: *docker_dind
  stage: build
  needs: ["geo:test"]
  variables:
    IMAGE_PATH: "${CI_PROJECT_PATH}/geo"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *geo_paths
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
      changes: *geo_paths
  before_script:
    - *docker_ready
    - *registry_login
    - *compute_tags
  script:
    # Single-arch (amd64) to match the current deploy target. Flip to
    # linux/amd64,linux/arm64 once an arm64 host is actually in use.
    - *buildx_create
    - |
      TAG_ARGS=""
      while read -r tag; do
        [ -z "$tag" ] && continue
        TAG_ARGS="$TAG_ARGS -t $tag"
      done < tags.txt
      docker buildx build ./geo \
        --platform linux/amd64 \
        $TAG_ARGS \
        --push

