# GitLab CI port of the former GitHub Actions workflows (.github/workflows/*.yml,
# excluding claude.yml, which has no GitLab equivalent and was dropped).
#
# Registry: images now live on this GitLab's integrated Container Registry
# instead of ghcr.io. The main app keeps the project's own image path; sidecar
# services use sub-paths under it (<registry>/schegg/fk-encore/<service>)
# instead of GHCR's sibling-repo-with-suffix naming
# (ghcr.io/as19git67/fk-encore-<service>) — that's the GitLab-native way to
# group several images under one project.
#
# Registry address: CI pushes to the registry's LOCAL origin address
# (nas.schegg.net:45050, host port 45050 -> container port 5050), NOT the
# public registry.scheggs.net. The public name is a Cloudflare Tunnel CNAME,
# and tunnel traffic goes through Cloudflare's edge, which caps request bodies
# at 100 MB — image layers here are bigger than that, so pushes died with
# "413 Payload Too Large". Going straight to the origin skips Cloudflare
# entirely. This changes nothing for consumers: a registry stores images by
# repository PATH, so an image pushed as
# nas.schegg.net:45050/schegg/fk-encore/embedding is the exact same image as
# registry.scheggs.net/schegg/fk-encore/embedding — deployments and Watchtower
# keep pulling the public name unchanged.
#
# Login: uses the predefined $CI_REGISTRY_USER / $CI_REGISTRY_PASSWORD
# (gitlab-ci-token). The registry answers with a token realm pointing at the
# public GitLab URL, which the runner reaches over the internet as usual — that
# request is tiny, so the Cloudflare body limit is irrelevant for it.
#
# The origin speaks plain HTTP, so both the dind daemon (--insecure-registry)
# and BuildKit (see .buildx_create below) have to be told to allow it.
#
# Runners: the docker-build jobs need a Docker executor with access to a
# Docker daemon (docker:dind service, privileged mode) or an equivalent
# Docker-in-Docker setup. The iOS job needs a macOS runner with Xcode
# registered with the `macos` tag — adjust the tag to match your fleet.
#
# Deploy: every former workflow POSTed to the *same* Watchtower webhook
# regardless of which image it built, so instead of duplicating that call in
# every build job, this file fires it once per pipeline via deploy:test /
# deploy:prod, after whichever build jobs actually ran.

stages:
  - test
  - build
  - deploy

variables:
  # Local origin address of the GitLab Container Registry — see the header
  # comment for why this is not registry.scheggs.net.
  REGISTRY: nas.schegg.net:45050
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2

# Avoid duplicate pipelines for the same push (branch pipeline + MR pipeline).
# Mirrors: push to main/tags, pull_request, workflow_dispatch (-> web, used by
# playwright-image:build and e2e:playwright for manual one-off runs).
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ---------------------------------------------------------------------------
# Shared building blocks
# ---------------------------------------------------------------------------

.docker_dind: &docker_dind
  image: docker:27-cli
  services:
    # insecure-registries: the registry origin is plain HTTP (TLS is
    # terminated by the Cloudflare Tunnel for public access, not here), and
    # dockerd refuses non-TLS registries unless explicitly allowed. Covers
    # plain `docker push`; buildx needs its own config, see .buildx_create.
    #
    # Written to /etc/docker/daemon.json rather than passed as an
    # --insecure-registry=... CLI flag: with the flag, `docker login`
    # (registry.scheggs.net's own /v2/ check) went through fine but the
    # later `docker push` to nas.schegg.net:45050 still failed with
    # "server gave HTTP response to HTTPS client" — the flag was accepted
    # (dockerd started, login worked) but evidently wasn't honoured for
    # every registry client code path. daemon.json is the config dockerd
    # actually reads its insecure-registries table from; the CLI flag is
    # sugar over the same setting and apparently less reliable here. Do
    # NOT also pass the CLI flag — dockerd refuses to start if the same
    # setting comes from both a flag and the config file.
    #
    # Spelled out rather than "$REGISTRY" on purpose: variable expansion in
    # a service `command:` is not dependable. Keep in sync with the
    # REGISTRY variable above if the registry address ever changes.
    - name: docker:27-dind
      command:
        - sh
        - -c
        - |
          mkdir -p /etc/docker
          printf '{"insecure-registries":["nas.schegg.net:45050"]}' > /etc/docker/daemon.json
          exec dockerd-entrypoint.sh

# NOTE: the anchors below must stay single multi-line strings (YAML block
# scalars), not one-element lists — `- *anchor` inside another job's
# before_script list only flattens correctly when the anchor itself resolves
# to a scalar. Anchoring a list here would nest as `- - echo ...` and break
# at runtime (verified against gitlab.scheggs.net's CI lint API).

# GitLab waits 30s for a service to report healthy and then starts the job
# regardless. Docker 27 deliberately slows its own startup when it binds TCP
# without TLS ("Startup is intentionally being slowed down to show this
# message"), so on a loaded host that window gets missed and the job races a
# daemon that is not serving yet — taxonomy-tools:build hit exactly that and
# died on `docker login` while sibling jobs minutes earlier were fine.
.docker_ready: &docker_ready |
  for i in $(seq 1 60); do
    docker info >/dev/null 2>&1 && break
    if [ "$i" = 60 ]; then echo "dockerd never became ready"; exit 1; fi
    sleep 2
  done
  # Confirm the insecure-registry entry actually landed. Without this check a
  # missing entry only surfaces minutes later, mid-push, as an opaque TLS error.
  docker info 2>/dev/null | grep -qF "nas.schegg.net:45050" || {
    echo "dockerd is up but nas.schegg.net:45050 is not among its insecure registries:"
    docker info 2>/dev/null | sed -n '/Insecure Registries/,$p'
    exit 1
  }

.registry_login: &registry_login |
  echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$REGISTRY"

# Creates the buildx builder. The docker-container driver runs BuildKit in its
# own container, which does NOT inherit dockerd's --insecure-registry flag —
# without this config every `buildx build --push` to the plain-HTTP origin
# fails with an HTTPS/TLS error.
.buildx_create: &buildx_create |
  cat > /tmp/buildkitd.toml <<EOF
  [registry."${REGISTRY}"]
    http = true
    insecure = true
  EOF
  docker buildx create --use --driver docker-container --config /tmp/buildkitd.toml

# Rebuild of docker/metadata-action's tag logic:
#   latest        -> default-branch pushes
#   <git tag>      -> semver tag pushes (the tag name itself, same as GH's type=semver,pattern={{version}})
#   test          -> merge request pipelines
# Writes a newline-separated list of image refs to tags.txt for the caller to loop over.
.compute_tags: &compute_tags |
  IMAGE="${REGISTRY}/${IMAGE_PATH}"
  : > tags.txt
  if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
    echo "${IMAGE}:latest" >> tags.txt
  fi
  if [ -n "$CI_COMMIT_TAG" ]; then
    echo "${IMAGE}:${CI_COMMIT_TAG}" >> tags.txt
  fi
  if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
    echo "${IMAGE}:test" >> tags.txt
  fi
  echo "Resolved tags:"; cat tags.txt

# ---------------------------------------------------------------------------
# compose-validate.yml -> validate / chown-init-smoke
# ---------------------------------------------------------------------------

compose:validate:
  stage: test
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  rules:
    - changes:
        - docker-compose.yml
        - docker-compose-dev.yml
        - docker-compose.env.example
        - docker-compose.env.test.example
        - .gitlab-ci.yml
  script:
    # --quiet exits non-zero on any syntax / reference / volume-ref error, so
    # this is a cheap guard against broken compose files. The prod file
    # references unset env vars (WATCHTOWER_TOKEN etc.) which compose treats
    # as empty strings — that is fine for a config check.
    - docker compose -f docker-compose.yml config --quiet
    - docker compose --env-file docker-compose.env.test.example -f docker-compose.yml config --quiet
    - docker compose -f docker-compose-dev.yml config --quiet

compose:chown-init-smoke:
  stage: test
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  needs: ["compose:validate"]
  rules:
    - changes:
        - docker-compose.yml
        - docker-compose-dev.yml
        - docker-compose.env.example
        - docker-compose.env.test.example
        - .gitlab-ci.yml
  script:
    # Spins up chown-init against a throwaway compose file mirroring the
    # command + mount layout from docker-compose.yml but with default local
    # volumes (no host bind paths — those point at a specific TrueNAS host
    # and do not exist on CI runners). Proves the command sets 568:568
    # recursively, across a directory that already contains root-owned files.
    - |
      cat > docker-compose.ci.yml <<'EOF'
      services:
        chown-init:
          image: alpine:3.20
          user: "0:0"
          command: ["sh", "-c", "chown -R 568:568 /mnt/documents /mnt/documents-inbox /mnt/models"]
          volumes:
            - documents:/mnt/documents
            - documents_inbox:/mnt/documents-inbox
            - llm_models:/mnt/models
      volumes:
        documents:
        documents_inbox:
        llm_models:
      EOF
    - |
      docker compose -f docker-compose.ci.yml run --rm --user 0:0 \
        --entrypoint sh chown-init -c '
          touch /mnt/documents/seed.pdf \
                /mnt/documents-inbox/seed.pdf \
                /mnt/models/seed.bin
        '
    - docker compose -f docker-compose.ci.yml run --rm chown-init
    - |
      docker compose -f docker-compose.ci.yml run --rm --user 0:0 \
        --entrypoint sh chown-init -c '
          set -e
          for p in /mnt/documents /mnt/documents-inbox /mnt/models; do
            dir_owner=$(stat -c "%u:%g" "$p")
            file_owner=$(stat -c "%u:%g" "$p"/seed.*)
            echo "$p: dir=$dir_owner file=$file_owner"
            [ "$dir_owner" = "568:568" ] || { echo "FAIL: $p dir owner $dir_owner"; exit 1; }
            [ "$file_owner" = "568:568" ] || { echo "FAIL: $p file owner $file_owner"; exit 1; }
          done
          echo "chown-init smoke OK"
        '
  after_script:
    - docker compose -f docker-compose.ci.yml down -v || true

# ---------------------------------------------------------------------------
# docker-image.yml -> main Encore app (two-stage build)
# ---------------------------------------------------------------------------

app:test:
  stage: test
  image: node:24-bookworm
  services:
    - name: pgvector/pgvector:pg18
      alias: postgres
      variables:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: postgres
  variables:
    NODE_ENV: test
    VITEST: "true"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_TEST_DB: encore_test
    POSTGRES_TEST_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/encore_test
  rules: &app_ignore_rules
    # GitLab's `changes:` has no negation/exclude syntax (unlike GH's
    # paths-ignore), so this approximates it: skip when the change set
    # touches one of the ignored service dirs, run otherwise. Deviation from
    # GH: paths-ignore only skips if *every* changed file is ignored; here a
    # commit touching both an ignored dir and something else still skips.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "embedding_service/**/*"
        - "insightface-service/**/*"
        - "geo/**/*"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
      changes:
        - "embedding_service/**/*"
        - "insightface-service/**/*"
        - "geo/**/*"
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
      when: on_success
  script:
    # `npm install`, not `npm ci`: lockfiles have repeatedly drifted between
    # dev platforms in this repo, and `npm ci` would fail CI on every drift.
    - npm install
    # geo/ is a standalone Node container with its own package.json, but
    # Encore's source-code parser walks every .ts in the workspace; without
    # geo/node_modules it fails to resolve `import express`.
    - npm --prefix geo install
    - npm test
    - npm --prefix frontend install --legacy-peer-deps
    - npm --prefix frontend run test
  artifacts:
    paths:
      - frontend/dist
    expire_in: 1 hour

app:build:
  <<: *docker_dind
  # Overrides the anchor's Alpine-based docker:27-cli. The Encore CLI ships
  # glibc-linked binaries, so on Alpine (musl) install.sh downloads fine and
  # the very next call dies with "cannot execute: required file not found" —
  # that is what a missing ld-linux looks like, not a missing `encore`. This
  # job therefore runs on Debian and brings the Docker CLI in itself; only
  # the client is needed here, the daemon is the dind service from the
  # anchor. Node comes with the image, which the frontend build needs anyway.
  image: node:24-bookworm
  stage: build
  needs: ["app:test"]
  variables:
    IMAGE_PATH: "${CI_PROJECT_PATH}"
    VITE_APP_BUILD: "${CI_PIPELINE_IID}-${CI_COMMIT_SHA}"
    DOCKER_CLI_VERSION: "27.5.1"
  rules: *app_ignore_rules
  before_script:
    - |
      curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_CLI_VERSION}.tgz" \
        | tar -xz -C /usr/local/bin --strip-components=1 docker/docker
    - docker --version
    # skopeo does the registry push, see the comment on that step below.
    - apt-get update -qq && apt-get install -y --no-install-recommends skopeo
    - skopeo --version
    - *docker_ready
    - *registry_login
    - *compute_tags
  script:
    # app:test and app:build are separate jobs in separate containers with
    # separate checkouts — nothing from app:test's `npm install` carries
    # over here, `needs:` only orders the jobs. encore build docker walks
    # every .ts file in the workspace (including geo/src/server.ts) and
    # needs geo/node_modules to resolve `import express`, the same reason
    # app:test installs it — see the comment there.
    - npm install
    - npm --prefix geo install
    - npm --prefix frontend install --legacy-peer-deps
    - npm --prefix frontend run build
    # Installs the Encore CLI via the upstream install.sh, as documented at
    # https://encore.dev/docs/ts/self-host/ci-cd. No `-v <version>`: the
    # official docs install the latest GA release; pinning via -v caused
    # install.sh to 403 on the CDN in the past.
    - curl -fsSL --retry 3 --retry-delay 5 -o install.sh https://encore.dev/install.sh
    - bash install.sh
    - export PATH="${HOME}/.encore/bin:${PATH}"
    - rm -f install.sh
    - encore version
    # Stage A — Encore's official production build. Produces a portable
    # image (node:24-bookworm-slim base) with the compiled app + runtime,
    # tagged locally; it never leaves the runner/dind daemon.
    #
    # --config bakes infra-config.json into the image; do NOT use
    # --skip-config, the Encore runtime requires ENCORE_RUNTIME_CONFIG or
    # ENCORE_INFRA_CONFIG_PATH at startup and --skip-config suppresses both,
    # crashing the container immediately.
    - |
      encore build docker \
        --config=infra-config.json \
        --base=node:24-bookworm-slim \
        --os=linux \
        --arch=amd64 \
        fk-encore-raw:build
    # Stage B — thin runtime wrapper: TrueNAS SCALE apps user (568:568),
    # bind-mount directories, the pre-built frontend SPA, APP_BUILD_NUMBER.
    - |
      docker build \
        -f docker/Dockerfile.runtime \
        --build-arg BASE_IMAGE=fk-encore-raw:build \
        --build-arg BUILD_NUMBER="${CI_PIPELINE_IID}-${CI_COMMIT_SHA}" \
        -t app-build:latest \
        .
    # Pushed with skopeo rather than `docker push`. The daemon honours its
    # insecure-registries list for `docker login` (which succeeds) but still
    # attempts HTTPS for the blob uploads, so the push died with "server gave
    # HTTP response to HTTPS client" — reproducibly, with the setting supplied
    # both as a --insecure-registry flag and via daemon.json. Every other image
    # here goes out through BuildKit, which is told `http = true` explicitly and
    # has never had the problem; skopeo takes the same kind of explicit switch,
    # so this job stops depending on the daemon guessing right.
    # `docker-daemon:` reads the image straight out of dockerd (via DOCKER_HOST),
    # so Stage B does not have to be rebuilt somewhere BuildKit can see it.
    - |
      while read -r tag; do
        [ -z "$tag" ] && continue
        echo "Pushing ${tag}"
        skopeo copy --dest-tls-verify=false --src-tls-verify=false \
          --src-daemon-host "${DOCKER_HOST}" \
          --dest-authfile "${HOME}/.docker/config.json" \
          docker-daemon:app-build:latest \
          "docker://${tag}"
      done < tags.txt

# ---------------------------------------------------------------------------
# docker-image-embedding.yml
# ---------------------------------------------------------------------------

embedding:test:
  stage: test
  image: python:3.11-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &embedding_paths
        - "embedding_service/**/*"
        - ".gitlab-ci.yml"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
      changes: *embedding_paths
  script:
    - cd embedding_service
    - pip install fastapi httpx pytest pytest-asyncio pydantic pydantic-settings python-multipart Pillow sqlalchemy[asyncio] numpy
    - pytest tests/ -v

embedding:build:
  <<: *docker_dind
  stage: build
  needs: ["embedding:test"]
  variables:
    IMAGE_PATH: "${CI_PROJECT_PATH}/embedding"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *embedding_paths
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
      changes: *embedding_paths
  before_script:
    - *docker_ready
    - *registry_login
    - *compute_tags
  script:
    # amd64-only for now (no arm64 host in use yet). Flip back to
    # linux/amd64,linux/arm64 + re-add QEMU/binfmt setup (tonistiigi/binfmt)
    # before this buildx build once arm64 is actually needed.
    - *buildx_create
    - |
      TAG_ARGS=""
      while read -r tag; do
        [ -z "$tag" ] && continue
        TAG_ARGS="$TAG_ARGS -t $tag"
      done < tags.txt
      docker buildx build ./embedding_service \
        --platform linux/amd64 \
        $TAG_ARGS \
        --push

# ---------------------------------------------------------------------------
