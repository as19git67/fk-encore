# ---------------------------------------------------------------------------
# Shared Watchtower deploy — fires once per pipeline, after whatever build
# jobs actually ran, instead of once per (former) workflow.
# ---------------------------------------------------------------------------

# Deploy has no `changes:` gate of its own — it relies on app:build's rule 2
# (unconditional `on_success` whenever the pipeline source matches, with no
# changes: filter) firing for virtually any diff that isn't confined to the
# three service dirs ignored by app:test/app:build. That means deploy always
# has at least one real `needs:` dependency in practice, EXCEPT when a change
# touches only embedding_service/**, insightface-service/** or geo/** — and
# in that case the matching sidecar build job (embedding:build/etc.) runs
# instead, so deploy still has a genuine dependency. If app:build's rule 2
# ever grows its own `changes:` filter, re-check this invariant — deploy
# could start firing the Watchtower webhook with nothing new to serve.
.deploy_needs: &deploy_needs
  - job: app:build
    optional: true
  - job: embedding:build
    optional: true
  - job: geo:build
    optional: true
  - job: insightface:build
    optional: true
  - job: llm:build
    optional: true
  - job: receipt-ocr:build
    optional: true
  - job: taxonomy-tools:build
    optional: true
  - job: playwright-image:build
    optional: true

deploy:test:
  stage: deploy
  image: curlimages/curl:8.11.1
  needs: *deploy_needs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - >
      curl -f -X POST
      --retry 5 --retry-delay 10 --retry-all-errors
      -H "Authorization: Bearer ${WATCHTOWER_TOKEN}"
      "${WATCHTOWER_URL_TEST}/v1/update"

deploy:prod:
  stage: deploy
  image: curlimages/curl:8.11.1
  needs: *deploy_needs
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - >
      curl -f -X POST
      --retry 5 --retry-delay 10 --retry-all-errors
      -H "Authorization: Bearer ${WATCHTOWER_TOKEN}"
      "${WATCHTOWER_URL_PROD}/v1/update"

