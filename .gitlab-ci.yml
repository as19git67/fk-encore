# ---------------------------------------------------------------------------
# playwright-e2e.yml (Track M) — application E2E suite
# ---------------------------------------------------------------------------

e2e:playwright:
  stage: test
  # Plain node image + self-installed Encore CLI/Playwright, not the
  # pre-baked ${REGISTRY}/${CI_PROJECT_PATH}/playwright-e2e image: that image
  # is built by playwright-image:build in *this same* pipeline, so depending
  # on it here is circular on a fresh registry (nothing has ever been pushed
  # yet) and unreliable on MR pipelines (that job only pushes :test, not
  # :latest, unless the Dockerfile itself changed in the MR). Once the image
  # has a proven build/push history, switch back to it as a speed
  # optimization (setup drops from ~2-3 min to seconds) and add
  # `needs: [{job: playwright-image:build, optional: true}]` for ordering.
  image: node:24-bookworm
  timeout: 30 minutes
  interruptible: true
  # GH used `concurrency: group: e2e-...; cancel-in-progress: true` because
  # stale and fresh runs on the same branch fight over the Postgres/Encore
  # ports. `interruptible: true` only helps if the project-level "auto-cancel
  # redundant pipelines" setting is also on; resource_group additionally
  # guarantees mutual exclusion per ref even without that setting (it queues
  # instead of cancelling, but the port race is what actually matters here).
  resource_group: e2e-$CI_COMMIT_REF_SLUG
  services:
    - name: pgvector/pgvector:pg18
      alias: postgres
      variables:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: postgres
  variables:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DATABASE: fk_encore
    ADMIN_EMAIL: admin@example.com
    ADMIN_PASSWORD: admin
    ADMIN_NAME: Admin
    E2E_SEED_DEMO: "1"
    RP_ORIGIN: http://localhost:5173
    RP_NAME: FK Encore E2E
    RP_ID: localhost
    ENCORE_TELEMETRY_DISABLED: "1"
    CI: "true"
    E2E_BASE_URL: http://localhost:5173/app/
    E2E_API_URL: http://localhost:4000
    E2E_ADMIN_EMAIL: admin@example.com
    E2E_ADMIN_PASSWORD: admin
    PHOTO_UPLOAD_DIR: ${CI_PROJECT_DIR}/e2e-data/photos
    PHOTO_THUMBNAIL_DIR: ${CI_PROJECT_DIR}/e2e-data/thumbnails
    PHOTO_LIBRARIES_ROOT: ${CI_PROJECT_DIR}/e2e-data/libraries
    DOCUMENTS_DIR: ${CI_PROJECT_DIR}/e2e-data/documents
    DOCUMENTS_INBOX_DIR: ${CI_PROJECT_DIR}/e2e-data/documents-inbox
    BACKUP_DIR: ${CI_PROJECT_DIR}/e2e-data/backup
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &e2e_paths
        - "frontend/**/*"
        - "user/**/*"
        - "photo/**/*"
        - "documents/**/*"
        - "finance/**/*"
        - "db/**/*"
        - "web/**/*"
        - "package*.json"
        - ".gitlab-ci.yml"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *e2e_paths
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - node --version
    - npm --version
    # No pre-installed tooling here (see the image: comment above) — install
    # the Encore CLI the same way app:build does.
    - curl -fsSL --retry 3 --retry-delay 5 -o install.sh https://encore.dev/install.sh
    - bash install.sh
    - export PATH="${HOME}/.encore/bin:${PATH}"
    - rm -f install.sh
    - encore version
  script:
    - npm install
    - npm --prefix geo install
    - npm --prefix frontend install --legacy-peer-deps
    # Chromium + OS deps, matching the version pinned in the frontend
    # lockfile. Slower than the pre-baked image (see comment above) but has
    # no bootstrap dependency on it.
    - npx --prefix frontend playwright install --with-deps chromium
    - npx --prefix frontend playwright --version
    - mkdir -p e2e-logs
    # `encore run` talks to a background `encored` daemon that it auto-spawns
    # on first use; in a fresh container that spawn+handshake can race and
    # `encore run` gives up with "dialing daemon: context deadline exceeded"
    # (seen in CI: it exits almost immediately, so the wait loop below just
    # polls a port nothing is listening on for the full budget). Warm the
    # daemon up on its own first, with generous time and its own log, so
    # `encore run` connects to an already-running daemon instead of racing
    # its startup.
    - nohup encore daemon > e2e-logs/encored.log 2>&1 &
    - sleep 10
    - |
      start_backend() {
        nohup encore run --port=4000 --watch=false > e2e-logs/encore.log 2>&1 &
        echo $! > e2e-logs/encore.pid
      }
      start_backend
    # Migrations + seed (permissions, roles, taxonomy, admin user) run on
    # first DB use during initializeDb(). Cold runners regularly take
    # 60-90s; budget 180s to absorb the worst case while still failing
    # decisively on genuine boot errors. One restart attempt if the process
    # dies outright (e.g. the same daemon-dial race, now against a daemon
    # that should already be up).
    - |
      ok=0
      restarted=0
      for i in $(seq 1 180); do
        pid=$(cat e2e-logs/encore.pid 2>/dev/null || true)
        if [ -n "$pid" ] && ! kill -0 "$pid" 2>/dev/null && [ "$restarted" = "0" ]; then
          echo "[wait] encore run process ($pid) died after ${i}s, restarting once:" >&2
          cat e2e-logs/encore.log >&2 || true
          restarted=1
          start_backend
        fi
        status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
          -H 'Content-Type: application/json' \
          -d '{"email":"admin@example.com","password":"admin"}' \
          http://localhost:4000/auth/login || echo 000)
        case "$status" in
          200|401)
            echo "[wait] backend ready after ${i}s (status=${status})"
            ok=1
            break
            ;;
        esac
        sleep 1
      done
      if [ "$ok" != "1" ]; then
        echo "[wait] backend did not become ready in 180s" >&2
        echo "----- encored.log -----" >&2
        cat e2e-logs/encored.log >&2 || true
        echo "----- encore.log -----" >&2
        cat e2e-logs/encore.log >&2 || true
        echo "----- ps aux -----" >&2
        ps aux >&2 || true
        exit 1
      fi
    - cd frontend && npm run e2e
  after_script:
    - |
      pid=$(cat e2e-logs/encore.pid 2>/dev/null || true)
      if [ -n "$pid" ]; then kill "$pid" 2>/dev/null || true; fi
      encore daemon stop >/dev/null 2>&1 || true
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - frontend/e2e/.report
      - frontend/e2e/.results
      - e2e-logs/encore.log

