# ghcr-cleanup.yml has no equivalent here: configure GitLab's native Container
# Registry Cleanup Policy instead (Settings > Packages and registries >
# Container registry > Cleanup policy) — same "keep N, protect these tags"
# behavior with zero pipeline code. Suggested settings to match the old
# GHCR policy: keep the 10 most recent tags per image, protect tags matching
# ^(latest|buildcache|v?\d+\.\d+\.\d+|pw-\d+\.\d+\.\d+)$.
