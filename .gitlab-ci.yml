# GitLab CI port of the former GitHub Actions workflows (.github/workflows/*.yml,
# excluding claude.yml, which has no GitLab equivalent and was dropped).
#
# Registry: images now live on registry.scheggs.net instead of ghcr.io. The
# main app keeps the project's own image path; sidecar services use sub-paths
# under it (registry.scheggs.net/schegg/fk-encore/<service>) instead of GHCR's
# sibling-repo-with-suffix naming (ghcr.io/as19git67/fk-encore-<service>) —
# that's the GitLab-native way to group several images under one project.
#
# Login: assumes registry.scheggs.net IS this GitLab instance's integrated
# Container Registry, so the predefined $CI_REGISTRY_USER / $CI_REGISTRY_PASSWORD
# (gitlab-ci-token) work without extra setup. If registry.scheggs.net is a
# *different*, external registry, define REGISTRY_USER / REGISTRY_PASSWORD as
# CI/CD variables (Settings > CI/CD > Variables) and swap them into the
# `docker login` calls below.
#
# Runners: the docker-build jobs need a Docker executor with access to a
# Docker daemon (docker:dind service, privileged mode) or an equivalent
# Docker-in-Docker setup. The iOS job needs a macOS runner with Xcode
# registered with the `macos` tag — adjust the tag to match your fleet.
#
# Deploy: every former workflow POSTed to the *same* Watchtower webhook
# regardless of which image it built, so instead of duplicating that call in
# every build job, this file fires it once per pipeline via deploy:test /
# deploy:prod, after whichever build jobs actually ran.

stages:
  - test
  - build
  - deploy
  - cleanup

variables:
  REGISTRY: registry.scheggs.net
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2

# Avoid duplicate pipelines for the same push (branch pipeline + MR pipeline).
# Mirrors: push to main/tags, pull_request, workflow_dispatch (-> web/trigger),
# and the daily cleanup schedule.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'

# ---------------------------------------------------------------------------
# Shared building blocks
# ---------------------------------------------------------------------------

.docker_dind: &docker_dind
  image: docker:27-cli
  services:
    - docker:27-dind

# NOTE: these two anchors must stay single multi-line strings (YAML block
# scalars), not one-element lists — `- *anchor` inside another job's
# before_script list only flattens correctly when the anchor itself resolves
# to a scalar. Anchoring a list here would nest as `- - echo ...` and break
# at runtime (verified against gitlab.scheggs.net's CI lint API).
.registry_login: &registry_login |
  echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$REGISTRY"

# Rebuild of docker/metadata-action's tag logic:
#   latest        -> default-branch pushes
#   <git tag>      -> semver tag pushes (the tag name itself, same as GH's type=semver,pattern={{version}})
#   test          -> merge request pipelines
# Writes a newline-separated list of image refs to tags.txt for the caller to loop over.
.compute_tags: &compute_tags |
  IMAGE="${REGISTRY}/${IMAGE_PATH}"
  : > tags.txt
  if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
    echo "${IMAGE}:latest" >> tags.txt
  fi
  if [ -n "$CI_COMMIT_TAG" ]; then
    echo "${IMAGE}:${CI_COMMIT_TAG}" >> tags.txt
  fi
  if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
    echo "${IMAGE}:test" >> tags.txt
  fi
  echo "Resolved tags:"; cat tags.txt

# ---------------------------------------------------------------------------
# compose-validate.yml -> validate / chown-init-smoke
# ---------------------------------------------------------------------------

compose:validate:
  stage: test
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  rules:
    - changes:
        - docker-compose.yml
        - docker-compose-dev.yml
        - docker-compose.env.example
        - docker-compose.env.test.example
        - .gitlab-ci.yml
  script:
    # --quiet exits non-zero on any syntax / reference / volume-ref error, so
    # this is a cheap guard against broken compose files. The prod file
    # references unset env vars (WATCHTOWER_TOKEN etc.) which compose treats
    # as empty strings — that is fine for a config check.
    - docker compose -f docker-compose.yml config --quiet
    - docker compose --env-file docker-compose.env.test.example -f docker-compose.yml config --quiet
    - docker compose -f docker-compose-dev.yml config --quiet

compose:chown-init-smoke:
  stage: test
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  needs: ["compose:validate"]
  rules:
    - changes:
        - docker-compose.yml
        - docker-compose-dev.yml
        - docker-compose.env.example
        - docker-compose.env.test.example
        - .gitlab-ci.yml
  script:
    # Spins up chown-init against a throwaway compose file mirroring the
    # command + mount layout from docker-compose.yml but with default local
    # volumes (no host bind paths — those point at a specific TrueNAS host
    # and do not exist on CI runners). Proves the command sets 568:568
    # recursively, across a directory that already contains root-owned files.
    - |
      cat > docker-compose.ci.yml <<'EOF'
      services:
        chown-init:
          image: alpine:3.20
          user: "0:0"
          command: ["sh", "-c", "chown -R 568:568 /mnt/documents /mnt/documents-inbox /mnt/models"]
          volumes:
            - documents:/mnt/documents
            - documents_inbox:/mnt/documents-inbox
            - llm_models:/mnt/models
      volumes:
        documents:
        documents_inbox:
        llm_models:
      EOF
    - |
      docker compose -f docker-compose.ci.yml run --rm --user 0:0 \
        --entrypoint sh chown-init -c '
          touch /mnt/documents/seed.pdf \
                /mnt/documents-inbox/seed.pdf \
                /mnt/models/seed.bin
        '
    - docker compose -f docker-compose.ci.yml run --rm chown-init
    - |
      docker compose -f docker-compose.ci.yml run --rm --user 0:0 \
        --entrypoint sh chown-init -c '
          set -e
          for p in /mnt/documents /mnt/documents-inbox /mnt/models; do
            dir_owner=$(stat -c "%u:%g" "$p")
            file_owner=$(stat -c "%u:%g" "$p"/seed.*)
            echo "$p: dir=$dir_owner file=$file_owner"
            [ "$dir_owner" = "568:568" ] || { echo "FAIL: $p dir owner $dir_owner"; exit 1; }
            [ "$file_owner" = "568:568" ] || { echo "FAIL: $p file owner $file_owner"; exit 1; }
          done
          echo "chown-init smoke OK"
        '
  after_script:
    - docker compose -f docker-compose.ci.yml down -v || true

# ---------------------------------------------------------------------------
# docker-image.yml -> main Encore app (two-stage build)
# ---------------------------------------------------------------------------

app:test:
  stage: test
  image: node:24-bookworm
  services:
    - name: pgvector/pgvector:pg18
      alias: postgres
      variables:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: postgres
  variables:
    NODE_ENV: test
    VITEST: "true"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_TEST_DB: encore_test
    POSTGRES_TEST_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/encore_test
  rules: &app_ignore_rules
    # GitLab's `changes:` has no negation/exclude syntax (unlike GH's
    # paths-ignore), so this approximates it: skip when the change set
    # touches one of the ignored service dirs, run otherwise. Deviation from
    # GH: paths-ignore only skips if *every* changed file is ignored; here a
    # commit touching both an ignored dir and something else still skips.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "embedding_service/**/*"
        - "insightface-service/**/*"
        - "geo/**/*"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
      changes:
        - "embedding_service/**/*"
        - "insightface-service/**/*"
        - "geo/**/*"
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
      when: on_success
  script:
    # `npm install`, not `npm ci`: lockfiles have repeatedly drifted between
    # dev platforms in this repo, and `npm ci` would fail CI on every drift.
    - npm install
    # geo/ is a standalone Node container with its own package.json, but
    # Encore's source-code parser walks every .ts in the workspace; without
    # geo/node_modules it fails to resolve `import express`.
    - npm --prefix geo install
    - npm test
    - npm --prefix frontend install --legacy-peer-deps
    - npm --prefix frontend run test
  artifacts:
    paths:
      - frontend/dist
    expire_in: 1 hour

app:build:
  <<: *docker_dind
  stage: build
  needs: ["app:test"]
  variables:
    IMAGE_PATH: "${CI_PROJECT_PATH}"
    VITE_APP_BUILD: "${CI_PIPELINE_IID}-${CI_COMMIT_SHA}"
  rules: *app_ignore_rules
  before_script:
    - apk add --no-cache nodejs npm curl bash
    - *registry_login
    - *compute_tags
  script:
    - npm --prefix frontend install --legacy-peer-deps
    - npm --prefix frontend run build
    # Installs the Encore CLI via the upstream install.sh, as documented at
    # https://encore.dev/docs/ts/self-host/ci-cd. No `-v <version>`: the
    # official docs install the latest GA release; pinning via -v caused
    # install.sh to 403 on the CDN in the past.
    - curl -fsSL --retry 3 --retry-delay 5 -o install.sh https://encore.dev/install.sh
    - bash install.sh
    - export PATH="${HOME}/.encore/bin:${PATH}"
    - rm -f install.sh
    - encore version
    # Stage A — Encore's official production build. Produces a portable
    # image (node:24-bookworm-slim base) with the compiled app + runtime,
    # tagged locally; it never leaves the runner/dind daemon.
    #
    # --config bakes infra-config.json into the image; do NOT use
    # --skip-config, the Encore runtime requires ENCORE_RUNTIME_CONFIG or
    # ENCORE_INFRA_CONFIG_PATH at startup and --skip-config suppresses both,
    # crashing the container immediately.
    - |
      encore build docker \
        --config=infra-config.json \
        --base=node:24-bookworm-slim \
        --os=linux \
        --arch=amd64 \
        fk-encore-raw:build
    # Stage B — thin runtime wrapper: TrueNAS SCALE apps user (568:568),
    # bind-mount directories, the pre-built frontend SPA, APP_BUILD_NUMBER.
    - |
      docker build \
        -f docker/Dockerfile.runtime \
        --build-arg BASE_IMAGE=fk-encore-raw:build \
        --build-arg BUILD_NUMBER="${CI_PIPELINE_IID}-${CI_COMMIT_SHA}" \
        -t app-build:latest \
        .
    - |
      while read -r tag; do
        [ -z "$tag" ] && continue
        docker tag app-build:latest "$tag"
        docker push "$tag"
      done < tags.txt

